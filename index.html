<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14301f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" id="lk-icon" href="data:,">
<link rel="apple-touch-icon" id="lk-apple" href="data:,">
<title>TIP Control</title>
<style>
:root{--bg:#f3efe6;--card:#fffdf8;--ink:#1d2a22;--mut:#66756b;--green:#14301f;--green2:#1f6a42;--lime:#7fb069;--amber:#e0a526;--red:#c2452d;--line:#e3dccd}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
#app{min-height:100vh;display:flex;flex-direction:column}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:20;background:var(--green);color:#f4efe6;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px}
#top .logo{width:34px;height:34px;border-radius:9px;flex:none}
#top .logo.fz{background:#fff;object-fit:contain;padding:2px;display:block!important}
#top h1{font-size:17px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
#top small{display:block;font-size:12px;opacity:.7;font-weight:500}
#top .sp{flex:1}
.net{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.14);display:flex;align-items:center;gap:6px;white-space:nowrap}
.net i{width:8px;height:8px;border-radius:50%;background:var(--lime)}
.net.off i{background:var(--amber)}
#view{padding:16px 16px 96px;max-width:1100px;width:100%;margin:0 auto}
h2{font-size:20px;font-weight:800;letter-spacing:-.015em}
h3{font-size:15px;font-weight:800}
.mut{color:var(--mut)}
.pgh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.pgh p{font-size:13px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.card+.card,.stats+.card,.card+.stats{margin-top:12px}
.grid2>.card{margin-top:0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:2px}
.stat .v small{font-size:13px;font-weight:600;color:var(--mut);letter-spacing:0}
.stat .s{font-size:12px;color:var(--mut)}
.stat.good .v{color:#237a3f}.stat.badv .v{color:var(--red)}
.b{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.b.ok{background:#e1f0da;color:#2c6a2a}.b.warn{background:#fbecc4;color:#7a5600}.b.bad{background:#f8d9d1;color:#9a2c16}.b.mut{background:#ece7da;color:#5c6a60}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--green2);color:#fff;min-height:44px;text-align:center}
.btn.sec{background:#ece7da;color:var(--ink)}
.btn.line{background:transparent;border:1px solid #cfc7b5;color:var(--ink)}
.btn.sm{padding:7px 12px;min-height:34px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:active{transform:scale(.98)}
input,select{width:100%;padding:12px;border:1px solid #cfc7b5;border-radius:10px;font:inherit;background:#fff;color:var(--ink);min-height:44px}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 5px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row .g{flex:1;min-width:0}
.row .g b{display:block}
.row .g span{font-size:13px;color:var(--mut)}
.row .r{text-align:right;font-variant-numeric:tabular-nums}
.row .r b{display:block}
.bar{height:8px;background:#e8e2d3;border-radius:99px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--lime);border-radius:99px}
.bar.warn>i{background:var(--amber)}.bar.bad>i{background:var(--red)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid #cfc7b5;background:transparent;border-radius:99px;padding:7px 14px;font-weight:700;font-size:13px;color:var(--ink)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.linha{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);margin:18px 0 8px}
.linha:first-of-type{margin-top:4px}
.baias{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.baia{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--lime);border-radius:14px;padding:11px 12px;cursor:pointer}
.baia.warn{border-left-color:var(--amber)}.baia.bad{border-left-color:var(--red)}
.baia .bh{display:flex;justify-content:space-between;align-items:baseline}
.baia .bh b{font-size:19px;letter-spacing:-.02em}
.baia .bh span{font-size:12px;color:var(--mut)}
.baia .bn{font-size:13px;color:var(--mut);margin:2px 0 8px;font-variant-numeric:tabular-nums}
.baia .bc{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.dots{display:inline-flex;gap:3px}
.dot{width:12px;height:12px;border-radius:4px;background:#e1dac9}
.dot.on{background:var(--green2)}
.modal{position:fixed;inset:0;background:rgba(10,20,14,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal.hidden{display:none}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:93vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet .x{float:right;border:0;background:#e8e2d3;width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.kv div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.kv small{display:block;font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.kv b{font-size:16px;font-variant-numeric:tabular-nums}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.esc{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0 10px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.opt b{font-size:26px;line-height:1}
.opt span{font-weight:800}
.opt small{font-size:12px;color:var(--mut)}
.opt.sel{border-color:var(--green2);background:#e9f3e2}
.big{font-size:34px!important;font-weight:800;text-align:center;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.step{display:grid;grid-template-columns:64px 1fr 64px;gap:8px;align-items:center}
.chk{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:14px}
.chk input,input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--green2)}
.sw{position:relative;display:inline-block;width:46px;height:26px}.sw input{opacity:0;width:0;height:0;position:absolute}.sw i{position:absolute;inset:0;background:#c9c2b2;border-radius:26px;transition:.15s}.sw i:before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}.sw input:checked+i{background:var(--green2)}.sw input:checked+i:before{transform:translateX(20px)}
.note{font-size:12.5px;color:var(--mut);margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);text-align:right;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
.scroll{overflow-x:auto}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
.ing{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.ing:last-child{border-bottom:0}
.cfgrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
#tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11px;font-weight:700;color:var(--mut)}
#tabs a.on{color:var(--green2)}
svg.ic{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#side{display:none}
#toast{position:fixed;left:50%;top:calc(68px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-16px);background:var(--green);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;color:var(--mut);padding:24px 8px}
.login{position:fixed;inset:0;z-index:100;background:var(--green);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.login.hidden{display:none}
.login .box{background:var(--bg);border-radius:20px;padding:24px 20px;width:100%;max-width:380px}
.login img{width:58px;height:58px;border-radius:14px;display:block;margin:0 auto 10px}
.login img.wide{mix-blend-mode:multiply;width:100%;max-width:280px;height:auto;border-radius:0;margin:0 auto 6px}
.login h1{text-align:center;font-size:22px;font-weight:800;letter-spacing:-.02em}
.login .sub{text-align:center;color:var(--mut);font-size:13px;margin:2px 0 6px}
.login .err{color:var(--red);font-size:13px;font-weight:600;min-height:18px;margin-top:10px}
@media(min-width:700px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .grid2{grid-template-columns:1fr 1fr}
  .modal{align-items:center}.sheet{border-radius:20px}
}
@media(min-width:900px){
  /* tela larga/tablet: menu e conteúdo rolam cada um no seu lado, a página em si não rola */
  html,body{height:100%;overflow:hidden}
  #app{flex-direction:row;height:100vh;height:100dvh;min-height:0}
  #main{height:100vh;height:100dvh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  #tabs{display:none}
  #side{display:flex;flex-direction:column;gap:2px;width:228px;flex:none;background:var(--green);color:#e9e4d6;padding:18px 12px;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  #side .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-weight:800;font-size:18px;letter-spacing:-.01em}
  #side .brand img{width:36px;height:36px;border-radius:9px}
  #side a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;font-weight:600;color:#cfd8cd}
  #side a:hover{background:rgba(255,255,255,.07)}
  #side a.on{background:rgba(255,255,255,.14);color:#fff}
  #top .logo{display:none}
  #view{padding:22px 28px 40px}
  .stats{grid-template-columns:repeat(3,1fr)}
  #toast{top:76px}
}
@media(min-width:1100px){.stats.s4{grid-template-columns:repeat(4,1fr)}}

textarea{width:100%;padding:12px;border:1px solid #cfc7b5;border-radius:10px;font:inherit;background:#fff;color:var(--ink);resize:vertical}
input.mini{width:92px;min-height:36px;padding:6px 8px;text-align:right}
tr.tot td{border-top:2px solid var(--line);font-weight:700}
.distrow{display:grid;grid-template-columns:1fr 96px auto 32px;gap:8px;align-items:center;margin-top:8px}
.distrow span{font-size:12px;min-width:70px;text-align:right}
.rm{border:0;background:#ece7da;width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1;color:var(--ink)}
.ingrow{display:grid;grid-template-columns:1fr 86px 32px;gap:8px;align-items:center;margin-top:8px}
.ingrow .ingi{grid-column:1/-1;font-size:12px;margin-top:-2px}
a.row{color:inherit}
.kv4{grid-template-columns:repeat(2,1fr)}
@media(min-width:700px){.kv4{grid-template-columns:repeat(4,1fr)}}
.s4{grid-template-columns:repeat(2,1fr)}
@media(min-width:900px){.stats.s4{grid-template-columns:repeat(4,1fr)}}
@media(max-width:420px){.distrow{grid-template-columns:1fr 80px 32px}.distrow span{display:none}}
#splash{position:fixed;inset:0;z-index:200;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
#splash img{width:min(100vw,100vh,720px);height:min(100vw,100vh,720px);object-fit:contain}
.hid{display:none!important}
.topout{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:99px;padding:6px 14px;font-weight:700;font-size:13px;white-space:nowrap}
.side-out{margin-top:auto}
body.adm #tabs{display:none}
body.adm #view{padding-bottom:40px}
@media(max-width:480px){.net:not(.off) .nl{display:none}.net{padding:4px 8px}}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#e8e2d3;border-radius:12px;padding:4px;margin:12px 0 4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:10px 6px;font-weight:700;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.gate-ic{font-size:40px;text-align:center;margin-bottom:6px}
.contas .row{cursor:default;align-items:flex-start}
.contas .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.nav-b{background:var(--amber);color:#2b1d00;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:auto}
</style>
</head>

function loteCalc(l){
  const dias=num(l.dias),gmd=num(l.gmd),pi=lotePeso(l),c=num(l.cons)/100,q=loteQtd(l);
  const ganho=dias*gmd,pf=pi+ganho,pm=(pf+pi)/2;

  const ph=pi+gmd*dec,ch=ph*c;

  const st=l.fimReal?'encerrado':(!l.inicio||l.inicio>hoje()?'futuro':(fim&&hoje()>fim?'encerrado':'ativo'));
  return {ganho,pf,pm,ci,cm,cf,ciL:ci*q,cmL:cm*q,cfL:cf*q,perCab:cm*dias,perLote:cm*dias*q,fim,st,dec,pesoHoje:ph,consHoje:ch,consHojeL:ch*q,arrobas:q?(ganho*q*(num(l.rc)||.5))/15:0};
}
function compraCalc(id,st){
  st=st||S;
  const cs=st.compras.filter(c=>c.insumoId===id);
  const comprado=sum(cs,c=>c.qtd),valor=sum(cs,c=>num(c.qtd)*num(c.preco));
  let usado=0;
  st.batidas.forEach(b=>{(b.real||[]).forEach(r=>{if(r.id===id)usado+=num(r.kg)})});
  (st.forn||[]).forEach(h=>{if(h.prodId===id)usado+=num(h.kg)});
  return {comprado,valor,valorKg:comprado?valor/comprado:0,usado,estoque:comprado-usado};
}
function formCalc(f,st){
  st=st||S;
  let soma=0,ms=0,custo=0,pb=0,ndt=0,na=0,am=0,ee=0,iono=0,sd=0,semCompra=[];
  (f.ing||[]).forEach(g=>{
    const i=byId(st.insumos,g.id);if(!i)return;
    const p=num(g.pct)/100,cc=compraCalc(i.id,st),m=num(i.ms)/100;
    soma+=num(g.pct);ms+=p*num(i.ms);custo+=p*cc.valorKg;iono+=p*num(i.iono);
    sd+=p*m;pb+=p*m*num(i.pb);ndt+=p*m*num(i.ndt);na+=p*m*num(i.na);am+=p*m*num(i.am);ee+=p*m*num(i.ee);

  return {soma,ms,custo,pb:sd?pb/sd:0,ndt:sd?ndt/sd:0,na:sd?na/sd:0,am:sd?am/sd:0,ee:sd?ee/sd:0,iono,semCompra};
}
/* receita CARREGADA do fornecimento: proporção dos kg reais lançados na batida (e não a % da fórmula).
   Se o fornecimento teve a receita editada de propósito (marca snapEd), vale a receita editada. */
function snapInfo(h){
  const b=h.batidaId&&byId(S.batidas,h.batidaId),real=b&&(b.real||[]).filter(r=>num(r.kg)>0),T=real?sum(real,r=>num(r.kg)):0;
  if(!b||!real||!real.length||!(T>0)||h.prodId)return {snap:h.snap||[],real:false};
  const hs=h.snap||[],ids=new Set(real.map(r=>r.id));
  /* receita editada de propósito: marcada ao salvar com mudança, ou fórmula/ingredientes diferentes da batida */
  const editado=h.snapEd||(b.formulaId&&h.formulaId&&b.formulaId!==h.formulaId)||hs.length!==ids.size||hs.some(g=>!ids.has(g.id));
  if(editado)return {snap:hs,real:false};
  const plan={};(b.snap&&b.snap.length?b.snap:hs).forEach(g=>{plan[g.id]=num(g.pct)});

/* animal no lote em cada dia (para o cocho): entrada física; 1ª mudança de lote conta desde a entrada */
function cochoLote(a,d){
  const L=a.mov;
  if(L&&L.length){let r='';L.forEach((m,i)=>{const md=i===0&&a.entrada&&a.entrada<m.d?a.entrada:m.d;if(md<=d)r=m.loteId});return r}

/* simula o cocho dia a dia: consumo previsto = cabeças que estavam no pasto naquele dia × consumo por cabeça do lote */
function cochoSim(areaId){
  const ls=S.lotes.filter(l=>l.areaId===areaId),ids=new Set(ls.map(l=>l.id));
  const F=S.forn.filter(h=>h.areaId===areaId).sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:0);
  const consAtual=sum(ls.filter(l=>loteCalc(l).st==='ativo'),l=>loteCalc(l).consHojeL);
  if(!F.length)return {rows:[],saldo:0,consAtual,ever:false};
  const porCab={};ls.forEach(l=>{porCab[l.id]=loteCalc(l).consHoje});
  const A=ALLA().filter(a=>(a.loteId&&ids.has(a.loteId))||(a.mov||[]).some(m=>ids.has(m.loteId)));
  const dias=Math.max(0,diffDias(F[0].data,hoje()));
  const rows=[];let saldo=0,acc=0,fi=0,dem30=0,n30=0;const lim30=addDias(hoje(),-30);
  for(let i=0;i<=dias;i++){
    const d=addDias(F[0].data,i);
    while(fi<F.length&&F[fi].data<=d){const f=F[fi++];saldo+=num(f.kg);rows.push({f,cs:acc,saldo});acc=0}
    if(d<hoje()){
      const cnt={};A.forEach(a=>{const lid=cochoLote(a,d);if(lid&&ids.has(lid))cnt[lid]=(cnt[lid]||0)+1});
      let c=0;ls.forEach(l=>{const n=cnt[l.id]!==undefined?cnt[l.id]:(animaisDoLote(l.id).length?0:(l.inicio&&d>=l.inicio?num(l.qtd):0));c+=n*porCab[l.id]});
      const gasto=Math.min(saldo,c);saldo-=gasto;acc+=gasto;
      if(d>lim30){dem30+=c;n30++}
    }
  }
  /* rows[k].cs = consumo ocorrido ANTES do trato k (desde o anterior) */
  return {rows,saldo,consAtual,ever:true,acc,dem30,n30};
}
function cochoInfo(areaId){
  const ls=S.lotes.filter(l=>l.areaId===areaId&&loteCalc(l).st==='ativo');
  const cons=sum(ls,l=>loteCalc(l).consHojeL),cap=sum(ls,l=>l.cap);
  const s=cochoSim(areaId);
  if(!s.ever)return {cons,cap,saldo:0,dias:0,ever:false};
  const saldo=s.saldo;
  return {cons,cap,saldo,dias:cons>0?saldo/cons:0,ever:true,acima:cap>0&&saldo>cap*1.001};
}

function previstoInsumos(){

VIEWS.painel=()=>{

  {const g={};S.forn.forEach(h=>{const k=h.areaId+'|'+h.data+'|'+Math.round(num(h.kg))+'|'+(h.nome||'');(g[k]=g[k]||[]).push(h)});
   Object.values(g).filter(x=>x.length>1).slice(0,4).forEach(x=>{const ar=area(x[0].areaId);al.push(['warn','Possível trato duplicado: '+(ar?ar.nome:'pasto')+', '+fmtData(x[0].data)+', '+fmt(x[0].kg)+' kg lançado '+x.length+' vezes.','hist'])})}
  S.formulas.forEach(f=>{if(f.ativa!==false){const c=formCalc(f);if(Math.abs(c.soma-100)>.01)al.push(['bad','Formulação “'+f.nome+'” soma '+fmt(c.soma,2)+'% (deveria ser 100%).','formulas']);else if(c.semCompra.length)al.push(['warn','“'+f.nome+'”: sem compra registrada de '+c.semCompra.join(', ')+' — custo subestimado.','formulas'])}});
  ativos.forEach(l=>{const c=loteCalc(l),d=diffDias(hoje(),c.fim);if(d<=7&&d>=0)al.push(['ok','Lote “'+l.nome+'” termina em '+d+' dia(s) ('+fmtData(c.fim)+').','lotes'])});

    if(!vistas.has(l.areaId)){vistas.add(l.areaId);if(nx.cls==='warn')al.push(['warn','“'+l.nome+'”: o cocho deve acabar hoje — hora de tratar.','batida']);if(ci.acima)al.push(['warn','“'+l.nome+'”: '+fmt(ci.saldo)+' kg no cocho, acima da capacidade ('+fmt(ci.cap)+' kg).','lotes'])}

   +'<div class="stat"><div class="l">Animais</div><div class="v">'+fmt(cab)+'</div><div class="s">'+ativos.length+' lote(s) ativo(s) de '+S.lotes.length+'</div></div>'

/* ===== Batida ===== */
function btInit(){
  if(BT&&(!BT.formulaId||formula(BT.formulaId)))return;
  if(!BT)BT={formulaId:'',qtd:'',data:hoje(),real:{},dist:[],modo:'kg'};
  if(!formula(BT.formulaId))BT.formulaId=(S.formulas.find(f=>f.ativa!==false)||{}).id||'';
}
function btCalc(){
  const f=formula(BT.formulaId);if(!f)return null;
  const q=num(BT.qtd);
  const rows=(f.ing||[]).map(g=>{
    const i=insumo(g.id),pl=q*num(g.pct)/100,hasR=BT.real[g.id]!==undefined&&BT.real[g.id]!=='';
    const rl=hasR?num(BT.real[g.id]):0,cc=compraCalc(g.id);
    return {id:g.id,nome:i?i.nome:'(removido)',pct:num(g.pct),pl,rl,vkg:cc.valorKg,val:rl*cc.valorKg,dif:rl-pl,estoque:cc.estoque};
  });
  let acc=0;rows.forEach((r,k)=>{const filled=BT.real[r.id]!==undefined&&BT.real[r.id]!=='';r.filled=filled;r.alvo=acc+r.pl;acc+=filled?r.rl:r.pl;r.leit=filled?sum(rows.slice(0,k+1),x=>x.rl):0});
  const alvoFinal=acc;
  const tp=sum(rows,r=>r.pl),tr=sum(rows,r=>r.rl),tv=sum(rows,r=>r.val);
  const forn=sum(BT.dist,d=>num(d.kg));
  return {f,q,rows,alvoFinal,tp,tr,tv,vkg:tr?tv/tr:0,forn,sobra:tr-forn};
}

   +'<tr class="tot"><td><b>Total</b><br><span class="mut" style="font-size:12px" id="bt-tm"></span></td><td id="bt-tp"></td><td id="bt-tr"></td></tr></table></div>'

  h+='<div class="card"><h3>Distribuição nos pastos</h3>'
   +BT.dist.map((d,k)=>'<div class="distrow"><select id="bt-da-'+k+'">'+opts(S.areas.map(a=>[a.id,a.nome]),d.areaId,'Pasto…')+'</select><input id="bt-dk-'+k+'" inputmode="decimal" value="'+esc(d.kg)+'" placeholder="kg"><span id="bt-dv-'+k+'" class="mut"></span><button class="rm" data-act="btRm" data-i="'+k+'" aria-label="Remover">×</button></div>').join('')

  h+='<button class="btn block" style="margin-top:12px" data-act="btSave">Salvar batida e lançar fornecimento</button><p class="note">Ao salvar, o realizado baixa o estoque dos insumos e cada pasto entra no histórico de fornecimento com a fórmula daquele dia.</p>';

function btRead(){
  const f=formula(BT.formulaId);if(!f||!$('#bt-q'))return;
  BT.qtd=$('#bt-q').value;BT.data=$('#bt-d').value;
  let pa=0;(f.ing||[]).forEach((g,k)=>{const el=$('#bt-r-'+k);if(!el)return;if(BT.modo==='bal'){const v=el.value.trim();if(v===''){BT.real[g.id]='';}else{const r=num(v)-pa;BT.real[g.id]=String(r2(r));pa+=r}}else{BT.real[g.id]=el.value;pa+=num(el.value)}});
  BT.dist=BT.dist.map((d,k)=>({areaId:$('#bt-da-'+k)?$('#bt-da-'+k).value:d.areaId,kg:$('#bt-dk-'+k)?$('#bt-dk-'+k).value:d.kg}));
}
function updBatida(){
  const c=btCalc();if(!c||!$('#bt-tp'))return;
  c.rows.forEach((r,k)=>{
    $('#bt-p-'+k).textContent=fmt(r.pl,1);
    const ea=$('#bt-a-'+k);if(ea)ea.textContent='⚖ parar em '+fmt(r.alvo,1)+' kg'+(r.filled?' · marcou '+fmt(r.leit,1):'');
    const vazio=BT.real[r.id]===''||BT.real[r.id]===undefined;
    $('#bt-m-'+k).textContent=vazio?'valor R$ 0,00':brl(r.val)+' · dif '+(r.dif>0?'+':'')+fmt(r.dif,1)+' kg'+(c.tr?' · '+fmt(r.rl/c.tr*100,1)+'% do realizado':'');
  });
  $('#bt-tp').textContent=fmt(c.tp,1)+' · balança final '+fmt(c.alvoFinal,1);$('#bt-tr').textContent=fmt(c.tr,1);$('#bt-tm').textContent=brl(c.tv)+' · dif '+(c.tr-c.tp>0?'+':'')+fmt(c.tr-c.tp,1)+' kg';
  const falta=c.rows.filter(r=>r.rl>0&&r.rl>r.estoque).map(r=>r.nome+' (estoque '+fmt(r.estoque)+' kg)');
  const sem=c.rows.filter(r=>!r.vkg).map(r=>r.nome);
  $('#bt-warn').innerHTML=(falta.length?'<p class="note" style="color:var(--red)">Estoque insuficiente: '+esc(falta.join(', '))+'.</p>':'')+(sem.length?'<p class="note" style="color:var(--amber)">Sem compra registrada (custo R$ 0): '+esc(sem.join(', '))+'.</p>':'');
  BT.dist.forEach((d,k)=>{const el=$('#bt-dv-'+k);if(el)el.textContent=brl(num(d.kg)*c.vkg)});
  $('#bt-s1').textContent=fmt(c.tr,1)+' kg';$('#bt-s2').textContent=brl(c.vkg);$('#bt-s3').textContent=fmt(c.forn,1)+' kg';
  const s=$('#bt-s4');s.textContent=fmt(c.sobra,1)+' kg';s.style.color=c.sobra<-0.05?'var(--red)':'';
}

function loteOrigemPeso(l){
  const A=animaisDoLote(l.id);if(!A.length)return '';
  const f=l.pesoRef==='fazenda';
  const pe=sum(A,a=>num(a.pesoIn))/A.length;
  let n=0;if(!f)A.forEach(a=>{const d=entradaNoLote(a,l);if(d&&pontosPeso(a).some(x=>Math.abs(diffDias(x.d,d))<=15))n++});
  const vivo=sum(A,a=>{const p=pontosPeso(a);return p.length?p[p.length-1].kg:0})/A.length;

function loadXLSX(){return window.XLSX?Promise.resolve():new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=ok;sc.onerror=()=>no(new Error('offline'));document.head.appendChild(sc)})}
const IMP_COLS=['Brinco','Sexo','Categoria','Nascimento','Raça','Proprietário','Origem','Data de entrada','Peso de compra','Valor por kg','Lote'];

const nrm=x=>String(x==null?'':x).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const IMP_MAP={brinco:['brinco','identificacao','id','numero','nbrinco','nrbrinco','animal'],sexo:['sexo'],cat:['categoria','cat'],nasc:['nascimento','datanascimento','nasc','dtnasc','datadenascimento'],idade:['idade','idademeses','idadeemmeses','meses'],raca:['raca'],dono:['proprietario','dono'],origem:['origem','procedencia'],entrada:['entrada','dataentrada','dtentrada','datadeentrada'],peso:['peso','pesocompra','pesodecompra','pesoentrada','pesodeentrada','pesokg'],valorKg:['valorkg','valorporkg','rkg','valorkgpago','precokg','valorporkgpago'],valor:['valor','valorpago','valortotal','total'],lote:['lote']};
function impNum(v){if(typeof v==='number')return v;let t=String(v==null?'':v).replace(/[R$\s]/g,'');if(t.includes(',')&&t.includes('.'))t=t.replace(/\./g,'');return num(t)}
function impData(v){
  if(v==null||v==='')return '';
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5);return d.toISOString().slice(0,10)}
  if(v instanceof Date)return new Date(v.getTime()+12*36e5).toISOString().slice(0,10);
  const t=String(v).trim();let m;
  if((m=t.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/))){const y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')}
  if((m=t.match(/^(\d{4})-(\d{2})-(\d{2})/)))return m[1]+'-'+m[2]+'-'+m[3];
  return '';
}
function impParse(rows){
  const hdr=rows[0].map(nrm),ix={};
  Object.keys(IMP_MAP).forEach(k=>{const j=hdr.findIndex(h=>IMP_MAP[k].includes(h));if(j>=0)ix[k]=j});
  if(ix.brinco==null)return {erro:'Não encontrei a coluna “Brinco” na primeira linha.'};
  const ex=new Set(S.animais.map(a=>String(a.brinco).toLowerCase())),vistos=new Set(),ok=[],dup=[],vazio=[],semLote=new Set();
  const lotes=new Map(S.lotes.map(l=>[nrm(l.nome),l]));
  rows.slice(1).forEach(r=>{
    const g=k=>ix[k]==null?'':r[ix[k]];
    const brinco=String(g('brinco')==null?'':g('brinco')).trim();
    if(!r.some(c=>c!==''&&c!=null))return;
    if(!brinco){vazio.push(1);return}
    const key=brinco.toLowerCase();
    if(ex.has(key)||vistos.has(key)){dup.push(brinco);return}
    vistos.add(key);
    const sx=nrm(g('sexo')).startsWith('f')?'Fêmea':'Macho';
    let nasc=impData(g('nasc'));
    if(!nasc&&g('idade')!==''){const m=impNum(g('idade'));if(m>0)nasc=addDias(hoje(),-Math.round(m*30.4375))}
    const cn=nrm(g('cat')),cat=CATS_ANIMAL.find(c=>nrm(c)===cn)||catSugerida(sx,idadeMeses(nasc))||'';
    const pesoIn=impNum(g('peso'));let valorKg=impNum(g('valorKg')),valor=impNum(g('valor'));
    if(valorKg>0)valor=r2(pesoIn*valorKg);else if(valor>0&&pesoIn>0)valorKg=r2(valor/pesoIn);
    let loteId='';const ln=String(g('lote')==null?'':g('lote')).trim();
    if(ln){const l=lotes.get(nrm(ln));if(l)loteId=l.id;else semLote.add(ln)}
    ok.push({id:uid(),brinco,sexo:sx,cat,nasc,raca:String(g('raca')||'').trim(),dono:String(g('dono')||'').trim(),origem:String(g('origem')||'').trim(),entrada:impData(g('entrada'))||hoje(),pesoIn,valorKg,valor,loteId});
  });
  return {ok,dup,vazio:vazio.length,semLote:[...semLote]};
}
let IMPARQ='';
function impLer(file){
  IMPARQ=file.name||'';
  const box=$('#imp-r');box.innerHTML='<p class="note">Lendo planilha…</p>';
  loadXLSX().then(()=>file.arrayBuffer()).then(buf=>{
    const wb=XLSX.read(buf,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
    if(rows.length<2){box.innerHTML='<p class="note" style="color:var(--red)">A planilha está vazia.</p>';return}
    const r=impParse(rows);

     +(r.dup.length?'<p class="note">Brinco já cadastrado ou repetido (ignorados): '+esc(r.dup.slice(0,8).join(', '))+(r.dup.length>8?'…':'')+'</p>':'')
     +(r.vazio?'<p class="note">'+r.vazio+' linha(s) sem brinco ignorada(s).</p>':'')
     +(r.semLote.length?'<p class="note">Lote não encontrado (ficam sem lote): '+esc(r.semLote.join(', '))+'. Crie o lote em Lotes e atribua depois.</p>':'')
     +(r.ok.length?'<div class="scroll"><table><tr><th>Brinco</th><th>Categoria</th><th>Peso</th><th>Valor</th></tr>'+r.ok.slice(0,5).map(a=>'<tr><td>'+esc(a.brinco)+'</td><td>'+esc(a.cat||'—')+'</td><td>'+fmt(a.pesoIn)+'</td><td>'+brl(a.valor)+'</td></tr>').join('')+'</table></div><p class="note">'+(r.ok.length>5?'Mostrando 5 de '+r.ok.length+'.':'')+'</p><button type="button" class="btn block" data-act="impGo">Importar '+r.ok.length+' animais</button>':'');
  }).catch(()=>{box.innerHTML='<p class="note" style="color:var(--red)">Não consegui ler o arquivo. Precisa de internet para abrir planilhas; confira também se é .xlsx, .xls ou .csv.</p>'});
}

function mFormula(id){
  const f=id?formula(id):{nome:'',tipo:'',ativa:true,ing:[]};
  FD={id:id||'',rows:(f.ing.length?f.ing.map(g=>({id:g.id,pct:g.pct})):[{id:'',pct:''},{id:'',pct:''},{id:'',pct:''}]),nome:f.nome,tipo:f.tipo,ativa:f.ativa!==false};
  renderFormula();
}
function readFD(){
  if(!FD||!$('#fm-n'))return;
  FD.nome=$('#fm-n').value;FD.tipo=$('#fm-t').value;FD.ativa=$('#fm-a').value==='1';
  FD.rows=FD.rows.map((r,k)=>({id:$('#fi-'+k).value,pct:$('#fp-'+k).value}));
}
function renderFormula(){
  const rows=FD.rows.map((r,k)=>'<div class="ingrow"><select id="fi-'+k+'">'+opts(S.insumos.filter(i=>!i.acabado||i.id===r.id).map(i=>[i.id,i.nome]),r.id,'Ingrediente…')+'</select><input id="fp-'+k+'" inputmode="decimal" value="'+esc(r.pct)+'" placeholder="%"><button type="button" class="rm" data-act="fmRm" data-i="'+k+'" aria-label="Remover">×</button><span id="fr-'+k+'" class="mut ingi"></span></div>').join('');
  sheet('<h2>'+(FD.id?'Formulação':'Nova formulação')+'</h2><form data-form="formula">'+fld('fm-n','Nome',FD.nome,{txt:1})
   +'<div class="cfgrow">'+selF('fm-t','Tipo',S.cfg.listas.tipos,FD.tipo,'Selecione…')+selF('fm-a','Situação',[['1','Ativa'],['0','Inativa']],FD.ativa?'1':'0')+'</div>'
   +'<label>Ingredientes e inclusão (%)</label>'+rows+(FD.rows.length<12?'<button type="button" class="btn sec sm" style="margin-top:8px" data-act="fmAdd">+ Ingrediente</button>':'')
   +'<div id="fm-tot"></div><button class="btn block" style="margin-top:12px">Salvar formulação</button></form>'+(FD.id?delBtn('formulas',FD.id):''));
  updFormula();
}
function fdTemp(){return {ing:FD.rows.filter(r=>r.id).map(r=>({id:r.id,pct:num(r.pct)}))}}
function updFormula(){
  if(!FD||!$('#fm-tot'))return;
  readFD();
  const c=formCalc(fdTemp());
  FD.rows.forEach((r,k)=>{const i=insumo(r.id),el=$('#fr-'+k);if(!el)return;
    el.textContent=i?'MS '+fmt(i.ms)+'% · '+brl(compraCalc(i.id).valorKg)+'/kg · contrib. '+brl(num(r.pct)/100*compraCalc(i.id).valorKg)+'/kg':''});
  const ok=Math.abs(c.soma-100)<=.01;
  $('#fm-tot').innerHTML='<div class="kv" style="grid-template-columns:repeat(3,1fr)">'+kv('Soma','<span style="color:'+(ok?'#237a3f':'var(--red)')+'">'+fmt(c.soma,2)+'%</span>')+kv('MS',fmt(c.ms,1)+'%')+kv('R$/kg',brl(c.custo))+kv('PB (na MS)',fmt(c.pb,1)+'%')+kv('NDT (na MS)',fmt(c.ndt,1)+'%')+kv('Na (na MS)',fmt(c.na,2)+'%')+kv('Amido (na MS)',fmt(c.am,1)+'%')+kv('EE (na MS)',fmt(c.ee,1)+'%')+kv('Ionóforo',fmt(c.iono,1)+' mg/kg')+'</div>'
   +(ok?'':'<p class="note" style="color:var(--red)">A soma das inclusões precisa fechar 100% para salvar.</p>')+(c.semCompra.length?'<p class="note">Sem compra registrada: '+esc(c.semCompra.join(', '))+' (custo R$ 0).</p>':'');
}
function mForn(id){
  const h=byId(S.forn,id),a=area(h.areaId),SI=snapInfo(h);
  sheet('<h2>'+esc(a?a.nome:'Fornecimento')+'</h2><div class="kv">'+kv('Data',fmtData(h.data))+kv('Quantidade',fmt(h.kg)+' kg')+kv('Valor',brl(h.valor))+'</div><p class="note" style="margin-top:0">'+(h.prodId?'Produto acabado <b>'+esc(h.nome)+'</b> levado ao lote'+(byId(S.lotes,h.loteId)?' <b>'+esc(byId(S.lotes,h.loteId).nome)+'</b>':'')+':':'Fórmula <b>'+esc(h.nome)+'</b> — '+(SI.real?'o que foi <b>carregado</b> na batida (kg reais):':'receita gravada no dia do fornecimento:'))+'</p>'
   +'<div class="card" style="margin-top:8px">'+SI.snap.map(g=>{const i=insumo(g.id),pl=SI.real&&SI.plan[g.id]!=null?SI.plan[g.id]:null;return '<div class="ing"><span>'+esc(i?i.nome:'(removido)')+(pl!=null&&Math.abs(pl-g.pct)>=.05?' <small class="mut">fórmula '+fmt(pl,2)+'%</small>':'')+'</span><b>'+fmt(g.pct,2)+'% · '+fmt(h.kg*g.pct/100,1)+' kg</b></div>'}).join('')+'</div>'
   +'<button type="button" class="btn block" style="margin-top:10px" data-act="fornEd" data-id="'+id+'">Editar fornecimento</button>'+delBtn('forn',id)+(h.batidaId&&byId(S.batidas,h.batidaId)?(isOwner()?'<button type="button" class="btn line block" style="margin-top:8px;color:var(--red)" data-act="del" data-k="batidas" data-id="'+h.batidaId+'">Excluir a batida inteira (devolve o estoque)</button>':''):''));
}

/* ===== formulários ===== */
const FORMS={};
FORMS.lote=()=>{
  const id=$('[data-form=lote]').dataset.id,o=readLote();delete o.id;
  if(!o.nome)return toast('Informe o nome do lote');
  if(!o.areaId)return toast('Escolha o pasto destino');
  if(!(o.dias>0))return toast('Informe os dias');
  let nid=id;
  if(id)Object.assign(byId(S.lotes,id),o);else{nid=uid();S.lotes.push(Object.assign({id:nid},o))}
  save();closeModal();render(false);
  if(!id&&S.animais.some(a=>!a.loteId))mAlocar(nid);else toast('Lote salvo');
};
function saveAnimal(){
  const id=$('[data-form=animal]').dataset.id,brinco=$('#an-b').value.trim();
  if(!brinco){toast('Informe o brinco');return null}
  if(S.animais.some(a=>String(a.brinco).toLowerCase()===brinco.toLowerCase()&&a.id!==id)){toast('Já existe um animal com esse brinco');return null}
  const pesoIn=num($('#an-p').value),valorKg=num($('#an-k').value);
  const o={brinco,sexo:$('#an-s').value,cat:$('#an-c').value,nasc:$('#an-n').value,raca:$('#an-r').value,dono:$('#an-d').value.trim(),origem:$('#an-o').value.trim(),entrada:$('#an-e').value,pesoIn,valorKg,valor:r2(pesoIn*valorKg),loteId:$('#an-l').value};
  if(o.nasc&&o.nasc>hoje()){toast('Nascimento não pode ser no futuro');return null}
  if(id){const a=byId(S.animais,id),nl=o.loteId;o.loteId=a.loteId||'';Object.assign(a,o);if(nl!==(a.loteId||''))moverAnimal(a,nl,hoje())}else S.animais.push(Object.assign({id:uid()},o));
  save();return o;
}
FORMS.animal=()=>{if(saveAnimal()){closeModal();render(false);toast('Animal salvo')}};
FORMS.varios=()=>{
  const p=$('#bk-p').value.trim(),i0=Math.round(num($('#bk-i').value)),q=Math.round(num($('#bk-q').value));
  if(!(q>0)||q>500)return toast('Informe a quantidade (1 a 500)');
  const pesoIn=num($('#bk-w').value),valorKg=num($('#bk-k').value);
  const w=String(i0+q-1).length,ex=new Set(S.animais.map(a=>String(a.brinco).toLowerCase()));
  const novos=[];
  for(let n=0;n<q;n++){const b=p+String(i0+n).padStart(w,'0');if(ex.has(b.toLowerCase()))return toast('Brinco '+b+' já existe');
    novos.push({id:uid(),brinco:b,sexo:$('#bk-s').value,cat:$('#bk-c').value,nasc:'',raca:$('#bk-r').value,dono:$('#bk-d').value.trim(),origem:$('#bk-o').value.trim(),entrada:$('#bk-e').value,pesoIn,valorKg,valor:r2(pesoIn*valorKg),loteId:$('#bk-l').value})}
  S.animais.push(...novos);save();closeModal();render(false);toast(q+' animais cadastrados');
};
FORMS.area=()=>{
  const id=$('[data-form=area]').dataset.id,nome=$('#ar-n').value.trim(),m2=num($('#ar-m').value);
  if(!nome)return toast('Informe o nome');
  if(S.areas.some(a=>a.nome.toLowerCase()===nome.toLowerCase()&&a.id!==id))return toast('Já existe uma área com esse nome');
  if(id)Object.assign(area(id),{nome,m2});else S.areas.push({id:uid(),nome,m2});
  save();closeModal();render(false);toast('Área salva');
};
FORMS.insumo=()=>{
  const id=$('[data-form=insumo]').dataset.id,nome=$('#in-n').value.trim();
  if(!nome)return toast('Informe o nome');
  if(S.insumos.some(i=>i.nome.toLowerCase()===nome.toLowerCase()&&i.id!==id))return toast('Já existe um insumo com esse nome');
  const o={nome,cat:$('#in-c').value,un:'kg',saco:num($('#in-s').value),ms:num($('#in-ms').value),pb:num($('#in-pb').value),ndt:num($('#in-ndt').value),na:num($('#in-na').value),am:num($('#in-am').value),ee:num($('#in-ee').value),iono:num($('#in-io').value)};
  if(o.ms<=0||o.ms>100)return toast('MS deve estar entre 0 e 100%');
  o.acabado=$('#in-u').value==='p';
  if(o.acabado&&id&&S.formulas.some(f=>(f.ing||[]).some(g=>g.id===id)))return toast('Esse insumo está em uma fórmula; tire-o da fórmula antes de marcar como pronto para uso');
  if(!o.acabado)delete o.acabado;
  if(id)Object.assign(insumo(id),o);else S.insumos.push(Object.assign({id:uid()},o));
  if(id&&!o.acabado&&insumo(id).acabado)delete insumo(id).acabado;save();closeModal();render(false);toast(o.acabado?'Salvo em Fornecimento › Produtos acabados':'Insumo salvo');
};
FORMS.compra=()=>{
  const id=$('[data-form=compra]').dataset.id;
  const o={insumoId:$('#cp-i').value,qtd:num($('#cp-q').value),preco:num($('#cp-p').value),forn:$('#cp-f').value.trim(),data:$('#cp-d').value};
  if(!o.insumoId)return toast('Escolha a matéria-prima');
  if(!(o.qtd>0))return toast('Informe a quantidade');
  if(!(o.preco>0))return toast('Informe o valor do kg');
  if(!o.data)return toast('Informe a data de chegada');
  if(id)Object.assign(byId(S.compras,id),o);else S.compras.push(Object.assign({id:uid()},o));
  save();closeModal();render(false);toast('Compra registrada · estoque atualizado');
};
FORMS.formula=()=>{
  readFD();
  const nome=FD.nome.trim();
  if(!nome)return toast('Informe o nome da formulação');
  const ing=FD.rows.filter(r=>r.id||num(r.pct)).map(r=>({id:r.id,pct:num(r.pct)}));
  if(ing.some(g=>!g.id))return toast('Escolha o ingrediente de cada linha');
  if(ing.some(g=>!(g.pct>0)))return toast('Informe a inclusão (%) de cada ingrediente');
  if(new Set(ing.map(g=>g.id)).size!==ing.length)return toast('Ingrediente repetido na fórmula');
  if(!ing.length)return toast('Adicione ao menos um ingrediente');
  const soma=sum(ing,g=>g.pct);
  if(Math.abs(soma-100)>.01)return toast('A soma das inclusões é '+fmt(soma,2)+'% — precisa ser 100%');
  if(S.formulas.some(f=>f.nome.toLowerCase()===nome.toLowerCase()&&f.id!==FD.id))return toast('Já existe uma formulação com esse nome');
  const o={nome,tipo:FD.tipo,ativa:FD.ativa,ing};
  if(FD.id)Object.assign(formula(FD.id),o);else S.formulas.push(Object.assign({id:uid()},o));
  save();closeModal();FD=null;render(false);toast('Formulação salva');
};
function btSave(){
  btRead();
  const c=btCalc();
  if(!c)return toast('Escolha a fórmula');
  if(!BT.data)return toast('Informe a data');
  if(!(c.q>0))return toast('Informe a quantidade a fabricar');
  if(Math.abs(sum(c.f.ing,g=>g.pct)-100)>.01)return toast('A fórmula não soma 100% — corrija em Formulações');
  if(!(c.tr>0)){c.rows.forEach(r=>{BT.real[r.id]=String(r2(r.pl))});updBatida();return toast('Realizado vazio: preenchi com o planejado. Confira e salve de novo.')}
  const dist=BT.dist.filter(d=>d.areaId||num(d.kg));
  if(dist.some(d=>!d.areaId||!(num(d.kg)>0)))return toast('Complete pasto e kg em cada linha da distribuição');
  if(!dist.length)return toast('Distribua a ração em ao menos um pasto');
  if(sum(dist,d=>num(d.kg))>c.tr*1.0001)return toast('Você distribuiu mais do que produziu ('+fmt(c.tr,1)+' kg)');
  const bid=uid(),snap=c.f.ing.map(g=>({id:g.id,pct:num(g.pct)}));
  S.batidas.push({id:bid,data:BT.data,formulaId:c.f.id,formulaNome:c.f.nome,qtd:c.q,snap,real:c.rows.map(r=>({id:r.id,kg:r2(r.rl)})),custoKg:r2(c.vkg*1000)/1000,total:r2(c.tv),dist:dist.map(d=>({areaId:d.areaId,kg:num(d.kg)}))});
  dist.forEach(d=>S.forn.push({id:uid(),batidaId:bid,areaId:d.areaId,data:BT.data,formulaId:c.f.id,nome:c.f.nome,kg:num(d.kg),valor:r2(num(d.kg)*c.vkg),snap}));
  const fid=c.f.id;BT={formulaId:fid,qtd:'',data:hoje(),real:{},dist:[]};
  save();toast('Batida salva · fornecimento lançado');location.hash='#hist';
}

  btPlan:()=>{btRead();const c=btCalc();c.rows.forEach(r=>{BT.real[r.id]=String(r2(r.pl))});render(false)},
  btSug:()=>{
    btRead();
    const m=new Map();
    const ars=[...new Set(S.lotes.filter(l=>loteCalc(l).st==='ativo'&&l.areaId).map(l=>l.areaId))];
    let adiados=0;
    ars.forEach(id=>{const ci=cochoInfo(id);
      if(ci.cap>0&&ci.ever){if(ci.dias<=1){const need=Math.max(0,ci.cap-ci.saldo);if(need>0)m.set(id,need)}else adiados++}
      else m.set(id,ci.cons)});
    if(!m.size)return toast(adiados?'Nenhum cocho precisa de trato hoje (ainda há ração)':'Nenhum lote ativo hoje');
    BT.dist=[...m].map(([areaId,kg])=>({areaId,kg:String(Math.round(kg))}));
    if(!num(BT.qtd))BT.qtd=String(Math.round(sum(BT.dist,d=>d.kg)));

  admSet:async(d)=>{

  },
  demoSelf:()=>{
    if(S.animais.length||S.lotes.length)return toast('A fazenda já tem dados');
    const listas=S.cfg.listas,nome=S.cfg.fazenda;
    S=demoFazenda(nome);S.cfg.listas=Object.assign({},LISTAS0,listas);
    save();location.hash='#painel';render(true);toast('Demonstração carregada: '+S.animais.length+' animais');

  admDemo:async(d,t)=>{
    if(!isSuper())return;
    if(!t.dataset.arm){t.dataset.arm=1;t.textContent='Confirmar: substitui os dados do cliente';return}
    t.disabled=true;t.textContent='Carregando…';
    try{
      const st=demoFazenda(d.nm||'Fazenda'),b='u/'+d.id+'/',docs=[['cfg/main',st.cfg]];
      COLS.forEach(c=>st[c].forEach(o=>docs.push([c+'/'+o.id,o])));

      toast('Demonstração carregada: '+st.animais.length+' animais');
    }catch(e){toast(msgFS(e))}
    t.disabled=false;t.textContent='Carregar demonstração';delete t.dataset.arm;
  },

  },
  del:(d,t)=>{
    if(!isOwner())return toast('Somente administradores podem excluir');
    if(!t.dataset.arm){t.dataset.arm=1;t.textContent='Toque de novo para confirmar a exclusão';return}
    const k=d.k,id=d.id;

    if(k==='insumos'&&(S.compras.some(c=>c.insumoId===id)||S.forn.some(h=>h.prodId===id)||S.formulas.some(f=>f.ing.some(g=>g.id===id))))return toast('Insumo tem compras ou está em formulação — não dá para excluir');
    if(k==='batidas')S.forn=S.forn.filter(h=>h.batidaId!==id);
    S[k]=S[k].filter(x=>x.id!==id);
    save();closeModal();render(false);toast('Excluído');
  }
};

/* ---- Excel (ou CSV se estiver sem internet) ---- */
/* datas AAAA-MM-DD viram data real do Excel, exibida dd/mm/aaaa; no CSV saem como texto dd/mm/aaaa */
const isoBR=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s);
const csvData=aoa=>aoa.map(r=>r.map(c=>isoBR(c)?c.slice(8,10)+'/'+c.slice(5,7)+'/'+c.slice(0,4):c));
function xlsSheet(aoa,wch){
  /* data como número de série do Excel (sem fuso) com formato dd/mm/aaaa */
  const ws=XLSX.utils.aoa_to_sheet(aoa.map(r=>r.map(c=>isoBR(c)?{t:'n',v:Math.round(Date.UTC(+c.slice(0,4),+c.slice(5,7)-1,+c.slice(8,10))/86400000)+25569,z:'dd/mm/yyyy'}:c)));
  if(wch)ws['!cols']=wch.map(w=>({wch:w}));return ws;
}
function baixarTabela(nome,aoa,wch){
  const csv=()=>{
    const t='﻿'+csvData(aoa).map(r=>r.map(c=>{const s=typeof c==='number'?String(c).replace('.',','):String(c==null?'':c);return '"'+s.replace(/"/g,'""')+'"'}).join(';')).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download=nome+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
    toast('Sem internet: baixei em CSV (abre no Excel)');
  };
  Promise.race([loadXLSX(),new Promise((_,no)=>setTimeout(no,5000))]).then(()=>{
    const ws=xlsSheet(aoa,wch);
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Dados');XLSX.writeFile(wb,nome+'.xlsx');toast('Excel baixado');
  }).catch(csv);
}

/* ---- peso e presença do animal ao longo do tempo ---- */
function pontosPeso(a){
  const p=[];if(a.entrada&&num(a.pesoIn)>0)p.push({d:a.entrada,kg:num(a.pesoIn)});
  (a.pes||[]).forEach(x=>{if(x.d&&num(x.kg)>0)p.push({d:x.d,kg:num(x.kg)})});
  return p.sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:0);
}
let FMIN=null;
/* presença física: o animal conta no pasto desde a data de entrada (e não desde o início do lote, que é só data de planejamento).
   FMIN = 1º trato de cada pasto no período. Modo "todos": todos os animais do lote contam desde o 1º trato.
   Retroativo (opcional): quem já estava no lote desde o início também recebe tratos anteriores à própria entrada. */
function movsEf(a){
  const L=a.mov;if(!L||!L.length)return L;
  if(fCu.modo==='todos'){const f=FMIN&&FMIN[L[0].loteId];return f&&f<L[0].d?[Object.assign({},L[0],{d:f})].concat(L.slice(1)):L}
  if(!a.entrada||a.entrada>=L[0].d)return L;
  return [Object.assign({},L[0],{d:a.entrada})].concat(L.slice(1));
}
function iniEfetivo(a,l){
  const base=a.entrada||(l&&l.inicio)||'';
  const f=FMIN&&l&&FMIN[l.id];
  if(fCu.modo==='todos')return f||base;
  if(fCu.retro===true&&f&&f<base&&(!l.inicio||!a.entrada||a.entrada<=l.inicio))return f;
  return base;
}
function loteDoAnimalEm(a,d){
  const L=movsEf(a);
  if(!L||!L.length){
    if(!a.loteId)return '';
    const l=byId(S.lotes,a.loteId);
    const start=iniEfetivo(a,l);
    return d>=start?a.loteId:'';
  }
  let r='';for(const m of L){if(m.d<=d)r=m.loteId;else break}return r;
}
function pesoEm(a,d,P){
  const p=P||pontosPeso(a);if(!p.length)return 0;
  if(d<=p[0].d)return p[0].kg;
  for(let i=1;i<p.length;i++){
    if(d<=p[i].d){const t=diffDias(p[i-1].d,p[i].d)||1,u=diffDias(p[i-1].d,d);return p[i-1].kg+(p[i].kg-p[i-1].kg)*u/t}
  }
  const last=p[p.length-1],l=byId(S.lotes,loteDoAnimalEm(a,d));
  return last.kg+(l?num(l.gmd):0)*Math.max(0,diffDias(last.d,d));
}
function moverAnimal(a,loteId,data,datado){
  loteId=loteId||'';if((a.loteId||'')===loteId)return false;
  if(!datado&&!a.loteId&&!(a.mov&&a.mov.length)){a.loteId=loteId;return true}
  if(!a.mov||!a.mov.length){
    a.mov=[];
    if(a.loteId){const l=byId(S.lotes,a.loteId);a.mov.push({d:a.entrada||(l&&l.inicio)||data,loteId:a.loteId})}
  }
  a.mov=a.mov.filter(m=>m.d<data);a.mov.push({d:data,loteId});a.loteId=loteId;return true;
}

/* ---- ingredientes de cada trato (para a cobrança por proprietário): kg e R$ de cada insumo, fechando com o valor do trato ---- */
let ING=false,PRC=new Map();
const prC=id=>{if(!PRC.has(id))PRC.set(id,compraCalc(id).valorKg);return PRC.get(id)};
function fornMix(h){
  const kgT=num(h.kg),vT=num(h.valor),m={kg:0,v:vT,it:{}};
  const it=snapCarregado(h).map(g=>{const k=kgT*num(g.pct)/100;return {id:g.id,kg:k,w:k*prC(g.id)}}),wT=sum(it,x=>x.w),kT=sum(it,x=>x.kg);
  it.forEach(x=>{const o=m.it[x.id]||(m.it[x.id]={kg:0,v:0});o.kg+=x.kg;o.v+=wT>0?vT*x.w/wT:(kT>0?vT*x.kg/kT:0);m.kg+=x.kg});
  return m;
}
function mixSoma(list){
  const m={kg:0,v:0,it:{}};
  list.forEach(h=>{const x=fornMix(h);m.kg+=x.kg;m.v+=x.v;for(const id in x.it){const o=m.it[id]||(m.it[id]={kg:0,v:0});o.kg+=x.it[id].kg;o.v+=x.it[id].v}});
  return m;
}
function addIng(r,mix,kg,v){
  if(!mix)return;
  if(!r.ing)r.ing={};
  for(const id in mix.it){const x=mix.it[id],o=r.ing[id]||(r.ing[id]={kg:0,v:0});if(mix.kg>0)o.kg+=kg*x.kg/mix.kg;if(mix.v>0)o.v+=v*x.v/mix.v}
}
/* rateio "fechando no próximo trato" (sistema de caixa): o trato é consumido ao longo dos dias até o dia anterior ao próximo trato.
   Cada dia pesa pelo que os animais presentes consomem (peso × % do lote): dia com mais animais leva mais do trato, quem entrou no meio
   só paga os dias em que estava lá. O último trato (ainda no cocho) vai sendo consumido pelo previsto e o que sobra é o saldo. */
function ratearFechado(de,ate,P,nl,pa,sobra){
  const hj=hoje();
  S.areas.forEach(ar=>{
    const ls=S.lotes.filter(l=>l.areaId===ar.id);if(!ls.length)return;
    const ids=new Set(ls.map(l=>l.id));
    const F=S.forn.filter(h=>h.areaId===ar.id&&h.data<=hj).sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:0);
    if(!F.length)return;
    const G=[];F.forEach(h=>{const g=G[G.length-1];if(g&&g.d===h.data){g.kg+=num(h.kg);g.v+=num(h.valor);g.fs.push(h)}else G.push({d:h.data,kg:num(h.kg),v:num(h.valor),fs:[h]})});
    const pc={},cp={};ls.forEach(l=>{pc[l.id]=loteCalc(l).consHoje;cp[l.id]=(num(l.cons)/100)||.02});
    /* pasto finalizado (todos os lotes dele com fimReal): o último trato é fechado nessa data, como se fosse o próximo trato */
    const AC=ls.every(l=>l.fimReal)?ls.map(l=>l.fimReal).sort().pop():'';
    const A=ALLA().filter(a=>((a.loteId&&ids.has(a.loteId))||(a.mov||[]).some(m=>ids.has(m.loteId))));
    const dia=d=>{
      const grp={};A.forEach(a=>{const lid=loteDoAnimalEm(a,d);if(lid&&ids.has(lid))(grp[lid]=grp[lid]||[]).push(a)});
      const it=[],sem=[];let tot=0;
      ls.forEach(l=>{const g=grp[l.id];
        if(g&&g.length)g.forEach(a=>{const p=pesoEm(a,d,P.get(a.id)),w=p>0?p*cp[l.id]:pc[l.id];it.push({a,l,w});tot+=w});
        else if(!loteTemReg(l.id)&&l.inicio&&d>=l.inicio&&num(l.qtd)>0){const w=num(l.qtd)*pc[l.id];sem.push({l,w});tot+=w}});
      return {d,it,sem,tot};
    };
    let acc=null;
    const att=(x,kg,v)=>{
      if(!(x.tot>0))return;
      x.it.forEach(o=>{const f=o.w/x.tot,r=pa(o.a.id,o.l.id);r.kg+=kg*f;r.valor+=v*f;r.dias.add(x.d);if(acc){const c=acc.get(r)||{kg:0,v:0};c.kg+=kg*f;c.v+=v*f;acc.set(r,c)}const L=nl(o.l.id);L.kg+=kg*f;L.valor+=v*f});
      x.sem.forEach(o=>{const f=o.w/x.tot,L=nl(o.l.id);L.semKg+=kg*f;L.semValor+=v*f});
    };
    let totKg=0,totV=0,usKg=0,usV=0;
    G.forEach((g,k)=>{
      if(ate&&g.d>ate)return;
      totKg+=g.kg;totV+=g.v;
      acc=ING?new Map():null;
      const nx=G[k+1]||(AC&&AC>g.d&&AC<=hj?{d:AC}:null),fimP=nx?addDias(nx.d,-1):addDias(hj,-1);
      const D=[];for(let d=g.d;d<=fimP;d=addDias(d,1))D.push(dia(d));
      const totW=sum(D,x=>x.tot);
      if(nx&&!(totW>0)){
        usKg+=g.kg;usV+=g.v;
        if((!de||g.d>=de)){const c=S.lotes.filter(l=>l.areaId===ar.id&&(!l.inicio||l.inicio<=g.d)).sort((a,b)=>(a.inicio||'')<(b.inicio||'')?1:-1)[0]||ls[0],L=nl(c.id);L.semKg+=g.kg;L.semValor+=g.v}
        return;
      }
      let sk=g.kg,sv=g.v;
      D.forEach(x=>{
        let kg=0,v=0;
        if(nx){kg=g.kg*x.tot/totW;v=g.v*x.tot/totW}
        else{const gasto=Math.min(sk,x.tot);if(!(gasto>0)||!(sk>0))return;kg=gasto;v=sv*gasto/sk;sk-=gasto;sv-=v}
        if(ate&&x.d>ate)return;
        usKg+=kg;usV+=v;
        if(de&&x.d<de)return;
        att(x,kg,v);
      });
      if(acc){const gm=mixSoma(g.fs);acc.forEach((c,r)=>addIng(r,gm,c.kg,c.v))}
    });
    sobra[ar.id]={kg:Math.max(0,totKg-usKg),valor:Math.max(0,totV-usV)};
  });
}
/* rateio pelo CONSUMO: o cocho é simulado dia a dia (entra ração no trato, sai o consumo previsto dos animais presentes naquele dia).
   O custo de cada dia = kg consumido × custo médio da ração que estava no cocho; é dividido entre os lotes pela demanda
   e, dentro do lote, pelo peso de cada animal. O que sobra no cocho no fim do período ainda não foi consumido e não é cobrado de ninguém. */
function ratearConsumo(de,ate,P,nl,pa,sobra){
  const hj=hoje();
  S.areas.forEach(ar=>{
    const ls=S.lotes.filter(l=>l.areaId===ar.id);if(!ls.length)return;
    const ids=new Set(ls.map(l=>l.id));
    const F=S.forn.filter(h=>h.areaId===ar.id).sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:0);
    if(!F.length)return;
    const porCab={};ls.forEach(l=>{porCab[l.id]=loteCalc(l).consHoje});
    const A=ALLA().filter(a=>((a.loteId&&ids.has(a.loteId))||(a.mov||[]).some(m=>ids.has(m.loteId))));
    let sk=0,sv=0,fi=0;const stk={};
    const total=Math.max(0,diffDias(F[0].data,hj));
    for(let i=0;i<=total;i++){
      const d=addDias(F[0].data,i);
      if(ate&&d>ate)break;
      while(fi<F.length&&F[fi].data<=d){sk+=num(F[fi].kg);sv+=num(F[fi].valor);if(ING){const m=fornMix(F[fi]);for(const id in m.it){const o=stk[id]||(stk[id]={kg:0,v:0});o.kg+=m.it[id].kg;o.v+=m.it[id].v}}fi++}
      if(d>=hj)break;
      const grp={};
      A.forEach(a=>{const lid=loteDoAnimalEm(a,d);if(lid&&ids.has(lid))(grp[lid]=grp[lid]||[]).push(a)});
      let c=0;const dem={};
      ls.forEach(l=>{const g=grp[l.id];const n=g?g.length:(loteTemReg(l.id)?0:(l.inicio&&d>=l.inicio?num(l.qtd):0));dem[l.id]=n*porCab[l.id];c+=dem[l.id]});
      if(!(c>0)||!(sk>0))continue;
      const gasto=Math.min(sk,c),custo=sv*gasto/sk;
      let dm=null;
      if(ING){dm={kg:0,v:0,it:{}};const fk=sk>0?gasto/sk:0,fv=sv>0?custo/sv:0;for(const id in stk){const o=stk[id],t={kg:o.kg*fk,v:o.v*fv};dm.it[id]=t;dm.kg+=t.kg;dm.v+=t.v;o.kg-=t.kg;o.v-=t.v}}
      sk-=gasto;sv-=custo;
      if(de&&d<de)continue;
      ls.forEach(l=>{
        if(!(dem[l.id]>0))return;
        const kg=gasto*dem[l.id]/c,v=custo*dem[l.id]/c,g=grp[l.id],L=nl(l.id);
        if(g&&g.length){
          const W=g.map(a=>pesoEm(a,d,P.get(a.id))||1),tw=sum(W,w=>w);
          g.forEach((a,k)=>{const f=W[k]/tw,r=pa(a.id,l.id);r.kg+=kg*f;r.valor+=v*f;if(ING)addIng(r,dm,kg*f,v*f);r.dias.add(d);L.kg+=kg*f;L.valor+=v*f});
        }else{L.semKg+=kg;L.semValor+=v}
      });
    }
    sobra[ar.id]={kg:sk,valor:sv};
  });
}
/* animais que estavam no lote na data (presença física pela data de entrada e pelos manejos; ignora os modos "todos"/retroativo).
   Se nenhum estava registrado nessa data, usa os que estão no lote hoje (fb=true). */
function sanPres(loteId,data){
  const sv=FMIN;FMIN=null;
  const fora=()=>false; /* o filtro de corte só esconde animais no resultado; todos entram na divisão do rateio */
  let al=ALLA().filter(a=>!fora(a)&&loteDoAnimalEm(a,data)===loteId),fb=false;
  if(!al.length){al=S.animais.filter(a=>!fora(a)&&a.loteId===loteId);fb=al.length>0}
  FMIN=sv;
  return {al,fb};
}
/* ---- sanidade: lançamentos de custo sanitário por lote (dividido igualmente entre os animais presentes na data) ou por animal ---- */
function sanCalc(de,ate){
  const por=new Map(),semL=new Map(),itens=[];
  const fora=()=>false; /* o filtro de corte só esconde animais no resultado; todos entram na divisão do rateio */
  SAN().forEach(e=>{
    if(de&&e.data<de)return;if(ate&&e.data>ate)return;
    const v=num(e.valor);if(!(v>0))return;
    let al=[];
    if(e.animalId){const a=byId(ALLA(),e.animalId);if(a&&!fora(a)){const sv=FMIN;FMIN=null;al=[{a,lid:loteDoAnimalEm(a,e.data)||a.loteId||''}];FMIN=sv}}
    else if(e.loteId)al=sanPres(e.loteId,e.data).al.map(a=>({a,lid:e.loteId}));
    itens.push({e,v,n:al.length,porCab:al.length?v/al.length:0});
    if(!al.length){if(e.loteId)semL.set(e.loteId,(semL.get(e.loteId)||0)+v);return}
    al.forEach(x=>{const k=x.a.id+'|'+x.lid;por.set(k,(por.get(k)||0)+v/al.length)});
  });
  return {por,semL,itens};
}
/* ---- distribuição do custo da ração pelo peso do animal ---- */
function calcCustos(de,ate,wantIng){
  ING=!!wantIng;PRC=new Map();
  FMIN={};S.lotes.forEach(l=>{let m='';S.forn.forEach(h=>{if(h.areaId===l.areaId&&h.data>=(de||'')&&(!m||h.data<m))m=h.data});if(m)FMIN[l.id]=m});
  const P=new Map(ALLA().map(a=>[a.id,pontosPeso(a)]));
  const porA=new Map(),porL=new Map();
  const nl=id=>{if(!porL.has(id))porL.set(id,{kg:0,valor:0,semKg:0,semValor:0,diasAnimal:0,san:0,semSan:0});return porL.get(id)};
  const pa=(aid,lid)=>{const k=aid+'|'+lid;if(!porA.has(k))porA.set(k,{aid,lid,kg:0,valor:0,san:0,dias:new Set()});return porA.get(k)};
  const sobra={};
  if(fCu.base==='consumo')ratearConsumo(de,ate,P,nl,pa,sobra);
  else if(fCu.base!=='trato')ratearFechado(de,ate,P,nl,pa,sobra);
  else S.forn.forEach(h=>{
    if(de&&h.data<de)return;if(ate&&h.data>ate)return;
    const ar=h.areaId,pres=[];
    ALLA().forEach(a=>{const lid=loteDoAnimalEm(a,h.data);if(!lid)return;const l=byId(S.lotes,lid);if(l&&l.areaId===ar)pres.push({a,lid,w:pesoEm(a,h.data,P.get(a.id))||1})});
    if(pres.length){
      const tw=sum(pres,x=>x.w),mh=ING?fornMix(h):null;
      pres.forEach(x=>{const f=x.w/tw,r=pa(x.a.id,x.lid);r.kg+=num(h.kg)*f;r.valor+=num(h.valor)*f;if(ING)addIng(r,mh,num(h.kg)*f,num(h.valor)*f);r.dias.add(h.data);const L=nl(x.lid);L.kg+=num(h.kg)*f;L.valor+=num(h.valor)*f});
    }else{
      const c=S.lotes.filter(l=>l.areaId===ar&&(!l.inicio||l.inicio<=h.data)).sort((a,b)=>(a.inicio||'')<(b.inicio||'')?1:-1)[0]||S.lotes.filter(l=>l.areaId===ar).sort((a,b)=>(a.inicio||'')<(b.inicio||'')?-1:1)[0];
      if(c){const L=nl(c.id);L.semKg+=num(h.kg);L.semValor+=num(h.valor)}
    }
  });
  {const SN=sanCalc(de,ate);
   SN.por.forEach((v,k)=>{const i=k.indexOf('|'),aid=k.slice(0,i),lid=k.slice(i+1);pa(aid,lid).san+=v;if(lid)nl(lid).san+=v});
   SN.semL.forEach((v,lid)=>{nl(lid).semSan+=v})}
  ING=false;

}
/* dias corridos em que o animal esteve no lote dentro do período (o custo dilui ao longo desses dias) */
function diasNoLote(a,loteId,de,ate){
  const l=byId(S.lotes,loteId),ini=de||'',fim=ate||hoje(),iv=[],MV=movsEf(a);
  if(MV&&MV.length){MV.forEach((m,i)=>{if(m.loteId===loteId){const nx=MV[i+1];iv.push([m.d,nx?addDias(nx.d,-1):fim])}})}
  else if(a.loteId===loteId)iv.push([iniEfetivo(a,l)||ini,fim]);
  let n=0;
  iv.forEach(([s,e])=>{const s2=ini&&ini>s?ini:s,e2=e<fim?e:fim;if(s2&&e2>=s2)n+=diffDias(s2,e2)+1});
  return n;
}
function custoLinhas(loteId,de,ate,R0){
  const R=R0||calcCustos(de,ate),dRef=ate||hoje();
  const linhas=[],lt=byId(S.lotes,loteId),opDia=num(S.cfg.opDia);
  ALLA().forEach(a=>{
    const r=R.porA.get(a.id+'|'+loteId);
    if(!r&&a.loteId!==loteId&&!diasNoLote(a,loteId,de,ate))return;
    if(ate&&a.entrada&&a.entrada>ate&&!r)return;
    if(fCu.corte&&a.entrada&&a.entrada>fCu.corte)return;
    const kg=r?r.kg:0,valor=r?r.valor:0,san=r?num(r.san):0,dias=diasNoLote(a,loteId,de,ate);
    const p0=num(a.pesoIn),pf=pesoEm(a,dRef,R.P.get(a.id)),pts=R.P.get(a.id),pesado=(a.pes||[]).length>0;
    const ganho=pf-p0,dv=a.entrada?diffDias(a.entrada,dRef):0;
    const ini=[de||'',lt?entradaNoLote(a,lt):''].sort().pop(),op=opDia*dias;
    let pI=null,pF=null;(pts||[]).forEach(t=>{if(t.d<=ini)pI=t;if(t.d<=dRef)pF=t});
    if(!pI&&pts&&pts[0]&&pts[0].d<=dRef)pI=pts[0];
    const dR=(pI&&pF&&pF.d>pI.d)?diffDias(pI.d,pF.d):0,gR=dR>0?pF.kg-pI.kg:0,fM=dias>0?Math.min(1,dR/dias):0; /* fM: fração do período em que o ganho foi medido; o custo do desempenho usa só essa parte */
    linhas.push({ing:r?r.ing:null,gR,dR,pI,pF,gmdR:dR>0?gR/dR:0,op,san,tot:valor+op+san,kgM:kg*fM,valM:valor*fM,totM:(valor+op+san)*fM,perKgP:gR>0?(valor+op+san)*fM/gR:0,a,kg,valor,dias,p0,pf,pesado,ganho,gmd:dv>0&&pesado?ganho/dv:0,perDia:dias?valor/dias:0,perKgGanho:ganho>0?valor/ganho:0,aq:num(a.valor)});
  });
  linhas.sort((x,y)=>ordNum(x.a,y.a));
  const ar=lt?lt.areaId:'',lan=S.forn.filter(h=>h.areaId===ar&&(!de||h.data>=de)&&(!ate||h.data<=ate));
  let L=R.porL.get(loteId)||{kg:0,valor:0,semKg:0,semValor:0,san:0,semSan:0};
  if(fCu.corte)L=Object.assign({},L,{kg:sum(linhas,x=>x.kg),valor:sum(linhas,x=>x.valor),san:sum(linhas,x=>num(x.san))});
  return {linhas,L,sobra:R.sobra[ar]||null,lan:{kg:sum(lan,h=>num(h.kg)),valor:sum(lan,h=>num(h.valor))}};
}

let MJ={data:'',items:[],sel:null};
function mjRef(a,d){const p=pontosPeso(a).filter(x=>x.d<d);return p.length?p[p.length-1]:null}
function mjGmd(a,kg,d){
  const ref=mjRef(a,d);if(!ref||!d)return {t:'sem pesagem anterior'};
  const dias=diffDias(ref.d,d);if(dias<=0)return {t:'data igual ou anterior à última pesagem'};
  const g=(kg-ref.kg)/dias;return {g,t:'GMD '+fmt(g,3)+' kg/dia · '+(kg>=ref.kg?'+':'')+fmt(kg-ref.kg,1)+' kg em '+dias+' d'};
}

function faseEm(a,d){const l=byId(S.lotes,loteDoAnimalEm(a,d));return l?l.sis||'':''}
function histPesoAnimal(a){
  const P=pontosPeso(a);if(!P.length)return '';
  const badge=f=>f?'<span class="b '+(f==='Engorda'?'warn':'ok')+'">'+esc(f)+'</span>':'<span class="mut">—</span>';
  let prev=null;
  const rows=P.map(x=>{
    const g=prev&&diffDias(prev.d,x.d)>0?(x.kg-prev.kg)/diffDias(prev.d,x.d):null,l=byId(S.lotes,loteDoAnimalEm(a,x.d));
    const r='<tr><td>'+fmtData(x.d)+(x.d===a.entrada&&num(x.kg)===num(a.pesoIn)?'<br><span class="mut" style="font-size:12px">entrada</span>':'')+'</td><td><b>'+fmt(x.kg,1)+'</b></td><td>'+(g==null?'—':fmt(g,3))+'</td><td>'+badge(l&&l.sis)+(l?'<br><span class="mut" style="font-size:12px">'+esc(l.nome)+'</span>':'')+'</td><td>'+((a.pes||[]).some(q=>q.d===x.d&&num(q.kg)===num(x.kg))?'<button type="button" class="btn sm sec" data-act="pesEd" data-id="'+a.id+'" data-d="'+x.d+'">Corrigir</button>':'')+'</td></tr>';
    prev=x;return r}).join('');
  const hoje_=hoje(),res=[];
  periodosAnimal(a).forEach(p=>{
    const l=byId(S.lotes,p.loteId);if(!l||!p.de)return;
    const lim=p.ate||hoje_,pts=P.filter(x=>x.d<=lim),fim=p.ate||(pts.length?pts[pts.length-1].d:hoje_),w0=pesoEm(a,p.de,P),w1=p.ate?pesoEm(a,p.ate,P):(pts.length?pts[pts.length-1].kg:0);
    const di=Math.max(0,diffDias(p.de,fim));

/* ===== Ficha resumida do animal (lista de animais e modal) ===== */
function fichasAnimais(lista){
  const R=calcCustos('',''),nut=new Map();
  R.porA.forEach(r=>nut.set(r.aid,(nut.get(r.aid)||0)+r.valor));
  const out=new Map();
  lista.forEach(a=>{
    const P=R.P.get(a.id)||pontosPeso(a),reais=(a.pes||[]).filter(p=>p.d&&num(p.kg)>0).sort((x,y)=>x.d<y.d?-1:1);
    const p1=num(a.pesoIn),ult=reais.length?reais[reais.length-1]:null;
    let gUlt=null,gGlob=null;
    if(ult){
      const ant=P.filter(x=>x.d<ult.d).pop();
      if(ant&&diffDias(ant.d,ult.d)>0)gUlt=(num(ult.kg)-ant.kg)/diffDias(ant.d,ult.d);
      if(a.entrada&&p1>0&&diffDias(a.entrada,ult.d)>0)gGlob=(num(ult.kg)-p1)/diffDias(a.entrada,ult.d);
    }
    const hj=hoje(),atual=P.length?pesoEm(a,hj,P):0,est=!(ult&&ult.d===hj);
    out.set(a.id,{compra:a.entrada||'',p1,valor:num(a.valor),nutri:nut.get(a.id)||0,gUlt,gGlob,atual,est,ult,diverge:false});
  });
  /* alerta: última pesagem em data diferente da maioria do lote */
  const por={};
  out.forEach((f,id)=>{const a=byId(S.animais,id);if(f.ult&&a&&a.loteId){(por[a.loteId]=por[a.loteId]||{})[f.ult.d]=(por[a.loteId][f.ult.d]||0)+1}});
  out.forEach((f,id)=>{const a=byId(S.animais,id);if(!f.ult||!a||!a.loteId)return;const m=por[a.loteId];
    let best='',bc=0;Object.keys(m).forEach(d=>{if(m[d]>bc||(m[d]===bc&&d>best)){best=d;bc=m[d]}});
    if(Object.keys(m).length>1&&f.ult.d!==best)f.diverge=true});
  return out;
}

/* ===== Editar fornecimento (pasto, data, quantidade, valor e fórmula) ===== */
let FE=null;
function mFornEd(id){
  const h=byId(S.forn,id);if(!h)return;
  FE={id,un:num(h.kg)>0?num(h.valor)/num(h.kg):0,a:h.areaId,d:h.data,k:String(h.kg).replace('.',','),v:String(r2(num(h.valor))).replace('.',','),
    fid:h.formulaId||'',nome:h.nome,rows:snapCarregado(h).map(g=>({id:g.id,pct:String(r2(num(h.kg)*num(g.pct)/100*100)/100).replace('.',',')}))};

  renderFE();
}
function readFE(){
  if(!FE||!$('#fe-k'))return;
  FE.a=$('#fe-a').value;FE.d=$('#fe-d').value;FE.k=$('#fe-k').value;FE.v=$('#fe-v').value;
  if($('#fe-f'))FE.fid=$('#fe-f').value;
  FE.rows=FE.rows.map((r,k)=>({id:$('#ei-'+k).value,pct:$('#ep-'+k).value}));
}
function renderFE(){
  const h=byId(S.forn,FE.id),pa=!!h.prodId;
  const tot=sum(FE.rows,r=>impNum(r.pct)||0);
  const rows=pa?'':FE.rows.map((r,k)=>'<div class="ingrow"><select id="ei-'+k+'">'+opts(S.insumos.filter(i=>!i.acabado||i.id===r.id).map(i=>[i.id,i.nome]),r.id,'Ingrediente…')+'</select><input id="ep-'+k+'" inputmode="decimal" value="'+esc(r.pct)+'" placeholder="kg"><button type="button" class="rm" data-act="feRm" data-i="'+k+'" aria-label="Remover">×</button></div>').join('');

   +(pa?'<p class="note" style="margin:0 0 8px">Produto acabado: <b>'+esc(h.nome)+'</b></p>'
     :selF('fe-f','Fórmula fornecida',S.formulas.map(f=>[f.id,f.nome]),FE.fid,'(manter a receita atual)'))
   +selF('fe-a','Pasto',S.areas.map(a=>[a.id,a.nome]),FE.a)
   +'<div class="cfgrow">'+fld('fe-d','Data',FE.d,{type:'date'})+fld('fe-k','Quantidade (kg)',FE.k)+'</div>'
   +fld('fe-v','Valor (R$)',FE.v)
   +'<p class="note">Mudando a quantidade, o valor acompanha o custo por kg ('+brl(FE.un)+'/kg); pode ajustar à mão.</p>'
   +(pa?'':'<h3 style="margin:12px 0 4px">Receita fornecida</h3><p class="note" style="margin:0 0 6px">Informe os <b>kg</b> de cada ingrediente (como na batida). Ao escolher outra fórmula, a receita é trocada pela dela, proporcional à quantidade. Só vale para este fornecimento. Total dos ingredientes: <b>'+fmt(tot,1)+' kg</b></p>'+rows

}
FORMS.fornEd=()=>{
  readFE();const h=byId(S.forn,FE.id);if(!h)return;
  const kg=impNum(FE.k),v=impNum(FE.v);
  if(!FE.a)return toast('Escolha o pasto');if(!FE.d)return toast('Informe a data');if(FE.d>hoje())return toast('Data não pode ser no futuro');
  if(!(kg>0))return toast('Informe a quantidade');if(!(v>=0))return toast('Valor inválido');
  if(h.prodId){const c=compraCalc(h.prodId);if(kg>c.estoque+num(h.kg)+.001)return toast('Estoque insuficiente: há '+fmt(c.estoque+num(h.kg))+' kg disponíveis')}
  let snap=h.snap;
  const mudou=!h.prodId&&JSON.stringify({r:FE.rows.map(r=>({id:r.id,pct:r.pct})),f:FE.fid})!==FE.orig;
  if(mudou){
    const L=FE.rows.filter(r=>r.id&&impNum(r.pct)>0).map(r=>({id:r.id,kg:impNum(r.pct)})),T=sum(L,g=>g.kg);
    snap=L.map(g=>({id:g.id,pct:Math.round(g.kg/T*1e6)/1e4}));
    if(!snap.length)return toast('A receita precisa de ao menos um ingrediente');
    if(new Set(snap.map(g=>g.id)).size!==snap.length)return toast('Ingrediente repetido na receita');
  }
  if(mudou)h.snapEd=true;
  if(h.batidaId){const b=byId(S.batidas,h.batidaId);if(b&&b.dist){const x=b.dist.find(y=>y.areaId===h.areaId&&Math.abs(num(y.kg)-num(h.kg))<.01)||b.dist.find(y=>y.areaId===h.areaId);if(x){x.areaId=FE.a;x.kg=kg}}}
  const lt=h.prodId&&byId(S.lotes,h.loteId);if(lt&&lt.areaId!==FE.a)h.loteId='';
  if(!h.prodId){const f=FE.fid&&formula(FE.fid);if(f){h.formulaId=f.id;h.nome=f.nome}}
  h.snap=snap;h.areaId=FE.a;h.data=FE.d;h.kg=r2(kg);h.valor=r2(v);
  save();closeModal();render(false);toast('Fornecimento atualizado');
};

/* ===== Extrato do cocho (painel): mostra de onde sai o saldo ===== */
function mCocho(areaId){
  const ar=area(areaId);if(!ar)return;
  const ls=S.lotes.filter(l=>l.areaId===areaId&&loteCalc(l).st==='ativo');
  const cons=sum(ls,l=>loteCalc(l).consHojeL),cap=sum(ls,l=>l.cap);
  const s=cochoSim(areaId),F=S.forn.filter(h=>h.areaId===areaId),rows=s.rows,saldoHoje=s.saldo;
  const lim=addDias(hoje(),-30),k30=sum(F.filter(h=>h.data>lim),h=>h.kg);
  const d30=Math.max(1,s.n30),p30=s.dem30;
  const razao=p30>0?k30/p30:0;
  const dups={};F.forEach(f=>{const k=f.data+'|'+Math.round(num(f.kg))+'|'+f.nome;dups[k]=(dups[k]||0)+1});
  const lista=rows.slice().reverse().slice(0,40).map(r=>'<tr><td>'+fmtData(r.f.data)+(dups[r.f.data+'|'+Math.round(num(r.f.kg))+'|'+r.f.nome]>1?' <span class="b warn" title="Mesmo pasto, data, fórmula e kg lançados mais de uma vez">dup?</span>':'')+'<br><span class="mut" style="font-size:11px">'+esc(r.f.nome||'')+'</span></td><td>+'+fmt(r.f.kg)+'</td><td>−'+fmt(r.cs)+'</td><td><b>'+fmt(r.saldo)+'</b></td></tr>').join('');
  sheet('<h2>Extrato do cocho · '+esc(ar.nome)+'</h2><p class="note" style="margin:0 0 8px">Lotes ativos aqui: '+(ls.map(l=>esc(l.nome)+' ('+fmt(loteQtd(l))+' cab)').join(', ')||'nenhum')+'.</p>'
   +'<div class="kv">'+kv('Consumo previsto hoje',fmt(cons)+' kg/dia')+kv('Saldo estimado hoje',fmt(saldoHoje)+' kg')+kv('Capacidade',cap?fmt(cap)+' kg':'—')+'</div>'
   +'<div class="kv">'+kv('Fornecido em '+d30+' dia(s)',fmt(k30)+' kg')+kv('Previsto no período',fmt(p30)+' kg')+kv('Fornecido ÷ previsto',p30>0?fmt(razao*100)+'%':'—')+'</div>'
   +(razao>1.35?'<p class="note" style="color:var(--red)"><b>O que foi fornecido está bem acima do consumo previsto</b> (já considerando quantos animais havia no pasto em cada dia). Confira: (1) quantidade de animais, peso e consumo (% do PV) do lote; (2) trato lançado em duplicidade (marcado <b>dup?</b>); (3) trato lançado no pasto errado.</p>':razao>0&&razao<.65?'<p class="note" style="color:var(--amber)">Foi fornecido bem menos do que o consumo previsto: pode haver trato sem lançar.</p>':'<p class="note">Fornecido e previsto estão coerentes.</p>')
   +'<h3 style="margin:10px 0 4px">Tratos e saldo</h3><div class="scroll"><table><tr><th>Data</th><th>Fornecido kg</th><th>Consumo desde o anterior</th><th>Saldo após o trato</th></tr>'+(lista||'<tr><td colspan="4" class="mut">Nenhum trato lançado neste pasto.</td></tr>')+'</table></div>'
   +(rows.length>40?'<p class="note">Mostrando os 40 tratos mais recentes.</p>':'')
   +'<p class="note">Saldo = soma dos tratos − consumo previsto de cada dia (animais presentes no dia × consumo por cabeça do lote). Toque em um trato no Fornecimento para editar ou excluir.</p>');
}

/* ===== Cobrança por proprietário =====
   Reúne os animais de um dono, soma o custo de nutrição por ingrediente e permite marcar os ingredientes que já foram pagos
   (ex.: milho do condomínio) para tirar da cobrança. Usa o mesmo rateio e os mesmos filtros da tela de Custos. */
let fCb={dono:null,off:new Set()};
const donoKey=s=>String(s||'').trim().toLowerCase();
function donosLista(){
  const m=new Map();
  ALLA().forEach(a=>{const k=donoKey(a.dono),o=m.get(k)||{k,nome:String(a.dono||'').trim()||'(sem proprietário)',n:0};o.n++;m.set(k,o)});
  return [...m.values()].sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
}
const cobExcSet=()=>fCb.off;
function cobDados(){
  const Ls=donosLista();
  if(fCb.dono===null||!Ls.some(d=>d.k===fCb.dono))fCb.dono=Ls.length?Ls[0].k:'';
  const dd=Ls.find(d=>d.k===fCb.dono)||{k:'',nome:'',n:0},exc=cobExcSet(dd.k);
  const R=calcCustos(fCu.de,fCu.ate,true),por=new Map(),lot=new Map(),ing={},det=[];
  S.lotes.forEach(l=>{
    custoLinhas(l.id,fCu.de,fCu.ate,R).linhas.forEach(x=>{
      if(donoKey(x.a.dono)!==dd.k)return;
      if(!x.dias&&!x.kg&&!x.san)return;
      let A=por.get(x.a.id);if(!A)por.set(x.a.id,A={a:x.a,lotes:[],dias:0,kg:0,v:0,op:0,san:0,ing:{}});
      A.lotes.push(l.nome);A.dias+=x.dias;A.kg+=x.kg;A.v+=x.valor;A.op+=x.op;A.san+=x.san;
      let B=lot.get(l.id);if(!B)lot.set(l.id,B={l,ids:new Set(),kg:0,v:0,op:0,san:0,ing:{}});
      B.ids.add(x.a.id);B.kg+=x.kg;B.v+=x.valor;B.op+=x.op;B.san+=x.san;
      for(const id in (x.ing||{})){
        const o=x.ing[id];
        [A.ing,B.ing,ing].forEach(T=>{const t=T[id]||(T[id]={kg:0,v:0});t.kg+=o.kg;t.v+=o.v});
        det.push({a:x.a,lote:l.nome,id,kg:o.kg,v:o.v});
      }
    });
  });
  const exv=o=>Object.keys(o.ing).reduce((s,id)=>exc.has(id)?s+o.ing[id].v:s,0);
  const As=[...por.values()].sort((x,y)=>ordNum(x.a,y.a)),Bs=[...lot.values()];
  const sanOn=!exc.has('__san');
  As.forEach(A=>{A.ex=exv(A);A.cobrar=A.v-A.ex;A.tot=A.cobrar+A.op+(sanOn?A.san:0)});
  Bs.forEach(B=>{B.ex=exv(B);B.cobrar=B.v-B.ex;B.tot=B.cobrar+B.op+(sanOn?B.san:0);B.n=B.ids.size});
  const nut=sum(As,A=>A.v),kg=sum(As,A=>A.kg),op=sum(As,A=>A.op),san=sum(As,A=>A.san);
  const arr=Object.keys(ing).map(id=>{const i=insumo(id);return {id,nome:i?i.nome:'(insumo removido)',kg:ing[id].kg,v:ing[id].v,exc:exc.has(id)}}).sort((a,b)=>b.v-a.v);
  const dif=nut-sum(arr,x=>x.v);
  if(Math.abs(dif)>=.01)arr.push({id:'__sem',nome:'(trato sem receita registrada)',kg:Math.max(0,kg-sum(arr,x=>x.kg)),v:dif,exc:false,fixo:true});
  const exV=sum(arr.filter(x=>x.exc),x=>x.v),exKg=sum(arr.filter(x=>x.exc),x=>x.kg);
  return {dd,exc,As,Bs,arr,det,n:As.length,nut,kg,op,san,sanOn,exV,exKg,cobrar:nut-exV,total:nut-exV+op+(sanOn?san:0)};
}

  const an='<div class="card"><h3>Por animal</h3><div class="scroll"><table><tr><th>Brinco</th><th>Lotes</th><th>Dias</th><th>Nutrição</th><th>Fora da conta</th><th>Sanid.</th><th>Operac.</th><th>Total</th></tr>'

/* ===== Venda: pesagem no curral, aguardando frigorífico, carcaça e valor, relatório =====
   O animal vendido sai de S.animais (contagens, consumo, sanidade, peso da fazenda) e vai para S.vend.
   Continua gravado na mesma coleção 'animais' (campo venda) e entra no histórico de custo até a data da venda. */
let fVd={tipo:'abate',tab:'pesar',lote:'',d:hoje(),frig:'',rel:'',tot:''};
let VL=[];
/* rascunho do embarque (animais já pesados, data, frigorífico, tipo) fica guardado neste aparelho: dá para fechar o app e continuar depois */
const VKEY=KEY+'.vendaRasc';
function vdSalvaR(){try{localStorage.setItem(VKEY,JSON.stringify({VL,d:fVd.d,frig:fVd.frig,tipo:fVd.tipo}))}catch(e){}}
(function(){try{const o=JSON.parse(localStorage.getItem(VKEY)||'null');if(o){VL=Array.isArray(o.VL)?o.VL:[];if(o.d)fVd.d=o.d;fVd.frig=o.frig||'';if(o.tipo)fVd.tipo=o.tipo}}catch(e){}})();
const vdPesoIn=a=>{const u=ultimoPeso(a);return u?num(u.kg):num(a.pesoIn)};
const vdGrupos=st=>{
  const g=new Map();
  (S.vend||[]).forEach(a=>{const v=a.venda||{};if(st&&v.status!==st)return;const k=v.rid||(v.d+'|'+(v.frig||''));if(!g.has(k))g.set(k,{rid:k,d:v.d,frig:v.frig||'',lote:'',st:v.status,al:[]});g.get(k).al.push(a)});
  g.forEach(G=>{G.lote=[...new Set(G.al.map(a=>a.venda.loteNome||'').filter(Boolean))].join(', ')});
  return [...g.values()].sort((x,y)=>x.d<y.d?1:x.d>y.d?-1:0);
};
const vdSomaGrupo=G=>{
  const pf=sum(G.al,a=>num(a.venda.pesoFaz)),pc=sum(G.al,a=>num(a.venda.pesoCarc)),val=sum(G.al,a=>num(a.venda.valor));
  return {n:G.al.length,pf,pc,val,rend:pf>0&&pc>0?pc/pf*100:0,arr:pc/15,rarr:pc>0?val/(pc/15):0};
};
function vender(lista,d,frig,tipo,vtot){
  const rid='v'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  lista.forEach(x=>{
    const a=x.a;
    const semMov=!(a.mov&&a.mov.length),semPes=!(a.pes&&a.pes.length);
    const pesAnt=(a.pes||[]).find(p=>p.d===d)||null;
    a.pes=(a.pes||[]).filter(p=>p.d!==d);a.pes.push({d,kg:x.kg});
    const lo=a.loteId;
    moverAnimal(a,'',d,true);
    const l=byId(S.lotes,lo);
    a.venda={d,pesoFaz:x.kg,frig:frig||'',rid,loteId:lo||'',loteNome:l?l.nome:'',semMov,semPes,pesAnt,status:'aguardando',tipo:tipo==='vivo'?'vivo':'abate',pesoCarc:0,valor:0};
    S.animais=S.animais.filter(y=>y.id!==a.id);S.vend.push(a);
  });
  if(tipo==='vivo'&&vtot>0){const T=sum(lista,x=>x.kg);let acc=0;lista.forEach((x,i)=>{const v=i===lista.length-1?r2(vtot-acc):r2(vtot*x.kg/T);acc+=v;x.a.venda.valor=v;x.a.venda.status='fechada';x.a.venda.dc=d})}
  save();
}
function vdVoltar(rid,aid){
  const al=S.vend.filter(a=>(a.venda.rid||a.venda.d+'|'+(a.venda.frig||''))===rid&&(!aid||a.id===aid));
  al.forEach(a=>{
    const v=a.venda;
    a.mov=(a.mov||[]).filter(m=>!(m.d===v.d&&m.loteId===''));
    a.pes=(a.pes||[]).filter(p=>!(p.d===v.d&&num(p.kg)===num(v.pesoFaz)));
    a.loteId=v.loteId&&byId(S.lotes,v.loteId)?v.loteId:'';
    if(a.mov.length&&a.mov[a.mov.length-1].loteId!==a.loteId)a.mov.push({d:v.d,loteId:a.loteId});
    if(v.pesAnt)a.pes.push(v.pesAnt);
    if(v.semMov&&a.mov&&a.mov.length<=1)delete a.mov;
    if(v.semPes&&a.pes&&!a.pes.length)delete a.pes;
    delete a.venda;
    S.vend=S.vend.filter(y=>y.id!==a.id);S.animais.push(a);
  });
  save();return al.length;
}

function ccCalc(){
  const al=CC.al,tot=impNum($('#cc-tot').value)||0,vt=impNum($('#cc-val').value)||0,pa=impNum($('#cc-arr').value)||0;
  const ind=new Map();al.forEach(a=>{const c=impNum($('#cc-'+a.id).value)||0;if(c>0)ind.set(a.id,c)});
  const F=sum([...ind.values()],x=>x),bl=al.filter(a=>!ind.has(a.id));
  const out=new Map(ind);let falta=0;
  if(bl.length){
    if(tot>F){const rest=tot-F,pw=sum(bl,a=>num(a.venda.pesoFaz));bl.forEach(a=>out.set(a.id,rest*num(a.venda.pesoFaz)/(pw||1)))}
    else falta=bl.length;
  }
  const pc=sum([...out.values()],x=>x),pf=sum(al,a=>num(a.venda.pesoFaz));
  const V=vt>0?vt:(pa>0?pc/15*pa:0);
  return {out,pc,pf,V,falta,rend:pf>0?pc/pf*100:0,rarr:pc>0?V/(pc/15):0};
}
function ccVivo(){const vt=impNum($('#cc-val').value)||0,pk=impNum($('#cc-arr').value)||0;return vt>0?vt:pk*sum(CC.al,a=>num(a.venda.pesoFaz))}
function ccInfo(){
  const box=$('#cc-info');if(!box||!CC)return;
  if(CC.al[0].venda.tipo==='vivo'){const V=ccVivo();box.innerHTML=V>0?'Valor <b>'+brl(V)+'</b> · '+brl(V/CC.al.length)+' por cabeça · '+brl(V/sum(CC.al,a=>num(a.venda.pesoFaz)))+'/kg vivo':'<span class="mut">Informe o valor total ou o preço por kg.</span>';return}
  const c=ccCalc();
  box.innerHTML=c.falta?'<span class="mut">Informe o peso de carcaça total (ou o de cada animal). Faltam '+c.falta+' animais.</span>':
   'Carcaça <b>'+fmt(c.pc,0)+' kg</b> ('+fmt(c.pc/15,1)+' @) · rendimento <b>'+fmt(c.rend,1)+'%</b>'+(c.V>0?'<br>Valor <b>'+brl(c.V)+'</b> · <b>'+brl(c.rarr)+'/@</b> · '+brl(c.V/CC.al.length)+' por cabeça':'<br><span class="mut">Informe o valor total ou o preço por @.</span>');
}
FORMS.carc=()=>{
  if(!CC)return;
  if(CC.al[0].venda.tipo==='vivo'){
    const V=ccVivo();if(!(V>0))return toast('Informe o valor');
    const T=sum(CC.al,a=>num(a.venda.pesoFaz));let acc=0;
    CC.al.forEach((a,i)=>{const v=i===CC.al.length-1?r2(V-acc):r2(V*num(a.venda.pesoFaz)/T);acc+=v;a.venda.valor=v;a.venda.status='fechada';a.venda.dc=a.venda.dc||hoje()});
    save();closeModal();fVd.tab='fech';render(false);toast('Venda viva registrada');return;
  }const c=ccCalc();

  if(!(c.V>0))return toast('Informe o valor total ou o preço por @');

  al.forEach((a,i)=>{
    const cc=r2(c.out.get(a.id)),v=i===al.length-1?r2(c.V-acc):r2(c.V*c.out.get(a.id)/c.pc);acc+=v;

  });

};

function vdRel(){

    const R=calcCustos('','');

      res:v.status==='fechada'?num(v.valor)-compra-custo:null};
  });
}

/* ===== Análise de animais, ficha individual e compilado =====
   Mostra custo e desempenho de qualquer grupo de animais (ativos ou vendidos), num período, com ficha de cada um. */
function custoAnimais(de,ate){
  const key=(de||'')+'|'+(ate||'');if(ANC&&ANC.key===key)return ANC.M;
  const sv=fCu;fCu={lote:'',de:'',ate:'',corte:'',modo:'presenca'};const M=new Map();
  try{
    const R=calcCustos(de||'',ate||'');
    S.lotes.forEach(l=>custoLinhas(l.id,de||'',ate||'',R).linhas.forEach(x=>{
      const o=M.get(x.a.id)||{kg:0,nut:0,san:0,op:0,dias:0,L:{}};
      o.kg+=x.kg;o.nut+=x.valor;o.san+=num(x.san);o.op+=x.op;o.dias+=x.dias;

    }));
  }finally{fCu=sv}

const ZERO={kg:0,nut:0,san:0,op:0,dias:0,L:{}};
function anLinha(a,M,ate,soLote,de,loteSel){
  let c=M.get(a.id)||ZERO;if(soLote)c=c.L[soLote]||ZERO;
  const pts=pontosPeso(a).filter(p=>!ate||p.d<=ate),pF=pts.length?pts[pts.length-1]:null;
  /* com lote escolhido, o ganho começa na entrada NO LOTE (ou no início do período de custo, o que for mais tarde), como na tela Custos do lote */
  const entL=loteSel?entradaNoLote(a,loteSel):'',ini=[de||'',entL].sort().pop();let p0=pts[0]||null;
  if(ini){let pI=null;pts.forEach(p=>{if(p.d<=ini)pI=p});if(pI)p0=pI}
  const ok=pts.length>1&&pF.d>p0.d,ganho=ok?pF.kg-p0.kg:0,dR=ok?diffDias(p0.d,pF.d):0;
  const custo=c.nut+c.san+c.op,fM=c.dias>0?Math.min(1,dR/c.dias):0,aq=num(a.valor);
  const v=a.venda,fech=!!(v&&v.status==='fechada'),lt=byId(S.lotes,a.loteId);
  /* carcaça: entrada = peso vivo inicial × rendimento padrão; saída = peso vivo final × rendimento do frigorífico (se foi abate fechado) */

function anSoma(R){

function anFiltra(base,F,vend){
  const qs=String(F.q||'').toLowerCase().split(/[\s,;]+/).filter(Boolean);
  return base.filter(a=>{
    if(qs.length&&!qs.some(q=>String(a.brinco).toLowerCase()===q||String(a.brinco).toLowerCase().includes(q)&&qs.length===1))return false;
    if(F.lote&&!(a.loteId===F.lote||(a.mov||[]).some(m=>m.loteId===F.lote)||(a.venda&&a.venda.loteId===F.lote)))return false;
    const ent=F.lote&&byId(S.lotes,F.lote)?entradaNoLote(a,byId(S.lotes,F.lote)):a.entrada;
    if(F.eDe&&(!ent||ent<F.eDe))return false;
    if(F.eAte&&(!ent||ent>F.eAte))return false;
    if(F.dono&&donoKey(a.dono)!==F.dono)return false;
    if(!vend&&F.sit==='ativos'&&a.venda)return false;
    if(!vend&&F.sit==='vendidos'&&!a.venda)return false;
    return true;
  });
}
