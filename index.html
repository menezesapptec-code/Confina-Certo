<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14301f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" id="lk-icon" href="data:,">
<link rel="apple-touch-icon" id="lk-apple" href="data:,">
<title>TIP Control</title>
<style>
:root{--bg:#f3efe6;--card:#fffdf8;--ink:#1d2a22;--mut:#66756b;--green:#14301f;--green2:#1f6a42;--lime:#7fb069;--amber:#e0a526;--red:#c2452d;--line:#e3dccd}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
#app{min-height:100vh;display:flex;flex-direction:column}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:20;background:var(--green);color:#f4efe6;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px}
#top .logo{width:34px;height:34px;border-radius:9px;flex:none}
#top .logo.fz{background:#fff;object-fit:contain;padding:2px;display:block!important}
#top h1{font-size:17px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
#top small{display:block;font-size:12px;opacity:.7;font-weight:500}
#top .sp{flex:1}
.net{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.14);display:flex;align-items:center;gap:6px;white-space:nowrap}
.net i{width:8px;height:8px;border-radius:50%;background:var(--lime)}
.net.off i{background:var(--amber)}
#view{padding:16px 16px 96px;max-width:1100px;width:100%;margin:0 auto}
h2{font-size:20px;font-weight:800;letter-spacing:-.015em}
h3{font-size:15px;font-weight:800}
.mut{color:var(--mut)}
.pgh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.pgh p{font-size:13px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.card+.card,.stats+.card,.card+.stats{margin-top:12px}
.grid2>.card{margin-top:0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:2px}
.stat .v small{font-size:13px;font-weight:600;color:var(--mut);letter-spacing:0}
.stat .s{font-size:12px;color:var(--mut)}
.stat.good .v{color:#237a3f}.stat.badv .v{color:var(--red)}
.b{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.b.ok{background:#e1f0da;color:#2c6a2a}.b.warn{background:#fbecc4;color:#7a5600}.b.bad{background:#f8d9d1;color:#9a2c16}.b.mut{background:#ece7da;color:#5c6a60}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--green2);color:#fff;min-height:44px;text-align:center}
.btn.sec{background:#ece7da;color:var(--ink)}
.btn.line{background:transparent;border:1px solid #cfc7b5;color:var(--ink)}
.btn.sm{padding:7px 12px;min-height:34px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:active{transform:scale(.98)}
input,select{width:100%;padding:12px;border:1px solid #cfc7b5;border-radius:10px;font:inherit;background:#fff;color:var(--ink);min-height:44px}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 5px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row .g{flex:1;min-width:0}
.row .g b{display:block}
.row .g span{font-size:13px;color:var(--mut)}
.row .r{text-align:right;font-variant-numeric:tabular-nums}
.row .r b{display:block}
.bar{height:8px;background:#e8e2d3;border-radius:99px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--lime);border-radius:99px}
.bar.warn>i{background:var(--amber)}.bar.bad>i{background:var(--red)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid #cfc7b5;background:transparent;border-radius:99px;padding:7px 14px;font-weight:700;font-size:13px;color:var(--ink)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.linha{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);margin:18px 0 8px}
.linha:first-of-type{margin-top:4px}
.baias{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.baia{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--lime);border-radius:14px;padding:11px 12px;cursor:pointer}
.baia.warn{border-left-color:var(--amber)}.baia.bad{border-left-color:var(--red)}
.baia .bh{display:flex;justify-content:space-between;align-items:baseline}
.baia .bh b{font-size:19px;letter-spacing:-.02em}
.baia .bh span{font-size:12px;color:var(--mut)}
.baia .bn{font-size:13px;color:var(--mut);margin:2px 0 8px;font-variant-numeric:tabular-nums}
.baia .bc{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.dots{display:inline-flex;gap:3px}
.dot{width:12px;height:12px;border-radius:4px;background:#e1dac9}
.dot.on{background:var(--green2)}
.modal{position:fixed;inset:0;background:rgba(10,20,14,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal.hidden{display:none}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:93vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet .x{float:right;border:0;background:#e8e2d3;width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.kv div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.kv small{display:block;font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.kv b{font-size:16px;font-variant-numeric:tabular-nums}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.esc{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0 10px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.opt b{font-size:26px;line-height:1}
.opt span{font-weight:800}
.opt small{font-size:12px;color:var(--mut)}
.opt.sel{border-color:var(--green2);background:#e9f3e2}
.big{font-size:34px!important;font-weight:800;text-align:center;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.step{display:grid;grid-template-columns:64px 1fr 64px;gap:8px;align-items:center}
.chk{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:14px}
.chk input,input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--green2)}
.note{font-size:12.5px;color:var(--mut);margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);text-align:right;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
.scroll{overflow-x:auto}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
.ing{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.ing:last-child{border-bottom:0}
.cfgrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
#tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11px;font-weight:700;color:var(--mut)}
#tabs a.on{color:var(--green2)}
svg.ic{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#side{display:none}
#toast{position:fixed;left:50%;top:calc(68px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-16px);background:var(--green);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;color:var(--mut);padding:24px 8px}
.login{position:fixed;inset:0;z-index:100;background:var(--green);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.login.hidden{display:none}
.login .box{background:var(--bg);border-radius:20px;padding:24px 20px;width:100%;max-width:380px}
.login img{width:58px;height:58px;border-radius:14px;display:block;margin:0 auto 10px}
.login img.wide{mix-blend-mode:multiply;width:100%;max-width:280px;height:auto;border-radius:0;margin:0 auto 6px}
.login h1{text-align:center;font-size:22px;font-weight:800;letter-spacing:-.02em}
.login .sub{text-align:center;color:var(--mut);font-size:13px;margin:2px 0 6px}
.login .err{color:var(--red);font-size:13px;font-weight:600;min-height:18px;margin-top:10px}
@media(min-width:700px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .grid2{grid-template-columns:1fr 1fr}
  .modal{align-items:center}.sheet{border-radius:20px}
}
@media(min-width:900px){
  #app{flex-direction:row}
  #tabs{display:none}
  #side{display:flex;flex-direction:column;gap:2px;width:228px;flex:none;background:var(--green);color:#e9e4d6;padding:18px 12px;position:sticky;top:0;height:100vh}
  #side .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-weight:800;font-size:18px;letter-spacing:-.01em}
  #side .brand img{width:36px;height:36px;border-radius:9px}
  #side a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;font-weight:600;color:#cfd8cd}
  #side a:hover{background:rgba(255,255,255,.07)}
  #side a.on{background:rgba(255,255,255,.14);color:#fff}
  #top .logo{display:none}
  #view{padding:22px 28px 40px}
  .stats{grid-template-columns:repeat(3,1fr)}
  #toast{top:76px}
}
@media(min-width:1100px){.stats.s4{grid-template-columns:repeat(4,1fr)}}

textarea{width:100%;padding:12px;border:1px solid #cfc7b5;border-radius:10px;font:inherit;background:#fff;color:var(--ink);resize:vertical}
input.mini{width:92px;min-height:36px;padding:6px 8px;text-align:right}
tr.tot td{border-top:2px solid var(--line);font-weight:700}
.distrow{display:grid;grid-template-columns:1fr 96px auto 32px;gap:8px;align-items:center;margin-top:8px}
.distrow span{font-size:12px;min-width:70px;text-align:right}
.rm{border:0;background:#ece7da;width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1;color:var(--ink)}
.ingrow{display:grid;grid-template-columns:1fr 86px 32px;gap:8px;align-items:center;margin-top:8px}
.ingrow .ingi{grid-column:1/-1;font-size:12px;margin-top:-2px}
a.row{color:inherit}
.kv4{grid-template-columns:repeat(2,1fr)}
@media(min-width:700px){.kv4{grid-template-columns:repeat(4,1fr)}}
.s4{grid-template-columns:repeat(2,1fr)}
@media(min-width:900px){.stats.s4{grid-template-columns:repeat(4,1fr)}}
@media(max-width:420px){.distrow{grid-template-columns:1fr 80px 32px}.distrow span{display:none}}
#splash{position:fixed;inset:0;z-index:200;background:#02050d;display:flex;align-items:center;justify-content:center;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
#splash img{width:100%;height:100%;object-fit:contain;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 14%,#000 86%,transparent),linear-gradient(to right,transparent,#000 8%,#000 92%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to bottom,transparent,#000 14%,#000 86%,transparent),linear-gradient(to right,transparent,#000 8%,#000 92%,transparent);mask-composite:intersect}
.hid{display:none!important}
.topout{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:99px;padding:6px 14px;font-weight:700;font-size:13px;white-space:nowrap}
.side-out{margin-top:auto}
body.adm #tabs{display:none}
body.adm #view{padding-bottom:40px}
@media(max-width:480px){.net:not(.off) .nl{display:none}.net{padding:4px 8px}}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#e8e2d3;border-radius:12px;padding:4px;margin:12px 0 4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:10px 6px;font-weight:700;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.gate-ic{font-size:40px;text-align:center;margin-bottom:6px}
.contas .row{cursor:default;align-items:flex-start}
.contas .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.nav-b{background:var(--amber);color:#2b1d00;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:auto}
</style>
</head>

const byId=(arr,id)=>arr.find(x=>x.id===id);
const area=id=>byId(S.areas,id),insumo=id=>byId(S.insumos,id),formula=id=>byId(S.formulas,id);
function loteCalc(l){
  const dias=num(l.dias),gmd=num(l.gmd),pi=lotePeso(l),c=num(l.cons)/100,q=loteQtd(l);
  const ganho=dias*gmd,pf=pi+ganho,pm=(pf+pi)/2;
  const ci=pi*c,cm=pm*c,cf=pf*c;
  const dec=l.inicio?clamp(diffDias(l.inicio,hoje()),0,dias):0;
  const ph=pi+gmd*dec,ch=ph*c;
  const fim=l.inicio?addDias(l.inicio,dias):'';
  const st=!l.inicio||l.inicio>hoje()?'futuro':(fim&&hoje()>fim?'encerrado':'ativo');
  return {ganho,pf,pm,ci,cm,cf,ciL:ci*q,cmL:cm*q,cfL:cf*q,perCab:cm*dias,perLote:cm*dias*q,fim,st,dec,pesoHoje:ph,consHoje:ch,consHojeL:ch*q,arrobas:q?(ganho*q*(num(l.rc)||.5))/15:0};
}
function compraCalc(id,st){
  st=st||S;
  const cs=st.compras.filter(c=>c.insumoId===id);
  const comprado=sum(cs,c=>c.qtd),valor=sum(cs,c=>num(c.qtd)*num(c.preco));
  let usado=0;
  st.batidas.forEach(b=>{(b.real||[]).forEach(r=>{if(r.id===id)usado+=num(r.kg)})});
  (st.forn||[]).forEach(h=>{if(h.prodId===id)usado+=num(h.kg)});
  return {comprado,valor,valorKg:comprado?valor/comprado:0,usado,estoque:comprado-usado};
}
function formCalc(f,st){
  st=st||S;
  let soma=0,ms=0,custo=0,pb=0,ndt=0,na=0,am=0,ee=0,iono=0,sd=0,semCompra=[];
  (f.ing||[]).forEach(g=>{
    const i=byId(st.insumos,g.id);if(!i)return;
    const p=num(g.pct)/100,cc=compraCalc(i.id,st),m=num(i.ms)/100;
    soma+=num(g.pct);ms+=p*num(i.ms);custo+=p*cc.valorKg;iono+=p*num(i.iono);
    sd+=p*m;pb+=p*m*num(i.pb);ndt+=p*m*num(i.ndt);na+=p*m*num(i.na);am+=p*m*num(i.am);ee+=p*m*num(i.ee);
    if(!cc.comprado)semCompra.push(i.nome);
  });
  return {soma,ms,custo,pb:sd?pb/sd:0,ndt:sd?ndt/sd:0,na:sd?na/sd:0,am:sd?am/sd:0,ee:sd?ee/sd:0,iono,semCompra};
}
function cochoInfo(areaId){
  const ls=S.lotes.filter(l=>l.areaId===areaId&&loteCalc(l).st==='ativo');
  const cons=sum(ls,l=>loteCalc(l).consHojeL),cap=sum(ls,l=>l.cap);
  const F=S.forn.filter(h=>h.areaId===areaId).sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:0);
  if(!F.length)return {cons,cap,saldo:0,dias:0,ever:false};
  let saldo=0,prev=null;
  F.forEach(f=>{if(prev)saldo=Math.max(0,saldo-cons*Math.max(0,diffDias(prev,f.data)));saldo+=num(f.kg);prev=f.data});
  saldo=Math.max(0,saldo-cons*Math.max(0,diffDias(prev,hoje())));
  return {cons,cap,saldo,dias:cons>0?saldo/cons:0,ever:true,acima:cap>0&&saldo>cap*1.001};
}

/* data em que o animal entrou neste lote: mudança registrada, senão o maior entre a entrada na fazenda e o início do lote */
function entradaNoLote(a,l){
  const m=(a.mov||[]).find(x=>x.loteId===l.id);if(m&&m.d)return m.d;
  return [a.entrada||'',l.inicio||''].sort().pop()||'';
}
/* peso de entrada do animal no lote: pesagem/estimativa na data de início do lote (padrão) ou peso de entrada na fazenda */
function pesoEntradaLote(a,l){
  if(l.pesoRef==='fazenda')return num(a.pesoIn);
  const d=entradaNoLote(a,l),p=d?pesoEm(a,d):0;
  return p>0?p:num(a.pesoIn);
}
function lotePeso(l){const A=animaisDoLote(l.id);return A.length?sum(A,a=>pesoEntradaLote(a,l))/A.length:num(l.pesoIn)}
function loteCat(l){
  const A=animaisDoLote(l.id);if(!A.length)return l.cat||'';
  const c=[...new Set(A.map(a=>a.cat||catSugerida(a.sexo,idadeMeses(a.nasc))).filter(Boolean))];

}
function idadeMeses(n){
  if(!n)return null;const a=new Date(n+'T12:00:00'),b=new Date();
  let m=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();if(b.getDate()<a.getDate())m--;return Math.max(0,m);
}
function usoMedio7(id){

/* consumo previsto por insumo: consumo dos lotes ativos de cada pasto × mistura da última ração fornecida lá */
function previstoInsumos(){
  const uso={};let semDieta=0,total=0;
  S.areas.forEach(a=>{
    const cons=sum(lotesDaArea(a.id).filter(l=>loteCalc(l).st==='ativo'),l=>loteCalc(l).consHojeL);
    if(!(cons>0))return;total+=cons;
    const hs=S.forn.filter(h=>h.areaId===a.id&&!h.prodId&&h.snap&&h.snap.length).sort((x,y)=>x.data<y.data?1:-1);
    let snap=hs[0]&&hs[0].snap;
    if(!snap){const fa=S.formulas.find(f=>f.ativa!==false&&(f.ing||[]).length);snap=fa&&fa.ing}
    if(!snap){semDieta+=cons;return}
    snap.forEach(g=>{uso[g.id]=(uso[g.id]||0)+cons*num(g.pct)/100});
  });
  return {uso,total,semDieta};
}
function estoqueDias(){
  const pv=previstoInsumos();
  const rows=S.insumos.map(i=>{
    const c=compraCalc(i.id),dia=pv.uso[i.id]||0,real=usoMedio7(i.id);
    const dias=dia>0?Math.max(0,c.estoque)/dia:null;
    return {i,c,dia,real,dias,fim:dias!=null?addDias(hoje(),Math.floor(dias)):''};
  }).filter(r=>r.dia>0||r.c.estoque>0||r.c.comprado>0);
  rows.sort((a,b)=>(a.dias==null)-(b.dias==null)||(a.dias||0)-(b.dias||0));
  return {rows,pv};
}

/* última pesagem do lote: data mais recente com pesagem de animais do lote e o peso médio nessa data */
function ultManejoLote(l){
  /* conta pesagens de manejo e também o peso de entrada na fazenda (animal que chegou naquele dia entra pesado) */
  const A=animaisDoLote(l.id),pts=A.map(a=>({a,P:pontosPeso(a)}));let d='';

  if(!d)return null;
  const W=pts.map(x=>x.P.find(p=>p.d===d)).filter(Boolean);
  return {d,n:W.length,kg:sum(W,p=>num(p.kg))/W.length,tot:A.length};
}

VIEWS.painel=()=>{
  const ativos=S.lotes.filter(l=>loteCalc(l).st==='ativo');
  const cab=S.animais.length+sum(S.lotes.filter(l=>!animaisDoLote(l.id).length&&loteCalc(l).st!=='encerrado'),l=>l.qtd);
  const prev=sum(ativos,l=>loteCalc(l).consHojeL);
  const estVal=sum(S.insumos,i=>{const c=compraCalc(i.id);return Math.max(0,c.estoque)*c.valorKg});
  const forn30=sum(S.forn.filter(h=>h.data>addDias(hoje(),-30)),h=>h.valor);
  const kg30=sum(S.forn.filter(h=>h.data>addDias(hoje(),-30)),h=>h.kg);
  const EDR=estoqueDias().rows;const al=[];
  const sl=S.animais.filter(a=>!a.loteId).length;
  if(sl)al.push(['ok',sl+' animal(is) cadastrado(s) ainda sem lote.','animais']);
  S.insumos.forEach(i=>{const c=compraCalc(i.id);
    if(c.comprado&&c.estoque<=0)al.push(['bad','Estoque de '+i.nome+' zerado ou negativo ('+fmt(c.estoque)+' kg) — confira compras e batidas.','insumos']);
    else{const er=EDR.find(r=>r.i.id===i.id),u=er&&er.dia>0?er.dia:usoMedio7(i.id);if(u>0&&c.estoque/u<7)al.push(['warn',i.nome+': estoque para ~'+fmt(c.estoque/u,1)+' dias ('+fmt(c.estoque)+' kg).','insumos'])}});
  S.formulas.forEach(f=>{if(f.ativa!==false){const c=formCalc(f);if(Math.abs(c.soma-100)>.01)al.push(['bad','Formulação “'+f.nome+'” soma '+fmt(c.soma,2)+'% (deveria ser 100%).','formulas']);else if(c.semCompra.length)al.push(['warn','“'+f.nome+'”: sem compra registrada de '+c.semCompra.join(', ')+' — custo subestimado.','formulas'])}});
  ativos.forEach(l=>{const c=loteCalc(l),d=diffDias(hoje(),c.fim);if(d<=7&&d>=0)al.push(['ok','Lote “'+l.nome+'” termina em '+d+' dia(s) ('+fmtData(c.fim)+').','lotes'])});
  const vistas=new Set();
  const linhas=ativos.map(l=>{
    const c=loteCalc(l),ar=area(l.areaId),f=fornHoje(l.areaId),ci=cochoInfo(l.areaId),nx=textoProximo(ci),ult=ultimoForn(l.areaId);
    if(!vistas.has(l.areaId)){vistas.add(l.areaId);if(nx.cls==='warn')al.push(['warn','“'+l.nome+'”: o cocho deve acabar hoje — hora de tratar.','batida']);if(ci.acima)al.push(['warn','“'+l.nome+'”: '+fmt(ci.saldo)+' kg no cocho, acima da capacidade ('+fmt(ci.cap)+' kg).','lotes'])}
    return '<tr><td><b>'+esc(l.nome)+'</b><br><span class="mut">'+esc(ar?ar.nome:'—')+' · '+fmt(loteQtd(l))+' cab</span></td><td>'+fmt(c.consHojeL)+'</td><td>'+fmt(f)+'<br><span class="mut" style="font-size:11px">últ. '+fmtData(ult)+'</span></td><td>'+(ci.ever?fmt(ci.saldo):'—')+(ci.cap?'<br><span class="mut" style="font-size:11px">de '+fmt(ci.cap)+' ('+fmt(ci.saldo/ci.cap*100)+'%)</span>':'')+'</td><td><span class="b '+nx.cls+'">'+nx.t+'</span>'+(nx.sub?'<br><span class="mut" style="font-size:11px">'+nx.sub+'</span>':'')+'</td></tr>';
  }).join('');
  return '<div class="stats s4">'
   +'<div class="stat"><div class="l">Animais</div><div class="v">'+fmt(cab)+'</div><div class="s">'+ativos.length+' lote(s) ativo(s) de '+S.lotes.length+'</div></div>'
   +'<div class="stat"><div class="l">Trato previsto hoje</div><div class="v">'+fmt(prev/1000,2)+' <small>t</small></div><div class="s">pelo peso estimado de hoje</div></div>'
   +'<div class="stat"><div class="l">Fornecido (30 dias)</div><div class="v">'+fmt(kg30/1000,1)+' <small>t</small></div><div class="s">'+brl(forn30)+'</div></div>'
   +'<div class="stat"><div class="l">Insumos em estoque</div><div class="v">'+'R$ '+fmt(estVal)+'</div><div class="s">pelo custo médio de compra</div></div></div>'
   +'<div class="grid2" style="margin-top:12px"><div class="card"><h3>Atenção</h3>'
   +(al.length?al.map(a=>'<div class="row" data-act="go" data-v="'+a[2]+'"><span class="b '+a[0]+'">'+(a[0]==='ok'?'Info':a[0]==='warn'?'Atenção':'Urgente')+'</span><div class="g"><span style="color:var(--ink)">'+esc(a[1])+'</span></div></div>').join(''):'<div class="empty">Nada pendente. Estoques, formulações e lotes em dia.</div>')
   +'</div><div class="card"><h3>Atalhos</h3><div style="display:grid;gap:10px;margin-top:10px"><a class="btn" href="#batida">Nova batida</a><button class="btn sec" data-act="novoLote">Novo lote</button><button class="btn sec" data-act="novaCompra">Registrar compra</button></div></div></div>'
   +'<div class="card" style="margin-top:12px"><h3>Trato por lote</h3>'
   +(ativos.length?'<div class="scroll"><table><tr><th>Lote / pasto</th><th>Consumo kg/dia</th><th>Fornecido hoje</th><th>No cocho kg</th><th>Próximo trato</th></tr>'+linhas+'</table></div>':'<div class="empty">Nenhum lote ativo hoje. Cadastre um lote em “Lotes”.</div>')+'</div>';
};

VIEWS.lotes=()=>{
  let h=head('Lotes',S.lotes.length+' cadastrado(s) · quantidade, peso e categoria vêm dos animais','<button class="btn sm" data-act="novoLote">+ Novo lote</button>');
  if(!S.lotes.length)return h+'<div class="card empty">Nenhum lote ainda. Crie o lote escolhendo o pasto de destino e o sistema (recria ou engorda); depois adicione os animais.</div>';
  const rows=S.lotes.slice().sort((a,b)=>(a.inicio||'')<(b.inicio||'')?1:-1).map(l=>{
    const c=loteCalc(l),ar=area(l.areaId);
    return '<tr data-act="lote" data-id="'+l.id+'" style="cursor:pointer"><td><b>'+esc(l.nome)+'</b><br><span class="mut">'+esc(ar?ar.nome:'—')+' · '+esc(l.sis||'—')+'</span></td><td>'+fmt(loteQtd(l))+'</td><td>'+(loteQtd(l)?fmt(lotePeso(l)):'—')+'</td><td>'+esc(loteCat(l)||'—')+'</td><td>'+ultManejoTxt(l)+'</td><td>'+fmt(c.cmL)+'</td><td><button type="button" class="btn sm sec" data-act="lote" data-id="'+l.id+'">Editar</button></td></tr>';
  }).join('');
  return h+'<div class="card"><div class="scroll"><table><tr><th>Lote</th><th>Cab</th><th>Peso ent. no lote</th><th>Categoria</th><th>Peso médio último manejo</th><th>Médio kg/dia</th><th></th></tr>'+rows+'</table></div></div>'
   +'<p class="note">Toque num lote para ver a projeção, adicionar ou tirar animais.</p>';
};

VIEWS.animais=()=>{
  const btns='<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end"><button class="btn sm sec" data-act="expAnimais">Exportar Excel</button><button class="btn sm sec" data-act="importar">Importar Excel</button><button class="btn sm sec" data-act="novosAnimais">+ Vários</button><button class="btn sm" data-act="novoAnimal">+ Novo animal</button></div>';
  const h=head('Animais',S.animais.length+' cadastrado(s)',btns);
  if(!S.animais.length)return h+'<div class="card empty">Nenhum animal cadastrado. Toque em “+ Novo animal”, “+ Vários” (sequência de brincos) ou “Importar Excel”.</div>';
  const semLote=S.animais.filter(a=>!a.loteId).length;
  const FI=fichasAnimais(S.animais),nDiv=S.animais.filter(a=>FI.get(a.id).diverge).length;
  const chips='<div class="chips"><button class="chip '+(!fAn?'on':'')+'" data-act="fan" data-f="">Todos</button>'+(nDiv?'<button class="chip '+(fAn==='div'?'on':'')+'" data-act="fan" data-f="div">⚠ Data de pesagem diferente ('+nDiv+')</button>':'')+'<button class="chip '+(fAn==='none'?'on':'')+'" data-act="fan" data-f="none">Sem lote ('+semLote+')</button>'+S.lotes.map(l=>'<button class="chip '+(fAn===l.id?'on':'')+'" data-act="fan" data-f="'+l.id+'">'+esc(l.nome)+' ('+animaisDoLote(l.id).length+')</button>').join('')+'</div>';
  const lista=S.animais.filter(a=>!fAn||(fAn==='div'?FI.get(a.id).diverge:fAn==='none'?!a.loteId:a.loteId===fAn));
  const barra=fSel
    ?'<div class="card" style="position:sticky;top:64px;z-index:5;display:flex;gap:8px;flex-wrap:wrap;align-items:center"><b id="sel-n" style="margin-right:auto">0 selecionado(s)</b><button class="btn sm sec" data-act="selAll" data-v="1">Marcar todos</button><button class="btn sm sec" data-act="selAll" data-v="0">Limpar</button><button class="btn sm" style="background:var(--red)" data-act="selDel">Excluir</button><button class="btn sm line" data-act="selOff">Cancelar</button></div>'
    :'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px"><button class="btn sm line" data-act="selOn">Selecionar e apagar</button><button class="btn sm line" data-act="impLista">Desfazer importação</button></div>';
  const rows=lista.slice().sort((a,b)=>String(a.brinco).localeCompare(String(b.brinco),'pt-BR',{numeric:true})).map(a=>{
    const fi=FI.get(a.id),m=idadeMeses(a.nasc),l=byId(S.lotes,a.loteId),cat=a.cat||catSugerida(a.sexo,m);
    const act=fSel?'selRow':'animal';
    return '<tr data-act="'+act+'" data-id="'+a.id+'" data-s="'+esc((a.brinco+' '+a.raca+' '+a.dono+' '+(a.origem||'')+' '+cat+' '+(l?l.nome:'')).toLowerCase())+'" style="cursor:pointer">'+(fSel?'<td style="width:34px"><input type="checkbox" class="sel-cb" data-id="'+a.id+'" style="width:20px;height:20px"></td>':'')+'<td><b>'+esc(a.brinco)+'</b>'+(fi.diverge?' <span class="b warn" title="Última pesagem em data diferente da maioria do lote">⚠</span>':'')+'<br><span class="mut">'+esc(cat)+' · '+esc(a.raca||'')+(a.origem?' · '+esc(a.origem):'')+(l?' · '+esc(l.nome):'')+'</span></td><td>'+(m==null?'—':m+' m')+'</td><td>'+(fi.compra?fmtData(fi.compra):'—')+'</td><td>'+fmt(a.pesoIn)+'</td><td>'+brl(a.valor)+'<br><span class="mut" style="font-size:11px">'+esc(a.dono||'')+'</span></td><td>'+brl(fi.nutri)+'</td><td>'+fG(fi.gUlt)+(fi.ult?'<br><span class="mut" style="font-size:11px">pesado '+fmtData(fi.ult.d)+'</span>':'')+'</td><td>'+fG(fi.gGlob)+'</td><td>'+(fi.atual?fmt(fi.atual,1)+(fi.est?'<span class="mut" title="projeção">~</span>':''):'—')+(fi.ult?'<br><span class="mut" style="font-size:11px">'+(fi.est?'últ. pesagem ':'')+fmtData(fi.ult.d)+'</span>':'')+'</td></tr>'}).join('');
  return h+barra+chips+'<div class="card"><input id="an-q" placeholder="Buscar brinco, categoria, raça, proprietário" style="margin-bottom:10px"><div class="scroll"><table><tr>'+(fSel?'<th></th>':'')+'<th>Brinco</th><th>Idade</th><th>Compra</th><th>1º peso</th><th>Valor pago</th><th>Nutrição</th><th>Últ. GMD</th><th>GMD global</th><th>Peso atual</th></tr>'+rows+'</table></div>'+(lista.length?'':'<div class="empty">Nenhum animal neste filtro.</div>')+'</div>';
};

VIEWS.areas=()=>{
  const h=head('Pastos e baias',S.areas.length+' área(s) · '+fmt(sum(S.areas,a=>a.m2)/10000,1)+' ha no total','<button class="btn sm" data-act="novaArea">+ Nova área</button>');
  if(!S.areas.length)return h+'<div class="card empty">Cadastre pastos ou baias.</div>';
  return h+'<div class="card">'+S.areas.map(a=>{const ls=lotesDaArea(a.id);
    return '<div class="row" data-act="area" data-id="'+a.id+'"><div class="g"><b>'+esc(a.nome)+'</b><span>'+(ls.length?ls.map(l=>esc(l.nome)+' ('+loteQtd(l)+')').join(', '):'livre')+'</span></div><div class="r"><b>'+fmt(num(a.m2)/10000,2)+' ha</b><span class="mut" style="font-size:12px">'+fmt(a.m2)+' m²</span></div></div>'}).join('')+'</div>';
};

VIEWS.insumos=()=>{
  const h=head('Lista de insumos','Comprado, valor e estoque saem das compras e das batidas','<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end"><button class="btn sm sec" data-act="insSaidas" data-id="">Saídas (Excel)</button><button class="btn sm" data-act="novoInsumo">+ Novo insumo</button></div>');
  const base=S.insumos.filter(i=>!i.acabado);
  if(!base.length)return h+'<div class="card empty">Cadastre os insumos base.</div>';
  const rows=base.map(i=>{const c=compraCalc(i.id);
    return '<tr data-act="insumo" data-id="'+i.id+'" style="cursor:pointer"><td><b>'+esc(i.nome)+'</b><br><span class="mut">'+esc(i.cat||'')+' · saco '+fmt(i.saco)+' kg</span></td><td>'+fmt(i.ms)+'</td><td>'+fmt(c.comprado)+'</td><td>'+(c.comprado?fmt(c.valorKg,2):'—')+'</td><td>'+fmt(c.usado)+'</td><td><span class="b '+(c.estoque<0?'bad':c.estoque===0?'mut':'ok')+'">'+fmt(c.estoque)+'</span></td></tr>'}).join('');
  const ed=estoqueDias();
  const cardE=ed.rows.length?'<div class="card"><h3>Estoque × consumo previsto</h3><p class="note" style="margin:0 0 8px">Consumo previsto = o que os lotes ativos devem comer por dia × a mistura da última ração fornecida em cada pasto.'+(ed.pv.semDieta?' (Há pasto com lote sem ração fornecida ainda: fora da conta.)':'')+'</p><div class="scroll"><table><tr><th>Insumo</th><th>Estoque kg</th><th>Previsto kg/dia</th><th>Dura</th><th>Acaba em</th></tr>'+ed.rows.map(r=>{const d=r.dias,cl=d==null?'mut':d<4?'bad':d<8?'warn':'ok';return '<tr><td><b>'+esc(r.i.nome)+'</b>'+(r.real>0?'<br><span class="mut" style="font-size:12px">últimos 7 dias: '+fmt(r.real)+' kg/dia</span>':'')+'</td><td>'+fmt(r.c.estoque)+'</td><td>'+(r.dia>0?fmt(r.dia):'—')+'</td><td><span class="b '+cl+'">'+(d==null?'—':fmt(d,1)+' dias')+'</span></td><td>'+(r.fim?fmtData(r.fim):'—')+'</td></tr>'}).join('')+'</table></div></div>':'';
  return h+cardE+'<div class="card"><div class="scroll"><table><tr><th>Insumo</th><th>MS%</th><th>Comprado kg</th><th>R$/kg</th><th>Utilizado</th><th>Estoque kg</th></tr>'+rows+'</table></div></div>';
};

VIEWS.compras=()=>{
  const h=head('Compra de insumos',S.compras.length+' compra(s) · total '+brl(sum(S.compras,c=>num(c.qtd)*num(c.preco))),'<button class="btn sm" data-act="novaCompra">+ Registrar compra</button>');
  if(!S.compras.length)return h+'<div class="card empty">Nenhuma compra registrada.</div>';
  const rows=S.compras.slice().sort((a,b)=>(a.data||'')<(b.data||'')?1:-1).map(c=>{const i=insumo(c.insumoId);
    return '<tr data-act="compra" data-id="'+c.id+'" style="cursor:pointer"><td><b>'+esc(i?i.nome:'(removido)')+'</b><br><span class="mut">'+esc(c.forn||'sem fornecedor')+' · '+fmtData(c.data)+'</span></td><td>'+fmt(c.qtd)+'</td><td>'+fmt(c.preco,2)+'</td><td>'+brl(num(c.qtd)*num(c.preco))+'</td></tr>'}).join('');
  return h+'<div class="card"><div class="scroll"><table><tr><th>Matéria-prima</th><th>Qtd kg</th><th>R$/kg</th><th>Valor total</th></tr>'+rows+'</table></div></div>';
};

VIEWS.formulas=()=>{
  const h=head('Formulações',S.formulas.length+' salva(s) · inclusões somam 100%','<button class="btn sm" data-act="novaFormula">+ Nova formulação</button>');
  if(!S.formulas.length)return h+'<div class="card empty">Crie a primeira formulação.</div>';
  return h+'<div class="card">'+S.formulas.map(f=>{const c=formCalc(f),ok=Math.abs(c.soma-100)<=.01;
    return '<div class="row" data-act="formula" data-id="'+f.id+'"><div class="g"><b>'+esc(f.nome)+' <span class="b '+(f.ativa!==false?'ok':'mut')+'">'+(f.ativa!==false?'Ativa':'Inativa')+'</span></b><span>'+esc(f.tipo||'')+' · '+(f.ing||[]).length+' ingredientes · MS '+fmt(c.ms,1)+'% · PB '+fmt(c.pb,1)+'% (MS)</span></div><div class="r"><b>'+brl(c.custo)+'/kg</b>'+(ok?'':'<span class="b bad">soma '+fmt(c.soma,1)+'%</span>')+'</div></div>'}).join('')+'</div>';
};

VIEWS.histLista=()=>{
  const lista=S.forn.filter(h=>!fHist||h.areaId===fHist).sort((a,b)=>(a.data<b.data?1:a.data>b.data?-1:0));
  const tabs=head('Histórico de fornecimento',lista.length+' registro(s) · '+fmt(sum(lista,h=>h.kg))+' kg · '+brl(sum(lista,h=>h.valor)),'<button class="btn sm sec" data-act="csv">Exportar CSV</button>');
  const f='<div class="chips"><button class="chip '+(!fHist?'on':'')+'" data-act="fhist" data-f="">Todos</button>'+S.areas.filter(a=>S.forn.some(h=>h.areaId===a.id)).map(a=>'<button class="chip '+(fHist===a.id?'on':'')+'" data-act="fhist" data-f="'+a.id+'">'+esc(a.nome)+'</button>').join('')+'</div>';
  if(!lista.length)return tabs+f+'<div class="card empty">Nada fornecido ainda. Faça uma batida e distribua nos pastos.</div>';
  return tabs+f+'<div class="card"><div class="scroll"><table><tr><th>Pasto / data</th><th>Fórmula</th><th>kg</th><th>Valor</th></tr>'+lista.map(h=>{const a=area(h.areaId);
    return '<tr data-act="forn" data-id="'+h.id+'" style="cursor:pointer"><td><b>'+esc(a?a.nome:'(removido)')+'</b><br><span class="mut">'+fmtData(h.data)+'</span></td><td>'+esc(h.nome)+'</td><td>'+fmt(h.kg)+'</td><td>'+brl(h.valor)+'</td></tr>'}).join('')+'</table></div></div>';
};

VIEWS.admin=()=>{
  if(!isSuper())return '<div class="card empty">Acesso restrito ao administrador.</div>';
  const grupos=[['pendente','Aguardando liberação'],['liberado','Liberados'],['bloqueado','Bloqueados']];
  const dt=iso=>iso?fmtData(iso.slice(0,10)):'—';
  const n=st=>ADM.contas.filter(c=>(c.status||'pendente')===st).length;
  let h='<div class="stats s4"><div class="stat"><div class="l">Clientes</div><div class="v">'+ADM.contas.length+'</div><div class="s">cadastrados</div></div>'
   +'<div class="stat '+(n('pendente')?'badv':'')+'"><div class="l">Aguardando</div><div class="v">'+n('pendente')+'</div><div class="s">liberação</div></div>'
   +'<div class="stat good"><div class="l">Liberados</div><div class="v">'+n('liberado')+'</div><div class="s">com acesso</div></div>'
   +'<div class="stat"><div class="l">Bloqueados</div><div class="v">'+n('bloqueado')+'</div><div class="s">sem acesso</div></div></div>';
  if(!ADM.contas.length)return h+'<div class="card empty" style="margin-top:12px">Nenhum cadastro ainda. Quando alguém criar uma conta, aparece aqui.</div>';
  h+='<input id="adm-q" placeholder="Buscar fazenda, nome ou e-mail" style="margin-top:12px">';
  grupos.forEach(([st,tt])=>{
    const L=ADM.contas.filter(c=>(c.status||'pendente')===st).sort((a,b)=>String(b.criadoEm||'').localeCompare(String(a.criadoEm||'')));
    if(!L.length)return;
    h+='<div class="linha">'+tt+' ('+L.length+')</div><div class="card contas">'+L.map(c=>{
      const wa=String(c.whats||'').replace(/\D/g,'');
      return '<div class="row" data-s="'+esc(((c.fazenda||'')+' '+(c.nome||'')+' '+(c.email||'')).toLowerCase())+'"><div class="g"><b>'+esc(c.fazenda||'(sem nome)')+'</b><span>'+esc(c.nome||'')+(c.nome?' · ':'')+esc(c.email||'')+(c.whats?' · '+esc(c.whats):'')+'</span><span style="display:block;font-size:12px">Cadastro em '+dt(c.criadoEm)+(c.decididoEm?' · decisão em '+dt(c.decididoEm):'')+'</span>'
      +'<div class="acts">'+(st!=='liberado'?'<button class="btn sm" data-act="admSet" data-id="'+esc(c.id)+'" data-st="liberado">Liberar acesso</button>':'')
      +(st!=='bloqueado'?'<button class="btn sm sec" data-act="admSet" data-id="'+esc(c.id)+'" data-st="bloqueado">'+(st==='pendente'?'Recusar':'Bloquear')+'</button>':'')
      +(st==='liberado'?'<button class="btn sm sec" data-act="admDemo" data-id="'+esc(c.id)+'" data-nm="'+esc(c.fazenda||'')+'">Carregar demonstração</button>':'')
      +(wa?'<a class="btn sm sec" target="_blank" rel="noopener" href="https://wa.me/'+(wa.length<=11?'55':'')+wa+'">WhatsApp</a>':'')
      +'<button class="btn sm line" style="color:var(--red)" data-act="admDel" data-id="'+esc(c.id)+'">Remover</button></div></div></div>'}).join('')+'</div>';
  });

function btInit(){
  if(BT&&(!BT.formulaId||formula(BT.formulaId)))return;
  if(!BT)BT={formulaId:'',qtd:'',data:hoje(),real:{},dist:[],modo:'kg'};
  if(!formula(BT.formulaId))BT.formulaId=(S.formulas.find(f=>f.ativa!==false)||{}).id||'';
}
function btCalc(){
  const f=formula(BT.formulaId);if(!f)return null;
  const q=num(BT.qtd);
  const rows=(f.ing||[]).map(g=>{
    const i=insumo(g.id),pl=q*num(g.pct)/100,hasR=BT.real[g.id]!==undefined&&BT.real[g.id]!=='';
    const rl=hasR?num(BT.real[g.id]):0,cc=compraCalc(g.id);
    return {id:g.id,nome:i?i.nome:'(removido)',pct:num(g.pct),pl,rl,vkg:cc.valorKg,val:rl*cc.valorKg,dif:rl-pl,estoque:cc.estoque};
  });
  let acc=0;rows.forEach((r,k)=>{const filled=BT.real[r.id]!==undefined&&BT.real[r.id]!=='';r.filled=filled;r.alvo=acc+r.pl;acc+=filled?r.rl:r.pl;r.leit=filled?sum(rows.slice(0,k+1),x=>x.rl):0});
  const alvoFinal=acc;
  const tp=sum(rows,r=>r.pl),tr=sum(rows,r=>r.rl),tv=sum(rows,r=>r.val);
  const forn=sum(BT.dist,d=>num(d.kg));
  return {f,q,rows,alvoFinal,tp,tr,tv,vkg:tr?tv/tr:0,forn,sobra:tr-forn};
}

const nrm=x=>String(x==null?'':x).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const IMP_MAP={brinco:['brinco','identificacao','id','numero','nbrinco','nrbrinco','animal'],sexo:['sexo'],cat:['categoria','cat'],nasc:['nascimento','datanascimento','nasc','dtnasc','datadenascimento'],idade:['idade','idademeses','idadeemmeses','meses'],raca:['raca'],dono:['proprietario','dono'],origem:['origem','procedencia'],entrada:['entrada','dataentrada','dtentrada','datadeentrada'],peso:['peso','pesocompra','pesodecompra','pesoentrada','pesodeentrada','pesokg'],valorKg:['valorkg','valorporkg','rkg','valorkgpago','precokg','valorporkgpago'],valor:['valor','valorpago','valortotal','total'],lote:['lote']};
function impNum(v){if(typeof v==='number')return v;let t=String(v==null?'':v).replace(/[R$\s]/g,'');if(t.includes(',')&&t.includes('.'))t=t.replace(/\./g,'');return num(t)}
function impData(v){
  if(v==null||v==='')return '';
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5);return d.toISOString().slice(0,10)}
  if(v instanceof Date)return new Date(v.getTime()+12*36e5).toISOString().slice(0,10);
  const t=String(v).trim();let m;
  if((m=t.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/))){const y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')}
  if((m=t.match(/^(\d{4})-(\d{2})-(\d{2})/)))return m[1]+'-'+m[2]+'-'+m[3];
  return '';
}
function impParse(rows){
  const hdr=rows[0].map(nrm),ix={};
  Object.keys(IMP_MAP).forEach(k=>{const j=hdr.findIndex(h=>IMP_MAP[k].includes(h));if(j>=0)ix[k]=j});
  if(ix.brinco==null)return {erro:'Não encontrei a coluna “Brinco” na primeira linha.'};
  const ex=new Set(S.animais.map(a=>String(a.brinco).toLowerCase())),vistos=new Set(),ok=[],dup=[],vazio=[],semLote=new Set();
  const lotes=new Map(S.lotes.map(l=>[nrm(l.nome),l]));
  rows.slice(1).forEach(r=>{
    const g=k=>ix[k]==null?'':r[ix[k]];
    const brinco=String(g('brinco')==null?'':g('brinco')).trim();
    if(!r.some(c=>c!==''&&c!=null))return;
    if(!brinco){vazio.push(1);return}
    const key=brinco.toLowerCase();
    if(ex.has(key)||vistos.has(key)){dup.push(brinco);return}
    vistos.add(key);
    const sx=nrm(g('sexo')).startsWith('f')?'Fêmea':'Macho';
    let nasc=impData(g('nasc'));
    if(!nasc&&g('idade')!==''){const m=impNum(g('idade'));if(m>0)nasc=addDias(hoje(),-Math.round(m*30.4375))}
    const cn=nrm(g('cat')),cat=CATS_ANIMAL.find(c=>nrm(c)===cn)||catSugerida(sx,idadeMeses(nasc))||'';
    const pesoIn=impNum(g('peso'));let valorKg=impNum(g('valorKg')),valor=impNum(g('valor'));
    if(valorKg>0)valor=r2(pesoIn*valorKg);else if(valor>0&&pesoIn>0)valorKg=r2(valor/pesoIn);
    let loteId='';const ln=String(g('lote')==null?'':g('lote')).trim();
    if(ln){const l=lotes.get(nrm(ln));if(l)loteId=l.id;else semLote.add(ln)}
    ok.push({id:uid(),brinco,sexo:sx,cat,nasc,raca:String(g('raca')||'').trim(),dono:String(g('dono')||'').trim(),origem:String(g('origem')||'').trim(),entrada:impData(g('entrada'))||hoje(),pesoIn,valorKg,valor,loteId});
  });
  return {ok,dup,vazio:vazio.length,semLote:[...semLote]};
}
let IMPARQ='';
function impLer(file){
  IMPARQ=file.name||'';
  const box=$('#imp-r');box.innerHTML='<p class="note">Lendo planilha…</p>';
  loadXLSX().then(()=>file.arrayBuffer()).then(buf=>{
    const wb=XLSX.read(buf,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
    if(rows.length<2){box.innerHTML='<p class="note" style="color:var(--red)">A planilha está vazia.</p>';return}
    const r=impParse(rows);
    if(r.erro){box.innerHTML='<p class="note" style="color:var(--red)">'+r.erro+'</p>';return}
    IMP=r.ok;
    box.innerHTML='<div class="kv"><div><small>Prontos</small><b>'+r.ok.length+'</b></div><div><small>Ignorados</small><b>'+(r.dup.length+r.vazio)+'</b></div><div><small>Valor total</small><b>'+brl(sum(r.ok,a=>a.valor))+'</b></div></div>'
     +(r.dup.length?'<p class="note">Brinco já cadastrado ou repetido (ignorados): '+esc(r.dup.slice(0,8).join(', '))+(r.dup.length>8?'…':'')+'</p>':'')
     +(r.vazio?'<p class="note">'+r.vazio+' linha(s) sem brinco ignorada(s).</p>':'')
     +(r.semLote.length?'<p class="note">Lote não encontrado (ficam sem lote): '+esc(r.semLote.join(', '))+'. Crie o lote em Lotes e atribua depois.</p>':'')
     +(r.ok.length?'<div class="scroll"><table><tr><th>Brinco</th><th>Categoria</th><th>Peso</th><th>Valor</th></tr>'+r.ok.slice(0,5).map(a=>'<tr><td>'+esc(a.brinco)+'</td><td>'+esc(a.cat||'—')+'</td><td>'+fmt(a.pesoIn)+'</td><td>'+brl(a.valor)+'</td></tr>').join('')+'</table></div><p class="note">'+(r.ok.length>5?'Mostrando 5 de '+r.ok.length+'.':'')+'</p><button type="button" class="btn block" data-act="impGo">Importar '+r.ok.length+' animais</button>':'');
  }).catch(()=>{box.innerHTML='<p class="note" style="color:var(--red)">Não consegui ler o arquivo. Precisa de internet para abrir planilhas; confira também se é .xlsx, .xls ou .csv.</p>'});
}

  if(ing.some(g=>!(g.pct>0)))return toast('Informe a inclusão (%) de cada ingrediente');
  if(new Set(ing.map(g=>g.id)).size!==ing.length)return toast('Ingrediente repetido na fórmula');
  if(!ing.length)return toast('Adicione ao menos um ingrediente');
  const soma=sum(ing,g=>g.pct);
  if(Math.abs(soma-100)>.01)return toast('A soma das inclusões é '+fmt(soma,2)+'% — precisa ser 100%');
  if(S.formulas.some(f=>f.nome.toLowerCase()===nome.toLowerCase()&&f.id!==FD.id))return toast('Já existe uma formulação com esse nome');
  const o={nome,tipo:FD.tipo,ativa:FD.ativa,ing};
  if(FD.id)Object.assign(formula(FD.id),o);else S.formulas.push(Object.assign({id:uid()},o));
  save();closeModal();FD=null;render(false);toast('Formulação salva');
};
function btSave(){
  btRead();
  const c=btCalc();
  if(!c)return toast('Escolha a fórmula');
  if(!BT.data)return toast('Informe a data');
  if(!(c.q>0))return toast('Informe a quantidade a fabricar');

  if(!(c.tr>0)){c.rows.forEach(r=>{BT.real[r.id]=String(r2(r.pl))});updBatida();return toast('Realizado vazio: preenchi com o planejado. Confira e salve de novo.')}
  const dist=BT.dist.filter(d=>d.areaId||num(d.kg));

/* ---- saídas de insumo (por ração fabricada) ---- */
function saidasInsumo(id){
  const L=[['Data','Ração fabricada','Insumo','kg do insumo usado','R$/kg do insumo (custo médio)','Custo do insumo (R$)','Total da batida (kg)','Custo da ração (R$/kg)','Custo total da batida (R$)','Destino']];
  let tk=0,tv=0;
  S.batidas.slice().sort((a,b)=>a.data<b.data?-1:1).forEach(b=>{
    (b.real||[]).forEach(r=>{
      if(id&&r.id!==id)return;
      const i=insumo(r.id);if(!i||!num(r.kg))return;
      const pk=compraCalc(i.id).valorKg,v=num(r.kg)*pk;tk+=num(r.kg);tv+=v;
      L.push([b.data,b.formulaNome||'',i.nome,r2(num(r.kg)),r2(pk*100)/100,r2(v),r2(num(b.qtd)),r2(num(b.custoKg)*100)/100,r2(num(b.total)),(b.dist||[]).map(d=>{const a=area(d.areaId);return (a?a.nome:'?')+' '+fmt(d.kg)+' kg'}).join(' · ')]);
    });
  });
  if(L.length===1)return toast('Esse insumo ainda não teve saídas');
  L.push(['TOTAL','','',r2(tk),'',r2(tv),'','','','']);
  const i=id?insumo(id):null;
  baixarTabela('saidas-'+(i?slug(i.nome):'todos-insumos')+'-'+hoje(),L,[11,26,22,16,18,16,16,16,18,40]);
}

/* ---- peso e presença do animal ao longo do tempo ---- */
function pontosPeso(a){
  const p=[];if(a.entrada&&num(a.pesoIn)>0)p.push({d:a.entrada,kg:num(a.pesoIn)});
  (a.pes||[]).forEach(x=>{if(x.d&&num(x.kg)>0)p.push({d:x.d,kg:num(x.kg)})});
  return p.sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:0);
}
let FMIN=null,MINENT={};
/* início de presença de quem não tem histórico de mudança: entrada/início do lote; com 'retro', recua até o 1º trato do pasto no período do lote */
function iniEfetivo(a,l){
  const base=[a.entrada||'',l&&l.inicio||''].sort().pop();
  const f=FMIN&&l&&FMIN[l.id];
  /* o retroativo vale só para o grupo que formou o lote; animais que entraram depois (≥ 8 dias da 1ª entrada) não recebem tratos anteriores à entrada */
  const m=l&&MINENT[l.id];
  if(m&&a.entrada&&a.entrada>addDias(m,7))return base;
  return f&&f<base?f:base;
}
function loteDoAnimalEm(a,d){
  let L=a.mov;
  if(!L||!L.length){
    if(!a.loteId)return '';
    const l=byId(S.lotes,a.loteId);
    const start=iniEfetivo(a,l);
    return d>=start?a.loteId:'';
  }
  let r='';for(const m of L){if(m.d<=d)r=m.loteId;else break}return r;
}
function pesoEm(a,d,P){
  const p=P||pontosPeso(a);if(!p.length)return 0;
  if(d<=p[0].d)return p[0].kg;
  for(let i=1;i<p.length;i++){
    if(d<=p[i].d){const t=diffDias(p[i-1].d,p[i].d)||1,u=diffDias(p[i-1].d,d);return p[i-1].kg+(p[i].kg-p[i-1].kg)*u/t}
  }
  const last=p[p.length-1],l=byId(S.lotes,loteDoAnimalEm(a,d));
  return last.kg+(l?num(l.gmd):0)*Math.max(0,diffDias(last.d,d));
}
function moverAnimal(a,loteId,data,datado){
  loteId=loteId||'';if((a.loteId||'')===loteId)return false;
  if(!datado&&!a.loteId&&!(a.mov&&a.mov.length)){a.loteId=loteId;return true}
  if(!a.mov||!a.mov.length){
    a.mov=[];
    if(a.loteId){const l=byId(S.lotes,a.loteId);a.mov.push({d:[a.entrada||'',l&&l.inicio||''].sort().pop()||data,loteId:a.loteId})}
  }
  a.mov=a.mov.filter(m=>m.d<data);a.mov.push({d:data,loteId});a.loteId=loteId;return true;
}

/* ---- distribuição do custo da ração pelo peso do animal ---- */
function calcCustos(de,ate){
  FMIN=null;MINENT={};S.lotes.forEach(l=>{const e=S.animais.filter(a=>a.loteId===l.id&&a.entrada).map(a=>a.entrada).sort()[0];if(e)MINENT[l.id]=e});
  if(fCu.retro!==false){FMIN={};S.lotes.forEach(l=>{let m='';S.forn.forEach(h=>{if(h.areaId===l.areaId&&h.data>=(de||l.inicio||'')&&(!m||h.data<m))m=h.data});if(m)FMIN[l.id]=m})}
  const P=new Map(S.animais.map(a=>[a.id,pontosPeso(a)]));
  const porA=new Map(),porL=new Map();
  const nl=id=>{if(!porL.has(id))porL.set(id,{kg:0,valor:0,semKg:0,semValor:0,diasAnimal:0});return porL.get(id)};
  const pa=(aid,lid)=>{const k=aid+'|'+lid;if(!porA.has(k))porA.set(k,{aid,lid,kg:0,valor:0,dias:new Set()});return porA.get(k)};
  S.forn.forEach(h=>{
    if(de&&h.data<de)return;if(ate&&h.data>ate)return;
    const ar=h.areaId,pres=[];
    S.animais.forEach(a=>{const lid=loteDoAnimalEm(a,h.data);if(!lid)return;const l=byId(S.lotes,lid);if(l&&l.areaId===ar)pres.push({a,lid,w:pesoEm(a,h.data,P.get(a.id))||1})});
    if(pres.length){
      const tw=sum(pres,x=>x.w);
      pres.forEach(x=>{const f=x.w/tw,r=pa(x.a.id,x.lid);r.kg+=num(h.kg)*f;r.valor+=num(h.valor)*f;r.dias.add(h.data);const L=nl(x.lid);L.kg+=num(h.kg)*f;L.valor+=num(h.valor)*f});
    }else{
      const c=S.lotes.filter(l=>l.areaId===ar&&(!l.inicio||l.inicio<=h.data)).sort((a,b)=>(a.inicio||'')<(b.inicio||'')?1:-1)[0]||S.lotes.filter(l=>l.areaId===ar).sort((a,b)=>(a.inicio||'')<(b.inicio||'')?-1:1)[0];
      if(c){const L=nl(c.id);L.semKg+=num(h.kg);L.semValor+=num(h.valor)}
    }
  });
  return {porA,porL,P};
}
/* dias corridos em que o animal esteve no lote dentro do período (o custo dilui ao longo desses dias) */
function diasNoLote(a,loteId,de,ate){
  const l=byId(S.lotes,loteId),ini=de||(l&&l.inicio)||'',fim=ate||hoje(),iv=[];
  if(a.mov&&a.mov.length){a.mov.forEach((m,i)=>{if(m.loteId===loteId){const nx=a.mov[i+1];iv.push([m.d,nx?addDias(nx.d,-1):fim])}})}
  else if(a.loteId===loteId)iv.push([iniEfetivo(a,l)||ini,fim]);
  let n=0;
  iv.forEach(([s,e])=>{const s2=ini&&ini>s?ini:s,e2=e<fim?e:fim;if(s2&&e2>=s2)n+=diffDias(s2,e2)+1});
  return n;
}
function custoLinhas(loteId,de,ate){
  const R=calcCustos(de,ate),dRef=ate||hoje();
  const linhas=[],lt=byId(S.lotes,loteId),opDia=num(S.cfg.opDia);
  S.animais.forEach(a=>{
    const r=R.porA.get(a.id+'|'+loteId);
    if(!r&&a.loteId!==loteId)return;
    if(ate&&a.entrada&&a.entrada>ate&&!r)return;
    const kg=r?r.kg:0,valor=r?r.valor:0,dias=diasNoLote(a,loteId,de,ate);
    const p0=num(a.pesoIn),pf=pesoEm(a,dRef,R.P.get(a.id)),pts=R.P.get(a.id),pesado=(a.pes||[]).length>0;
    const ganho=pf-p0,dv=a.entrada?diffDias(a.entrada,dRef):0;
    const ini=[de||'',lt?entradaNoLote(a,lt):''].sort().pop(),gP=(ini&&dRef>ini)?pesoEm(a,dRef,pts)-pesoEm(a,ini,pts):0,op=opDia*dias;
    linhas.push({gP,op,tot:valor+op,perKgP:gP>0?(valor+op)/gP:0,a,kg,valor,dias,p0,pf,pesado,ganho,gmd:dv>0&&pesado?ganho/dv:0,perDia:dias?valor/dias:0,perKgGanho:ganho>0?valor/ganho:0,aq:num(a.valor)});
  });
  linhas.sort((x,y)=>ordNum(x.a,y.a));
  return {linhas,L:R.porL.get(loteId)||{kg:0,valor:0,semKg:0,semValor:0}};
}

VIEWS.custos=()=>{
  const h=head('Custos do lote','Ração rateada pelo peso de cada animal','<button class="btn sm sec" data-act="cuXls">Baixar Excel</button>');

  const l=byId(S.lotes,fCu.lote),{linhas,L}=custoLinhas(l.id,fCu.de,fCu.ate);
  const chips='<div class="chips">'+S.lotes.map(x=>'<button class="chip '+(x.id===l.id?'on':'')+'" data-act="cuLote" data-id="'+x.id+'">'+esc(x.nome)+'</button>').join('')+'</div>';

  const n=linhas.length,racaoV=L.valor+L.semValor,racaoKg=L.kg+L.semKg,aq=sum(linhas,x=>x.aq);
  const dias=sum(linhas,x=>x.dias),opV=sum(linhas,x=>x.op),prodV=racaoV+opV;
  const pm=n?sum(linhas,x=>x.pf)/n:0;
  const rend=num(S.cfg.rend)||52,gan=sum(linhas,x=>x.gP),arr=gan*rend/100/15,semPes=linhas.filter(x=>!x.pesado).length;
  const perOp='<div class="cfgrow">'+fld('cu-op','Custo operacional (R$/cab·dia)',S.cfg.opDia?String(S.cfg.opDia).replace('.',','):'')+fld('cu-rend','Rendimento de carcaça (%)',String(rend).replace('.',','))+'</div><p class="note" style="margin:0 0 4px">O custo operacional é o mesmo para todos os animais, por dia no lote (combustível, trator, manutenção, mão de obra…). Rendimento só serve para converter o ganho em @ produzidas.</p>';
  const kvs='<div class="kv">'+kv('Nutrição (R$)',brl(racaoV))+kv('Operacional (R$)',brl(opV))+kv('Produção (R$)',brl(prodV))+'</div>'
   +'<div class="kv">'+kv('Nutrição R$/cab',n?brl(racaoV/n):'—')+kv('Operac. R$/cab',n?brl(opV/n):'—')+kv('Total R$/cab',n?brl(prodV/n):'—')+'</div>'
   +'<div class="kv">'+kv('Ração (kg)',fmt(racaoKg))+kv('kg/cab·dia',dias?fmt(sum(linhas,x=>x.kg)/dias,2):'—')+kv('Animais',fmt(n))+'</div>'
   +'<div class="kv">'+kv('Peso médio atual',n?fmt(pm,1)+' kg':'—')+kv('Aquisição',brl(aq))+kv('Custo total',brl(aq+prodV))+'</div>';
  const perf='<div class="card"><h3>Desempenho no período</h3><div class="kv">'+kv('Ganho total',fmt(gan,1)+' kg')+kv('GMD médio',dias?fmt(gan/dias,3)+' kg':'—')+kv('Conversão',gan>0?fmt(racaoKg/gan,2)+' kg ração/kg':'—')+'</div>'
   +'<div class="kv">'+kv('Nutrição R$/kg ganho',gan>0?brl(racaoV/gan):'—')+kv('Produção R$/kg ganho',gan>0?brl(prodV/gan):'—')+kv('@ produzidas',gan>0?fmt(arr,1):'—')+'</div>'
   +'<div class="kv" style="grid-template-columns:1fr"><div><small>Custo por @ produzida (nutrição + operacional)</small><b>'+(arr>0?brl(prodV/arr):'—')+'</b></div></div>'
   +'<p class="note">Ganho = peso no fim do período − peso no início (ou na entrada no lote), de cada animal.'+(semPes?' <b>'+semPes+' animal(is) sem pesagem</b> usam peso estimado pelo GMD do lote.':'')+' @ produzidas = ganho × rendimento ÷ 15.</p></div>';
  const rows=linhas.map(x=>'<tr><td><b>'+esc(x.a.brinco)+'</b><br><span class="mut">'+esc(x.a.cat||catSugerida(x.a.sexo,idadeMeses(x.a.nasc))||'')+'</span></td><td>'+x.dias+'</td><td>'+fmt(x.pf,1)+(x.pesado?'':'<span class="mut" title="estimado">*</span>')+'</td><td>'+fmt(x.gP,1)+'</td><td>'+fmt(x.kg,1)+'</td><td>'+brl(x.valor)+'</td><td>'+brl(x.op)+'</td><td>'+(x.perKgP?fmt(x.perKgP,2):'—')+'</td></tr>').join('');
  return h+chips+'<div class="card">'+per+perOp+retro+kvs+(L.semValor?'<p class="note">Inclui '+brl(L.semValor)+' de trato dado ao lote em dias sem animais vinculados.</p>':'')+'</div>'+perf
   +'<div class="card"><div class="scroll"><table><tr><th>Brinco</th><th>Dias</th><th>Peso kg</th><th>Ganho kg</th><th>Ração kg</th><th>Nutrição R$</th><th>Operac. R$</th><th>R$/kg ganho</th></tr>'+(rows||'<tr><td colspan="8" class="mut">Nenhum animal neste lote.</td></tr>')+'</table></div>'
   +'<p class="note"><b>R$/cab·dia</b> = custo ÷ dias corridos no lote. Como o trato é dado em caixas, esse valor <b>vai diluindo a cada dia</b> até o próximo fornecimento e sobe quando um novo trato é lançado.</p><p class="note"><b>Como é rateado:</b> cada trato do pasto é dividido entre os animais que estavam no lote naquele dia, <b>proporcional ao peso do dia</b> (um animal de 500 kg recebe mais custo que um de 450 kg). O peso vem das pesagens (interpolado entre elas); depois da última pesagem, usa o GMD do lote. * = peso estimado, sem pesagem.</p></div>';
};
function cuExport(){
  const l=byId(S.lotes,fCu.lote);if(!l)return;

  A.push([],['TOTAL','','','','','','','','','',r2(sum(linhas,x=>x.kg)),r2(sum(linhas,x=>x.valor)),'','',r2(sum(linhas,x=>x.aq)),r2(sum(linhas,x=>x.aq+x.tot)),r2(sum(linhas,x=>x.gP)),r2(sum(linhas,x=>x.op)),r2(sum(linhas,x=>x.tot))]);

}

VIEWS.prodAcab=()=>{
  const P=prods();

  if(!P.length)return h+'<div class="card empty">Cadastre o primeiro produto (ex.: Feno de Tifton, Silagem de milho). Depois registre a entrada (compra ou produção) e leve para o lote: o custo entra na conta do lote.</div>';
  const R=P.map(i=>{const c=compraCalc(i.id);return {i,c,saiu:c.usado,val:Math.max(0,c.estoque)*c.valorKg}}).sort((a,b)=>a.i.nome.localeCompare(b.i.nome,'pt-BR'));
  const tot=sum(R,r=>r.val);

/* ===== Manejo (pesagem e mudança de lote) — lançamento animal a animal, formulário aberto ===== */
let MJ={data:'',items:[],sel:null};
function mjRef(a,d){const p=pontosPeso(a).filter(x=>x.d<d);return p.length?p[p.length-1]:null}
function mjGmd(a,kg,d){
  const ref=mjRef(a,d);if(!ref||!d)return {t:'sem pesagem anterior'};
  const dias=diffDias(ref.d,d);if(dias<=0)return {t:'data igual ou anterior à última pesagem'};
  const g=(kg-ref.kg)/dias;return {g,t:'GMD '+fmt(g,3)+' kg/dia · '+(kg>=ref.kg?'+':'')+fmt(kg-ref.kg,1)+' kg em '+dias+' d'};
}
function mManejo(){
  if(!MJ.data)MJ.data=hoje();

   +'<div id="mj-card" class="card" style="margin:6px 0;display:none"></div>'

   +'<button type="button" class="btn block" style="margin-top:10px;background:#1f6b3a" data-act="mjFim">Finalizar manejo</button>'

function mjAnimal(){return MJ.sel?byId(S.animais,MJ.sel):null}
function mjSug(){

function mjPick(id,keep){
  const a=typeof id==='string'?byId(S.animais,id):null;if(!a)return;

    return '<div class="row"><div class="g"><b>'+esc(a.brinco)+'</b><span>'+(it.kg?fmt(it.kg,1)+' kg':'sem pesagem')+(g&&g.g!==undefined?' · GMD '+fmt(g.g,3):'')+(pl?' · → '+esc(pl):'')+'</span></div><div class="r" style="display:flex;gap:6px"><button type="button" class="btn sm sec" data-act="mjEdit" data-id="'+a.id+'">Editar</button><button type="button" class="rm" data-act="mjRm" data-id="'+a.id+'" aria-label="Remover">×</button></div></div>'}).join(''):'<p class="note">Nenhum animal lançado ainda.</p>';

function mjAdd(){
  const a=mjAnimal();if(!a)return toast('Digite o número do animal e escolha na lista');

  if(raw&&!(kg>=30&&kg<=1500))return toast('Peso fora de 30–1500 kg');
  if(!raw&&!para)return toast('Digite o peso ou escolha o lote de destino');
  if(para&&para!=='none'&&para===a.loteId)return toast('Esse é o lote atual do animal');
  const it={id:a.id,kg:raw?r2(kg):0,para};

  MJ.sel=null;$('#mj-b').value='';$('#mj-k').value='';$('#mj-p').value='';$('#mj-g').textContent='';$('#mj-card').style.display='none';$('#mj-add').textContent='Adicionar pesagem';

function mjDraft(){try{localStorage.setItem('tip_mj_'+(S.cfg&&S.cfg.nome||''),JSON.stringify(MJ))}catch(e){}}
function mjFim(){
  const d=$('#mj-d').value||MJ.data;
  if(!d)return toast('Informe a data da pesagem');if(d>hoje())return toast('Data não pode ser no futuro');

  let np=0,nm=0;
  MJ.items.forEach(it=>{const a=byId(S.animais,it.id);if(!a)return;
    if(it.kg){a.pes=(a.pes||[]).filter(p=>p.d!==d);a.pes.push({d,kg:it.kg});a.pes.sort((x,y)=>x.d<y.d?-1:1);np++}
    if(it.para&&moverAnimal(a,it.para==='none'?'':it.para,d,true))nm++});
  MJ={data:'',items:[],sel:null};try{localStorage.removeItem('tip_mj_'+(S.cfg&&S.cfg.nome||''))}catch(e){}
  save();closeModal();render(false);
  toast((np?np+' pesagem(ns)':'')+(np&&nm?' e ':'')+(nm?nm+' mudança(s) de lote':'')+' salva(s)');
}

/* ===== Histórico de pesagens do animal, com fase (Recria / Engorda) ===== */
function periodosAnimal(a){
  const per=[];
  if(a.mov&&a.mov.length){a.mov.forEach((m,i)=>{per.push({loteId:m.loteId,de:m.d,ate:a.mov[i+1]?a.mov[i+1].d:''})})}
  else if(a.loteId){const l=byId(S.lotes,a.loteId);per.push({loteId:a.loteId,de:l?entradaNoLote(a,l):(a.entrada||''),ate:''})}
  return per;
}
function faseEm(a,d){const l=byId(S.lotes,loteDoAnimalEm(a,d));return l?l.sis||'':''}
function histPesoAnimal(a){
  const P=pontosPeso(a);if(!P.length)return '';
  const badge=f=>f?'<span class="b '+(f==='Engorda'?'warn':'ok')+'">'+esc(f)+'</span>':'<span class="mut">—</span>';
  let prev=null;
  const rows=P.map(x=>{
    const g=prev&&diffDias(prev.d,x.d)>0?(x.kg-prev.kg)/diffDias(prev.d,x.d):null,l=byId(S.lotes,loteDoAnimalEm(a,x.d));
    const r='<tr><td>'+fmtData(x.d)+(x.d===a.entrada&&num(x.kg)===num(a.pesoIn)?'<br><span class="mut" style="font-size:12px">entrada</span>':'')+'</td><td><b>'+fmt(x.kg,1)+'</b></td><td>'+(g==null?'—':fmt(g,3))+'</td><td>'+badge(l&&l.sis)+(l?'<br><span class="mut" style="font-size:12px">'+esc(l.nome)+'</span>':'')+'</td><td>'+((a.pes||[]).some(q=>q.d===x.d&&num(q.kg)===num(x.kg))?'<button type="button" class="btn sm sec" data-act="pesEd" data-id="'+a.id+'" data-d="'+x.d+'">Corrigir</button>':'')+'</td></tr>';
    prev=x;return r}).join('');
  const hoje_=hoje(),res=[];
  periodosAnimal(a).forEach(p=>{
    const l=byId(S.lotes,p.loteId);if(!l||!p.de)return;
    const lim=p.ate||hoje_,pts=P.filter(x=>x.d<=lim),fim=p.ate||(pts.length?pts[pts.length-1].d:hoje_),w0=pesoEm(a,p.de,P),w1=p.ate?pesoEm(a,p.ate,P):(pts.length?pts[pts.length-1].kg:0);
    const di=Math.max(0,diffDias(p.de,fim));
    res.push('<div class="row"><div class="g"><b>'+esc(l.sis||'Lote')+'</b> <span class="mut">· '+esc(l.nome)+'</span><span>'+fmtData(p.de)+' → '+(p.ate?fmtData(p.ate):fmtData(fim)+' (última pesagem)')+' ('+di+' d)</span></div><div class="r"><b>'+fmt(w0,1)+' → '+fmt(w1,1)+' kg</b><span class="mut" style="font-size:12px">'+(di>0?(w1>=w0?'+':'')+fmt(w1-w0,1)+' kg · GMD '+fmt((w1-w0)/di,3):'')+'</span></div></div>')});
  return '<div class="card" style="margin-top:10px"><h3>Histórico de pesagens</h3>'+(res.length?'<p class="note" style="margin:4px 0">Peso por fase (entrada → saída de cada lote):</p><div class="contas">'+res.join('')+'</div>':'')
   +'<div class="scroll" style="margin-top:8px"><table><tr><th>Data</th><th>Peso kg</th><th>GMD</th><th>Fase</th><th></th></tr>'+rows+'</table></div></div>';
}


/* ===== Ficha resumida do animal (lista de animais e modal) ===== */
function fichasAnimais(lista){
  const R=calcCustos('',''),nut=new Map();
  R.porA.forEach(r=>nut.set(r.aid,(nut.get(r.aid)||0)+r.valor));
  const out=new Map();
  lista.forEach(a=>{
    const P=R.P.get(a.id)||pontosPeso(a),reais=(a.pes||[]).filter(p=>p.d&&num(p.kg)>0).sort((x,y)=>x.d<y.d?-1:1);
    const p1=num(a.pesoIn),ult=reais.length?reais[reais.length-1]:null;
    let gUlt=null,gGlob=null;
    if(ult){
      const ant=P.filter(x=>x.d<ult.d).pop();
      if(ant&&diffDias(ant.d,ult.d)>0)gUlt=(num(ult.kg)-ant.kg)/diffDias(ant.d,ult.d);
      if(a.entrada&&p1>0&&diffDias(a.entrada,ult.d)>0)gGlob=(num(ult.kg)-p1)/diffDias(a.entrada,ult.d);
    }
    const hj=hoje(),atual=P.length?pesoEm(a,hj,P):0,est=!(ult&&ult.d===hj);
    out.set(a.id,{compra:a.entrada||'',p1,valor:num(a.valor),nutri:nut.get(a.id)||0,gUlt,gGlob,atual,est,ult,diverge:false});
  });
  /* alerta: última pesagem em data diferente da maioria do lote */
  const por={};
  out.forEach((f,id)=>{const a=byId(S.animais,id);if(f.ult&&a&&a.loteId){(por[a.loteId]=por[a.loteId]||{})[f.ult.d]=(por[a.loteId][f.ult.d]||0)+1}});
  out.forEach((f,id)=>{const a=byId(S.animais,id);if(!f.ult||!a||!a.loteId)return;const m=por[a.loteId];
    let best='',bc=0;Object.keys(m).forEach(d=>{if(m[d]>bc||(m[d]===bc&&d>best)){best=d;bc=m[d]}});
    if(Object.keys(m).length>1&&f.ult.d!==best)f.diverge=true});
  return out;
}
const fG=g=>g==null?'—':fmt(g,3);
function resumoAnimal(a){
  const f=fichasAnimais([a]).get(a.id);
  return '<div class="card" style="margin:8px 0"><h3>Resumo</h3><div class="kv">'+kv('Data de compra',f.compra?fmtData(f.compra):'—')+kv('1º peso',f.p1?fmt(f.p1,1)+' kg':'—')+kv('Valor pago',brl(f.valor))+'</div>'
   +'<div class="kv">'+kv('Nutrição até agora',brl(f.nutri))+kv('Custo total',brl(f.valor+f.nutri))+kv('Peso atual'+(f.est?' (proj.)':''),f.atual?fmt(f.atual,1)+' kg':'—')+'</div>'
   +'<div class="kv">'+kv('Último GMD',fG(f.gUlt))+kv('GMD global',fG(f.gGlob))+kv('Última pesagem',f.ult?fmtData(f.ult.d)+' · '+fmt(f.ult.kg,1)+' kg':'—')+'</div>'+(f.diverge?'<p class="note" style="color:var(--amber)">⚠ A última pesagem deste animal tem data diferente da maioria do lote. Confira na tabela abaixo e corrija se foi lançado com a data errada.</p>':'')

/* ================= Firebase: login, liberação de acesso e sincronização ================= */
const canon=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.fromEntries(Object.entries(v).sort(([a],[b])=>a<b?-1:a>b?1:0)):v);
const clean=o=>JSON.parse(JSON.stringify(o));
// cada usuário grava somente em u/{uid}/...
const base=()=>'u/'+FB.user.uid+'/';
function novoS(){
  const dm=!isSuper()&&FB.user&&DEMO_EMAILS[(FB.user.email||'').toLowerCase()];
  if(dm)return demoFazenda(dm);
  if(isSuper())return seed();
  const e=emptyState();e.cfg.fazenda=(CONTA&&CONTA.fazenda)||'Minha fazenda';return e;

function docsOf(){
  const m=new Map();
  m.set('cfg/main',S.cfg);
  COLS.forEach(c=>S[c].forEach(o=>{if(!o.id)o.id=uid();m.set(c+'/'+o.id,o)}));
  return m;
}
function flush(){
  if(!FB.on||!FB.ready||!S||!DB||!FB.user)return;
  const want=docsOf(),b=base();
  want.forEach((o,p)=>{
    const j=canon(o);
    if(SYNC.last.get(p)!==j){SYNC.last.set(p,j);FS.setDoc(FS.doc(DB,b+p),clean(o)).catch(e=>toast(msgFS(e)))}
  });
  [...SYNC.last.keys()].forEach(p=>{
    if(!want.has(p)){SYNC.last.delete(p);FS.deleteDoc(FS.doc(DB,b+p)).catch(e=>toast(msgFS(e)))}
  });
}
function rebuild(){
  const c=SYNC.remote.cfg.get('main'),e=emptyState(),vals=n=>[...SYNC.remote[n].values()];
  const cfg=c&&c.ver===3?c:e.cfg;
  cfg.listas=Object.assign({},LISTAS0,cfg.listas||{});
  S={v:3,cfg,areas:vals('areas').sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR',{numeric:true})),lotes:vals('lotes'),animais:vals('animais'),insumos:vals('insumos').sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR')),
     compras:vals('compras'),formulas:vals('formulas').sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR')),batidas:vals('batidas'),forn:vals('forn')};
}
function goReady(seeded){
  clearTimeout(SYNC.timer);FB.ready=true;
  if(seeded){SYNC.seeded=true;flush()}else rebuild();
  render(true);
}
const temV3=()=>{const c=SYNC.remote.cfg.get('main');return !!(c&&c.ver===3)};
const needSeed=()=>SYNC.serverCfg&&!SYNC.seeded&&!temV3()&&!SYNC.remote.areas.size&&!SYNC.remote.lotes.size;
function tryReady(){
  if(SYNC.got.size<COLS.length+1)return;
  if(temV3())return goReady(false);
  if(needSeed()){S=novoS();goReady(true)}
}
function onSnap(name,snap){
  const m=SYNC.remote[name];m.clear();
  [...SYNC.last.keys()].forEach(k=>{if(k.startsWith(name+'/'))SYNC.last.delete(k)});
  snap.forEach(d=>{const o=d.data();m.set(d.id,o);SYNC.last.set(name+'/'+d.id,canon(o))});
  if(name==='cfg'&&!snap.metadata.fromCache)SYNC.serverCfg=true;
  SYNC.got.add(name);
  if(!FB.ready)tryReady();
  else if(needSeed()){S=novoS();SYNC.seeded=true;flush();render(true)}
  else{rebuild();if(!$('#modal')||$('#modal').classList.contains('hidden'))render(false)}
}
function startSync(){
  stopSync();
  SYNC.remote={cfg:new Map()};COLS.forEach(c=>SYNC.remote[c]=new Map());
  SYNC.got=new Set();SYNC.serverCfg=false;SYNC.seeded=false;
  S=emptyState();
  $('#view').innerHTML='<div class="empty">Carregando seus dados…</div>';
  const b=base();
  ['cfg'].concat(COLS).forEach(n=>{
    SYNC.unsubs.push(FS.onSnapshot(FS.collection(DB,b+n),snap=>onSnap(n,snap),e=>toast(msgFS(e))));
  });
  SYNC.timer=setTimeout(()=>{if(!FB.ready)$('#view').innerHTML='<div class="empty">Conectando ao servidor… se demorar, confira a internet. Seus dados aparecem assim que a conexão voltar.</div>'},6000);
}
function stopSync(){
  SYNC.unsubs.forEach(u=>{try{u()}catch(e){}});SYNC.unsubs=[];clearTimeout(SYNC.timer);SYNC.last.clear();FB.ready=false;
}

  $('#tab-in').classList.toggle('on',!reg);$('#tab-reg').classList.toggle('on',reg);
  $('#lg-sub').textContent=reg?'Cadastre sua fazenda. O acesso é liberado após aprovação.':'Gestão de trato e confinamento';
  $('#lg-s').autocomplete=reg?'new-password':'current-password';
  $('#lg-err').textContent='';
}
async function authDo(kind){
  const e=$('#lg-e').value.trim(),pw=$('#lg-s').value,er=$('#lg-err');er.textContent='';
  if(!AUTH){er.textContent='O Firebase não carregou. Verifique a conexão.';return}
  if(!e)return void(er.textContent='Informe o e-mail — é com ele que você entra.');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e))return void(er.textContent='E-mail inválido.');
  if(pw.length<6)return void(er.textContent='A senha precisa ter pelo menos 6 caracteres.');
  const reg=kind==='reg',fz=$('#lg-fz').value.trim(),nm=$('#lg-nm').value.trim(),wa=$('#lg-wa').value.trim();
  if(reg&&!fz){er.textContent='Informe o nome da fazenda.';return}
  if(reg&&!nm){er.textContent='Informe o seu nome.';return}
  const btn=$('#lg-go');btn.disabled=true;
  try{
    if(!reg)await AUTH.signIn(e,pw);
    else{
      SIGNUP=true;
      const cred=await AUTH.create(e,pw);
      await FS.setDoc(FS.doc(DB,'contas/'+cred.user.uid),{email:e.toLowerCase(),fazenda:fz,nome:nm,whats:wa,status:'pendente',criadoEm:new Date().toISOString()});
      SIGNUP=false;
    }
  }catch(x){SIGNUP=false;er.textContent=x&&x.code&&x.code.startsWith('auth/')?msgAuth(x):msgFS(x)}
  btn.disabled=false;
}
async function contaCreate(){
  const fz=$('#ct-fz').value.trim(),nm=$('#ct-nm').value.trim();if(!fz)return toast('Informe o nome da fazenda');if(!nm)return toast('Informe o seu nome');
  try{await FS.setDoc(FS.doc(DB,'contas/'+FB.user.uid),{email:(FB.user.email||'').toLowerCase(),fazenda:fz,nome:$('#ct-nm').value.trim(),whats:$('#ct-wa').value.trim(),status:'pendente',criadoEm:new Date().toISOString()})}catch(e){toast(msgFS(e))}
}
function clearUI(){S=null;BT=null;FD=null;closeModal();$('#view').innerHTML='';$('#top').innerHTML='';$('#tabs').innerHTML='';$('#side').innerHTML=''}
function showGate(c){
  const box=$('#gate-box');
  const ic=n=>'<div class="gate-ic">'+n+'</div>';
  const out='<button type="button" class="btn line block" style="margin-top:14px" data-act="logout">Sair</button>';
  let h;
  if(!c&&SIGNUP)h=ic('⏳')+'<h1>Enviando cadastro…</h1>';
  else if(!c)h='<h1>Complete seu cadastro</h1><p class="sub">Conta: <b>'+esc(FB.user.email||'')+'</b><br>Informe sua fazenda para pedir o acesso.</p><form data-form="conta"><label for="ct-fz">Nome da fazenda (obrigatório)</label><input id="ct-fz" type="text"><label for="ct-nm">Seu nome (obrigatório)</label><input id="ct-nm" type="text"><label for="ct-wa">WhatsApp (opcional)</label><input id="ct-wa" type="tel"><button class="btn block" style="margin-top:14px">Enviar cadastro</button></form><button type="button" class="btn line block" style="margin-top:10px" data-act="logout">Entrar com outra conta</button>';
  else if(c.status==='bloqueado')h=ic('⛔')+'<h1>Acesso bloqueado</h1><p class="sub">O acesso desta conta está suspenso. Fale com o administrador.</p>'+out;
  else h=ic('⏳')+'<h1>Cadastro recebido</h1><p class="sub"><b>'+esc(c.fazenda||'')+'</b><br>'+esc(c.email||'')+'</p><p class="sub" style="margin-top:12px">Aguarde a liberação do administrador. Esta tela muda sozinha quando o acesso for aprovado.</p>'+out;
  box.innerHTML=h;$('#gate').classList.remove('hidden');
}
const hideGate=()=>$('#gate').classList.add('hidden');
function startAdmin(){
  stopAdmin();
  ADM.unsub=FS.onSnapshot(FS.collection(DB,'contas'),snap=>{
    ADM.contas=[];snap.forEach(d=>ADM.contas.push(Object.assign({id:d.id},d.data())));
    if(S&&isSuper())render(false)
  },e=>toast(msgFS(e)));
}
function stopAdmin(){if(ADM.unsub){try{ADM.unsub()}catch(e){}ADM.unsub=null}ADM.contas=[]}
function setIcons(){
  document.querySelectorAll('img[data-ic]').forEach(i=>i.src=ICON192);
  document.querySelectorAll('img[data-wide]').forEach(i=>i.src=LOGOWIDE);
  $('#lk-icon').href=ICON192;$('#lk-apple').href=ICON192;
  try{
    const man={name:'TIP Control',short_name:'TIP Control',start_url:location.origin+'/',scope:location.origin+'/',display:'standalone',orientation:'portrait',background_color:'#14301f',theme_color:'#14301f',lang:'pt-BR',
      icons:[{src:ICON192,sizes:'192x192',type:'image/png',purpose:'any'},{src:ICON512,sizes:'512x512',type:'image/png',purpose:'any'}]};
    const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}));document.head.appendChild(l);
  }catch(e){}
}
async function boot(){
  setIcons();
  let mods=null;
  try{mods=await Promise.all(['app','auth','firestore'].map(n=>import('https://www.gstatic.com/firebasejs/'+FBV+'/firebase-'+n+'.js')))}catch(e){mods=null}
  if(!mods){FB.on=false;load();render(true);toast('Modo local: o Firebase não carregou');return}
  const [A,Au,F]=mods;
  const app=A.initializeApp(FIREBASE_CONFIG);
  const auth=Au.getAuth(app);
  try{DB=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()}),experimentalAutoDetectLongPolling:true})}catch(e){DB=F.getFirestore(app)}
  FS=F;
  AUTH={signIn:(e,p)=>Au.signInWithEmailAndPassword(auth,e,p),create:(e,p)=>Au.createUserWithEmailAndPassword(auth,e,p),out:()=>Au.signOut(auth)};
  FB.on=true;
  Au.onAuthStateChanged(auth,user=>{
    FB.user=user;
    stopSync();stopAdmin();if(CONTA_UNSUB){try{CONTA_UNSUB()}catch(e){}CONTA_UNSUB=null}CONTA=null;
    if(!user){
      clearUI();hideGate();setLoginMode('in');
      $('#lg-s').value='';$('#lg-err').textContent='';$('#login').classList.remove('hidden');
      return;
    }
    $('#login').classList.add('hidden');
    if(isSuper()){hideGate();S=emptyState();S.cfg.fazenda='Administração';FB.ready=true;startAdmin();render(true);return}
    CONTA_UNSUB=FS.onSnapshot(FS.doc(DB,'contas/'+user.uid),snap=>{
      const c=snap.exists()?snap.data():null;CONTA=c;
      if(c&&c.status==='liberado'){
        hideGate();
        if(!SYNC.unsubs.length)startSync();
      }else{
        if(SYNC.unsubs.length||S){stopSync();clearUI()}
        showGate(c);
      }
    },e=>{toast(msgFS(e));showGate(null)});
  });
}
boot();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{}));
  let hadCtl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadCtl&&!window.__rl){window.__rl=1;location.reload()}hadCtl=true});
}
})();

</script>
