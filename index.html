<style>
:root{--teal:#0b4f57;--teal2:#0e6670;--green:#1e8e3e;--green-bg:#e3f6e8;--red:#e5534b;--red-bg:#fdeceb;--blue-bg:#e6f0fb;--bg:#f2f6f6;--card:#fff;--txt:#14262b;--mut:#6b7c80;--line:#dbe4e5;--fz:#8a5a00;--fz-bg:#fff1cf;--ps:#3b4ea8;--ps-bg:#e8ecff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--txt);width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--teal2);box-shadow:0 0 0 3px rgba(14,102,112,.15)}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px;color:var(--txt)}
[hidden]{display:none!important}
/* auth */
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,var(--teal),var(--teal2))}
.authcard{background:#fff;border-radius:20px;padding:26px 22px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.authcard h1{margin:0 0 2px;color:var(--teal);font-size:26px;text-align:center}
.authcard p.sub{margin:0 0 14px;text-align:center;color:var(--mut);font-size:14px}
.link{background:none;border:0;color:var(--teal2);font-weight:600;padding:8px;width:100%;font-size:14px}
.err{color:var(--red);font-size:13px;margin-top:8px;min-height:16px;text-align:center}
/* app */
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:90px}
header{background:var(--teal);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 16px;border-radius:0 0 22px 22px}
header h2{margin:0 0 10px;font-size:26px}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.inst{flex:none;background:#fff;color:var(--teal);border:0;border-radius:20px;padding:7px 13px;font-weight:700;font-size:13px;margin-top:2px}
.seg{display:flex;background:rgba(255,255,255,.15);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;color:#fff;padding:8px 4px;border-radius:9px;font-weight:600;font-size:14px}
.seg button.on{background:#fff;color:var(--teal)}
.wrap{padding:12px 14px}
.monthbar{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px}
.monthbar .nav{width:42px;height:42px;border:0;background:var(--bg);border-radius:10px;font-size:20px;color:var(--teal)}
.monthbar .mid{flex:1;position:relative;text-align:center;font-weight:700;font-size:17px}
.monthbar .mid input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.big{border-radius:16px;padding:16px;color:#fff;margin:12px 0}
.big.red{background:linear-gradient(135deg,#ee6d65,#d94840)}
.big.green{background:linear-gradient(135deg,#27a14b,#177a33)}
.big small{display:block;font-size:14px;font-weight:600;opacity:.95}
.big b{display:block;font-size:34px;line-height:1.15;margin-top:2px}
.big .ln{font-size:13px;margin-top:6px;opacity:.95}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.card h3{margin:0 0 4px;color:var(--teal);font-size:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-p{background:var(--teal);color:#fff;border:0;border-radius:12px;padding:13px;font-weight:700;width:100%;margin-top:14px;font-size:16px}
.btn-p.g{background:var(--green)}
.btn-o{background:#fff;color:var(--teal);border:1.5px solid var(--teal2);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px}
.btn-o.g{color:var(--green);border-color:var(--green)}
.btn-d{background:var(--red-bg);color:var(--red);border:0;border-radius:10px;padding:10px 12px;font-weight:700}
.ico{background:var(--bg);border:0;border-radius:10px;width:36px;height:36px;font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--mut)}
.chips button.on{background:var(--teal);border-color:var(--teal);color:#fff}
.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}
.item .r1{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.item .r1 .v{white-space:nowrap}
.chk{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:#fff;color:transparent;font-weight:800;font-size:16px;line-height:1;padding:0}
.chk.on{background:var(--green);border-color:var(--green);color:#fff}
.item .sub{font-size:13px;color:var(--mut);margin-top:2px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--bg);color:var(--mut)}
.tag.fazenda{background:var(--fz-bg);color:var(--fz)}
.tag.pessoal{background:var(--ps-bg);color:var(--ps)}
.r3{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.acts{display:flex;gap:6px;align-items:center}
.badge{font-size:13px;font-weight:700;padding:5px 12px;border-radius:20px}
.badge.pend{background:var(--red-bg);color:var(--red)}
.badge.venc{background:var(--red);color:#fff}
.badge.pago{background:var(--green-bg);color:var(--green)}
.badge.prev{background:var(--green-bg);color:var(--green)}
.badge.atr{background:#ffe3b8;color:#9a5a00}
.warn{background:#fff4dc;border:1px solid #f1d59a;color:#7a5200;border-radius:12px;padding:10px 12px;margin:10px 0;font-weight:600;font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.bal{border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.bal b{font-size:21px}
.bal.b1{background:var(--blue-bg)}.bal.b2{background:var(--green-bg)}.bal.b3{background:var(--red-bg)}
.final{background:linear-gradient(135deg,#27a14b,#177a33);color:#fff;border-radius:16px;padding:16px;margin:12px 0}
.final small{font-weight:600;font-size:15px}.final b{display:block;font-size:34px}
.mov{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-weight:600}
.mov:last-child{border:0}
.pos{color:var(--green)}.neg{color:var(--red)}
.bar{margin:9px 0}.bar .t{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.bar .b{height:9px;background:var(--bg);border-radius:6px;margin-top:4px;overflow:hidden}
.bar .b i{display:block;height:100%;background:var(--teal2);border-radius:6px}
.empty{text-align:center;color:var(--mut);padding:26px 10px;font-size:14px}
.hint{font-size:12.5px;color:var(--mut);margin-top:6px}
nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);gap:6px;z-index:10}
nav button{flex:1;border:0;background:transparent;border-radius:12px;padding:7px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mut);font-size:12.5px;font-weight:600}
nav button.on{background:#d9f0ef;color:var(--teal)}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#modal{position:fixed;inset:0;background:rgba(10,30,35,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);width:100%;max-width:560px;max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 6px;color:var(--teal)}
.mbtns{display:flex;gap:8px;margin-top:14px}.mbtns button{flex:1}
.mbtns .btn-p{margin-top:0}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#14262b;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90%}
.catrow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.foot{text-align:center;color:var(--mut);font-size:12px;margin:22px 0 4px;letter-spacing:1px;font-weight:700}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="auth" hidden>
  <div class="authcard">
    <h1>Controle de Contas</h1>
    <p class="sub">Pagar, receber e acompanhar seu caixa</p>
    <label>E-mail</label><input id="a_email" type="email" autocomplete="email" placeholder="seu@email.com">
    <label>Senha</label><input id="a_senha" type="password" autocomplete="current-password" placeholder="••••••">
    <button class="btn-p" id="a_btn" data-act="login">Entrar</button>
    <button class="link" data-act="authmodo" id="a_modo">Não tem conta? Criar conta</button>
    <button class="link" data-act="reset">Esqueci minha senha</button>
    <div class="err" id="a_err"></div>
  </div>
</div>

<!-- APP -->
<div id="app" hidden>
  <header>
    <div class="hdr"><h2 id="titulo">Contas a pagar</h2><button class="inst" id="btnInstalar" data-act="instalar" hidden>⬇ Instalar app</button></div>
    <div class="seg" id="segEsc">
      <button data-act="escopo" data-v="tudo">Tudo</button>
      <button data-act="escopo" data-v="pessoal">👤 Pessoal</button>
      <button data-act="escopo" data-v="fazenda">🌾 Fazenda</button>
    </div>
  </header>
  <div class="wrap">
    <div class="monthbar" id="monthbar">
      <button class="nav" data-act="mes" data-v="-1">‹</button>
      <div class="mid"><span id="mesLabel"></span><input type="month" id="mesInput"></div>
      <button class="nav" data-act="mes" data-v="1">›</button>
    </div>
    <div id="content"></div>
  </div>
  <nav id="nav"></nav>
</div>

<div id="modal" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script>
/* ============ CONFIG FIREBASE (cole aqui os dados do seu projeto) ============ */
const firebaseConfig = {
  apiKey: "AIzaSyAPGvZhQ9E0DQpVnLx1b2XIGr0f3aUTsLc",
  authDomain: "financas-50b20.firebaseapp.com",
  projectId: "financas-50b20",
  storageBucket: "financas-50b20.firebasestorage.app",
  messagingSenderId: "597396906179",
  appId: "1:597396906179:web:4f42a69aff95942d5bc276"
};
/* ============================================================================ */

const CONFIGURADO = !firebaseConfig.apiKey.startsWith('COLE');
let auth, db, FV;
if (CONFIGURADO) {
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth(); db = firebase.firestore(); FV = firebase.firestore.FieldValue;
  db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = n => (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const pad = n => String(n).padStart(2, '0');
function hoje() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function addMeses(iso, n) {
  const [y, m, d] = iso.split('-').map(Number);
  const t = new Date(y, m - 1 + n, 1);
  const last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
  return t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(Math.min(d, last));
}
const mesAnt = k => addMeses(k + '-01', -1).slice(0, 7);
const mesLabel = k => MESES[Number(k.slice(5, 7)) - 1] + ' ' + k.slice(0, 4);
const fmtData = iso => iso ? iso.split('-').reverse().join('/') : '';
const fmtDM = iso => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) : '';
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
function maskMoney(el) {
  const n = parseInt(el.value.replace(/\D/g, '') || '0', 10);
  el.value = 'R$ ' + (n / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
const parseMoney = v => parseInt(String(v || '').replace(/\D/g, '') || '0', 10) / 100;
const moneyIn = n => 'R$ ' + (Number(n) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
const ICO = {
  pagar: '<svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>',
  receber: '<svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>',
  balanco: '<svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>',
  mais: '<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg>'
};
const TITULOS = { pagar: 'Contas a pagar', receber: 'Contas a receber', balanco: 'Balanço mensal', mais: 'Mais opções' };
const ESC_LABEL = { tudo: 'Pessoal + Fazenda', pessoal: 'Pessoal', fazenda: 'Fazenda' };

/* ---------- categorias ---------- */
const CATS_PADRAO = [
  ...['Insumos','Ração e sal mineral','Medicamentos e veterinário','Mão de obra','Combustível','Manutenção de máquinas','Energia e água','Arrendamento','Frete','Impostos e taxas','Financiamento'].map(n => ({ n, e: 'fazenda', t: 'pagar' })),
  ...['Moradia','Alimentação','Saúde','Educação','Transporte','Lazer','Cartão de crédito','Assinaturas'].map(n => ({ n, e: 'pessoal', t: 'pagar' })),
  { n: 'Outros', e: 'ambos', t: 'pagar' },
  ...['Venda de gado','Venda de grãos','Prestação de serviço','Arrendamento recebido'].map(n => ({ n, e: 'fazenda', t: 'receber' })),
  ...['Salário / Pró-labore','Aluguel','Reembolso'].map(n => ({ n, e: 'pessoal', t: 'receber' })),
  { n: 'Outros', e: 'ambos', t: 'receber' }
];
function catsDe(tipo, escopo) {
  const todas = [...CATS_PADRAO, ...S.custom.map(c => ({ ...c, custom: true }))];
  const nomes = [];
  todas.filter(c => c.t === tipo && (c.e === escopo || c.e === 'ambos')).forEach(c => { if (!nomes.includes(c.n)) nomes.push(c.n); });
  return nomes;
}

/* ---------- estado ---------- */
const S = {
  user: null, tab: 'pagar', mes: hoje().slice(0, 7),
  escopo: localStorage.getItem('escopo') || 'tudo',
  filtro: 'todas', busca: '', contas: [], pendentes: [], saldos: {}, custom: [],
  edit: null, form: { escopo: 'fazenda' }, atrasadas: false
};
let unsubs = [], unsubMes = null;
const base = () => db.collection('users').doc(S.user.uid);
const visivel = c => S.escopo === 'tudo' || c.escopo === S.escopo;
const achar = id => S.contas.find(c => c.id === id) || S.pendentes.find(c => c.id === id);

/* ---------- auth ---------- */
let modoCriar = false;
function msgErro(e) {
  const m = {
    'auth/invalid-email': 'E-mail inválido.', 'auth/user-not-found': 'Usuário não encontrado.',
    'auth/wrong-password': 'Senha incorreta.', 'auth/invalid-credential': 'E-mail ou senha incorretos.',
    'auth/email-already-in-use': 'Este e-mail já tem cadastro.', 'auth/weak-password': 'A senha precisa ter ao menos 6 caracteres.',
    'auth/too-many-requests': 'Muitas tentativas. Aguarde um pouco.', 'auth/network-request-failed': 'Sem conexão com a internet.'
  };
  return m[e.code] || ('Erro: ' + (e.message || e));
}
async function fazerLogin() {
  const email = $('#a_email').value.trim(), senha = $('#a_senha').value;
  $('#a_err').textContent = '';
  if (!email || !senha) { $('#a_err').textContent = 'Preencha e-mail e senha.'; return; }
  try {
    if (modoCriar) await auth.createUserWithEmailAndPassword(email, senha);
    else await auth.signInWithEmailAndPassword(email, senha);
  } catch (e) { $('#a_err').textContent = msgErro(e); }
}
async function resetSenha() {
  const email = $('#a_email').value.trim();
  if (!email) { $('#a_err').textContent = 'Digite seu e-mail e toque em "Esqueci minha senha".'; return; }
  try { await auth.sendPasswordResetEmail(email); $('#a_err').style.color = 'var(--green)'; $('#a_err').textContent = 'Enviamos um link para seu e-mail.'; }
  catch (e) { $('#a_err').style.color = ''; $('#a_err').textContent = msgErro(e); }
}

function iniciarSessao() {
  S.mes = hoje().slice(0, 7);
  unsubs.push(base().collection('saldos').onSnapshot(s => { S.saldos = {}; s.forEach(d => S.saldos[d.id] = d.data()); renderDados(); }));
  unsubs.push(base().collection('config').doc('categorias').onSnapshot(d => { S.custom = (d.exists && d.data().lista) || []; renderDados(); }));
  unsubs.push(base().collection('contas').where('status', '==', 'pendente').onSnapshot(s => { S.pendentes = s.docs.map(d => ({ id: d.id, ...d.data() })); renderDados(); }));
  ouvirMes();
  renderTudo();
}
function ouvirMes() {
  if (unsubMes) unsubMes();
  unsubMes = base().collection('contas').where('mes', '==', S.mes).onSnapshot(
    s => { S.contas = s.docs.map(d => ({ id: d.id, ...d.data() })); renderDados(); },
    e => toast('Erro ao carregar: ' + e.message)
  );
}
function encerrarSessao() { unsubs.forEach(u => u()); unsubs = []; if (unsubMes) unsubMes(); unsubMes = null; S.contas = []; S.pendentes = []; S.saldos = {}; }

/* ---------- render base ---------- */
function renderTudo() {
  $('#titulo').textContent = TITULOS[S.tab];
  document.querySelectorAll('#segEsc button').forEach(b => b.classList.toggle('on', b.dataset.v === S.escopo));
  $('#mesLabel').textContent = mesLabel(S.mes);
  $('#mesInput').value = S.mes;
  $('#monthbar').hidden = S.tab === 'mais';
  $('#nav').innerHTML = ['pagar', 'receber', 'balanco', 'mais'].map(t =>
    `<button data-act="tab" data-v="${t}" class="${S.tab === t ? 'on' : ''}">${ICO[t]}${{ pagar: 'A pagar', receber: 'A receber', balanco: 'Balanço', mais: 'Mais' }[t]}</button>`).join('');
  const c = $('#content');
  if (S.tab === 'pagar' || S.tab === 'receber') {
    c.innerHTML = `<div id="sumBox"></div>
      <div id="formBox"><button class="btn-p ${S.tab === 'receber' ? 'g' : ''}" data-act="novo">+ ${S.tab === 'pagar' ? 'Nova conta' : 'Novo recebimento'}</button></div>
      <input id="busca" placeholder="🔎 Buscar descrição ou categoria" style="margin-top:12px" value="${esc(S.busca)}">
      <div id="listBox" style="margin-top:10px"></div>`;
  } else c.innerHTML = '<div id="dyn"></div>';
  renderDados();
}
function renderDados() {
  if (!S.user) return;
  if (S.tab === 'pagar' || S.tab === 'receber') renderLista();
  else if (S.tab === 'balanco') renderBalanco();
  else renderMais();

/* ---------- status / lista ---------- */
function stInfo(c) {
  const p = c.tipo === 'pagar';
  if (c.status === 'pago') return { k: 'pago', t: p ? 'Paga' : 'Recebida' };
  if (c.venc < hoje()) return { k: p ? 'venc' : 'atr', t: p ? 'Vencida' : 'Atrasado' };
  return { k: p ? 'pend' : 'prev', t: p ? 'Pendente' : 'Previsto' };
}
function itemHTML(c) {
  const s = stInfo(c), p = c.tipo === 'pagar';
  const sub = c.status === 'pago'
    ? `${p ? 'Paga' : 'Recebida'} em ${fmtData(c.dataBaixa)} • venc. ${fmtDM(c.venc)}`

  const parc = c.parcela ? ` • ${c.parcela}` : '';

  return `<div class="item">

    <div class="sub">${sub}${parc}</div>
    <div class="tags"><span class="tag ${c.escopo}">${c.escopo === 'fazenda' ? '🌾 Fazenda' : '👤 Pessoal'}</span>${c.categoria ? `<span class="tag">${esc(c.categoria)}</span>` : ''}</div>
    ${c.obs ? `<div class="sub" style="margin-top:6px">📝 ${esc(c.obs)}</div>` : ''}
    <div class="r3"><span class="badge ${s.k}">${s.t}</span>
      <div class="acts">${btn}<button class="ico" data-act="edit" data-id="${c.id}" aria-label="Editar">✎</button><button class="ico" data-act="del" data-id="${c.id}" aria-label="Excluir">🗑</button></div></div>
  </div>`;
}
function renderLista() {
  const tipo = S.tab, p = tipo === 'pagar';
  const doMes = S.contas.filter(c => c.tipo === tipo && visivel(c));
  const total = doMes.reduce((a, c) => a + c.valor, 0);
  const feito = doMes.filter(c => c.status === 'pago').reduce((a, c) => a + c.valor, 0);
  const venc = doMes.filter(c => c.status !== 'pago' && c.venc < hoje());
  const sb = $('#sumBox'); if (!sb) return;
  sb.innerHTML = `<div class="big ${p ? 'red' : 'green'}">
    <small>${p ? 'A pagar no mês' : 'Previsto a receber no mês'}${S.escopo !== 'tudo' ? ' • ' + ESC_LABEL[S.escopo] : ''}</small>
    <b>${brl(total)}</b>
    <div class="ln">${p ? 'Pago' : 'Recebido'} ${brl(feito)} • Falta ${brl(total - feito)}${venc.length ? ` • <b style="display:inline;font-size:inherit">${venc.length} ${p ? 'vencida(s)' : 'atrasado(s)'}</b>` : ''}</div></div>`;

  // atrasadas de meses anteriores
  const atras = S.pendentes.filter(c => c.tipo === tipo && c.venc < hoje() && c.mes !== S.mes && visivel(c)).sort((a, b) => a.venc.localeCompare(b.venc));
  let html = '';
  if (atras.length) {
    const tot = atras.reduce((a, c) => a + c.valor, 0);
    html += `<div class="warn"><span>⚠ ${atras.length} ${p ? 'conta(s) vencida(s)' : 'recebimento(s) atrasado(s)'} de meses anteriores • ${brl(tot)}</span><button class="btn-o" data-act="atras">${S.atrasadas ? 'Ocultar' : 'Ver'}</button></div>`;
    if (S.atrasadas) html += atras.map(itemHTML).join('');
  }
  const abertas = c => c.status !== 'pago';
  const filtros = p
    ? [['todas', 'Todas'], ['abertas', 'Pendentes'], ['pagas', 'Pagas'], ['vencidas', 'Vencidas']]
    : [['todas', 'Todos'], ['abertas', 'Previstos'], ['pagas', 'Recebidos'], ['vencidas', 'Atrasados']];
  html += `<div class="chips">${filtros.map(([k, l]) => `<button data-act="filtro" data-v="${k}" class="${S.filtro === k ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  const q = S.busca.toLowerCase();
  const lista = doMes.filter(c => {
    if (S.filtro === 'abertas' && !abertas(c)) return false;
    if (S.filtro === 'pagas' && c.status !== 'pago') return false;
    if (S.filtro === 'vencidas' && !(abertas(c) && c.venc < hoje())) return false;
    if (q && !(c.descricao + ' ' + (c.categoria || '')).toLowerCase().includes(q)) return false;
    return true;
  }).sort((a, b) => a.venc.localeCompare(b.venc) || a.descricao.localeCompare(b.descricao));
  html += lista.length ? lista.map(itemHTML).join('') : `<div class="empty">Nenhum lançamento em ${mesLabel(S.mes)}.</div>`;
  $('#listBox').innerHTML = html;
}

  box.innerHTML = `<button class="btn-p ${S.tab === 'receber' ? 'g' : ''}" data-act="novo">+ ${S.tab === 'pagar' ? 'Nova conta' : 'Novo recebimento'}</button>`;

async function salvarConta() {
  const tipo = S.tab, p = tipo === 'pagar';
  const descricao = $('#f_desc').value.trim(), valor = r2(parseMoney($('#f_valor').value)), venc = $('#f_venc').value;
  if (!descricao) return toast('Informe a descrição.');
  if (valor <= 0) return toast('Informe o valor.');
  if (!venc) return toast('Informe a data.');
  let categoria = $('#f_cat').value;
  const escopo = S.form.escopo;
  try {
    if (categoria === '__nova__') {
      categoria = $('#f_catnova').value.trim();
      if (!categoria) return toast('Digite o nome da nova categoria.');
      if (!catsDe(tipo, escopo).includes(categoria))
        await base().collection('config').doc('categorias').set({ lista: FV.arrayUnion({ n: categoria, e: escopo, t: tipo }) }, { merge: true });
    }
    const dataCompra = $('#f_data1').value || venc;
    const obs = $('#f_obs').value.trim();
    localStorage.setItem('ultEsc', escopo);
    const dados = { tipo, descricao, valor, categoria, escopo, obs, dataCompra };
    if (S.edit) {
      const ant = achar(S.edit);
      await base().collection('contas').doc(S.edit).update({ ...dados, venc, mes: venc.slice(0, 7) });
      toast('Alterações salvas.');
      if (ant && venc.slice(0, 7) !== S.mes) { S.mes = venc.slice(0, 7); ouvirMes(); renderTudo(); }
    } else {
      const rep = $('#f_rep').value;
      const n = rep === 'parcelada' ? Math.max(2, Math.min(60, parseInt($('#f_parc').value) || 2)) : rep === 'fixa' ? 12 : 1;
      const serieId = n > 1 ? base().collection('contas').doc().id : null;
      const batch = db.batch();
      for (let i = 0; i < n; i++) {
        const v = addMeses(venc, i);
        const doc = base().collection('contas').doc();
        batch.set(doc, {
          ...dados, venc: v, mes: v.slice(0, 7), status: 'pendente', criadoEm: FV.serverTimestamp(),
          ...(serieId ? { serieId } : {}),
          ...(rep === 'parcelada' ? { parcela: `${i + 1}/${n}` } : rep === 'fixa' ? { parcela: 'fixa' } : {})
        });
      }
      await batch.commit();
      toast(n > 1 ? `${n} lançamentos criados.` : 'Lançamento salvo.');
    }
    fecharForm();
  } catch (e) { toast('Erro ao salvar: ' + e.message); }
}

async function excluir(id, modo) {

/* ---------- balanço ---------- */
function inicio(s) {
  const k = s === 'pessoal' ? 'P' : 'F';
  const d = S.saldos[S.mes]; if (d && d['inicio' + k] != null) return d['inicio' + k];
  const p = S.saldos[mesAnt(S.mes)]; if (p && p['fech' + k] != null) return p['fech' + k];
  return 0;
}
function calc(esc) {
  const L = S.contas.filter(c => esc === 'tudo' || c.escopo === esc);
  const sum = (t, pg) => L.filter(c => c.tipo === t && (pg === undefined || (c.status === 'pago') === pg)).reduce((a, c) => a + c.valor, 0);
  const pagarT = sum('pagar'), pago = sum('pagar', true), recT = sum('receber'), rec = sum('receber', true);
  const ini = esc === 'tudo' ? inicio('pessoal') + inicio('fazenda') : inicio(esc);
  return { pagarT, pago, recT, rec, ini, atual: ini + rec - pago, prev: ini + recT - pagarT, faltaPagar: pagarT - pago, faltaReceber: recT - rec };
}
function renderBalanco() {
  const b = calc(S.escopo), d = $('#dyn'); if (!d) return;
  const fechado = S.saldos[S.mes] && S.saldos[S.mes].fechadoEm;
  const porCat = {};
  S.contas.filter(c => c.tipo === 'pagar' && visivel(c)).forEach(c => { const k = c.categoria || 'Sem categoria'; porCat[k] = (porCat[k] || 0) + c.valor; });
  const cats = Object.entries(porCat).sort((a, b) => b[1] - a[1]);
  const maxC = cats.length ? cats[0][1] : 1;
  let html = `<div style="margin-top:12px" class="grid2">
    <div class="bal b1"><span>Caixa no início do mês</span><b>${brl(b.ini)}</b></div>
    <div class="bal b2"><span>Caixa atual</span><b>${brl(b.atual)}</b></div>
    <div class="bal b3"><span>Total a pagar no mês</span><b>${brl(b.pagarT)}</b></div>
    <div class="bal b2"><span>Previsto a receber no mês</span><b>${brl(b.recT)}</b></div></div>
    <div class="card"><h3>Movimentação do mês</h3>
      <div class="mov"><span>Recebido:</span><span class="pos">${brl(b.rec)}</span></div>
      <div class="mov"><span>Pago:</span><span class="neg">${brl(b.pago)}</span></div>
      <div class="mov"><span>Ainda a receber:</span><span>${brl(b.faltaReceber)}</span></div>
      <div class="mov"><span>Ainda a pagar:</span><span>${brl(b.faltaPagar)}</span></div></div>
    <div class="final"><small>Caixa previsto no fim do mês</small><b>${brl(b.prev)}</b></div>
    <div class="hint" style="text-align:center">Saldo inicial + recebimentos − pagamentos${fechado ? ' • mês encerrado ✔' : ''}</div>`;
  if (S.escopo === 'tudo') {
    const P = calc('pessoal'), F = calc('fazenda');
    html += `<div class="card"><h3>Pessoal × Fazenda</h3>
      <div class="mov" style="color:var(--mut);font-size:13px"><span></span><span>👤 Pessoal &nbsp;|&nbsp; 🌾 Fazenda</span></div>
      ${[['A pagar', 'pagarT'], ['A receber', 'recT'], ['Caixa atual', 'atual'], ['Caixa previsto', 'prev']].map(([l, k]) =>
        `<div class="mov"><span>${l}</span><span>${brl(P[k])} | ${brl(F[k])}</span></div>`).join('')}</div>`;
  }
  if (cats.length) html += `<div class="card"><h3>Gastos por categoria</h3>${cats.map(([k, v]) =>
    `<div class="bar"><div class="t"><span>${esc(k)}</span><span>${brl(v)}</span></div><div class="b"><i style="width:${Math.max(3, v / maxC * 100)}%"></i></div></div>`).join('')}</div>`;
  html += `<div class="grid2" style="margin-top:6px"><button class="btn-o" data-act="saldoini">Ajustar saldo inicial</button><button class="btn-o g" data-act="encerrar">Encerrar o mês</button></div>

    <div class="hint" style="text-align:center;margin-top:8px">Ao encerrar o mês, registre o saldo final realizado.</div>`;
  d.innerHTML = html;
}

function gerarPDF() {
  if (!window.jspdf) return toast('PDF indisponível (sem internet?).');
  const { jsPDF } = window.jspdf; const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const b = calc(S.escopo);

  doc.setFontSize(11); doc.setTextColor(60); doc.text(`${mesLabel(S.mes)}  •  ${ESC_LABEL[S.escopo]}`, 40, 66);
  doc.autoTable({
    startY: 82, theme: 'grid', head: [['Resumo do mês', 'Valor']], headStyles: { fillColor: [11, 79, 87] },
    body: [['Caixa no início do mês', brl(b.ini)], ['Total a pagar', brl(b.pagarT)], ['Previsto a receber', brl(b.recT)], ['Pago', brl(b.pago)], ['Recebido', brl(b.rec)], ['Caixa atual', brl(b.atual)], ['Caixa previsto no fim do mês', brl(b.prev)]],
    columnStyles: { 1: { halign: 'right' } }, styles: { fontSize: 10 }
  });
  const sec = (tipo, titulo, cor) => {
    const L = S.contas.filter(c => c.tipo === tipo && visivel(c)).sort((a, b) => a.venc.localeCompare(b.venc));
    if (!L.length) return;
    doc.autoTable({
      startY: doc.lastAutoTable.finalY + 18, theme: 'striped', headStyles: { fillColor: cor }, styles: { fontSize: 9 },
      head: [[titulo, 'Descrição', 'Categoria', 'Origem', 'Situação', 'Valor']],
      body: [...L.map(c => [fmtData(c.venc), c.descricao + (c.parcela && c.parcela !== 'fixa' ? ' (' + c.parcela + ')' : ''), c.categoria || '-', c.escopo === 'fazenda' ? 'Fazenda' : 'Pessoal', stInfo(c).t, brl(c.valor)]),
        [{ content: 'Total', colSpan: 5, styles: { fontStyle: 'bold' } }, { content: brl(L.reduce((a, c) => a + c.valor, 0)), styles: { fontStyle: 'bold', halign: 'right' } }]],
      columnStyles: { 5: { halign: 'right' } }
    });
  };
  sec('pagar', 'Vencimento', [217, 72, 64]);
  sec('receber', 'Previsão', [30, 142, 62]);
  const n = doc.internal.getNumberOfPages(), w = doc.internal.pageSize.getWidth(), h = doc.internal.pageSize.getHeight();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i); doc.setFontSize(9); doc.setTextColor(110);
    doc.text('Gerado em ' + fmtData(hoje()), 40, h - 22);
    doc.setFont(undefined, 'bold'); doc.text('AIMEX SOFTWARE', w / 2, h - 22, { align: 'center' }); doc.setFont(undefined, 'normal');
    doc.text(`Página ${i} de ${n}`, w - 40, h - 22, { align: 'right' });
  }
  doc.save(`controle-de-contas-${S.mes}.pdf`);
}
async function exportarCSV() {
  try {
    const s = await base().collection('contas').get();
    const L = s.docs.map(d => d.data()).sort((a, b) => a.venc.localeCompare(b.venc));
    const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const linhas = [['Tipo', 'Origem', 'Descrição', 'Categoria', 'Valor', 'Compra', 'Vencimento/Previsão', 'Situação', 'Data baixa', 'Parcela', 'Obs'].join(';')];
    L.forEach(c => linhas.push([c.tipo === 'pagar' ? 'Pagar' : 'Receber', c.escopo, c.descricao, c.categoria, String(c.valor).replace('.', ','), fmtData(c.dataCompra), fmtData(c.venc), stInfo(c).t, fmtData(c.dataBaixa), c.parcela || '', c.obs || ''].map(q).join(';')));
    const blob = new Blob(['﻿' + linhas.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'controle-de-contas.csv'; a.click();
  } catch (e) { toast('Erro: ' + e.message); }
}

/* ---------- eventos ---------- */
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id, v = el.dataset.v;
  switch (act) {
    case 'login': return fazerLogin();
    case 'reset': return resetSenha();
    case 'authmodo':
      modoCriar = !modoCriar;
      $('#a_btn').textContent = modoCriar ? 'Criar conta' : 'Entrar';
      el.textContent = modoCriar ? 'Já tem conta? Entrar' : 'Não tem conta? Criar conta'; return;
    case 'logout': return auth.signOut();
    case 'tab': S.tab = v; S.filtro = 'todas'; S.busca = ''; S.edit = null; return renderTudo();
    case 'escopo': S.escopo = v; localStorage.setItem('escopo', v); return renderTudo();
    case 'mes': S.mes = addMeses(S.mes + '-01', Number(v)).slice(0, 7); ouvirMes(); return renderTudo();
    case 'novo': return abrirForm(null);
    case 'cancelar': return fecharForm();
    case 'origem': S.form.escopo = v; localStorage.setItem('ultEsc', v);
      document.querySelectorAll('#segOrigem button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); return fillCats();
    case 'salvar': return salvarConta();
    case 'filtro': S.filtro = v; return renderLista();
    case 'atras': S.atrasadas = !S.atrasadas; return renderLista();
    case 'baixa': return modalBaixa(id);
    case 'okbaixa': {
      const data = $('#m_data').value || hoje();
      try { await base().collection('contas').doc(id).update({ status: 'pago', dataBaixa: data }); fechar(); toast('Confirmado.'); } catch (e) { toast('Erro: ' + e.message); }
      return;
    }
    case 'reabrir':
      try { await base().collection('contas').doc(id).update({ status: 'pendente', dataBaixa: FV.delete() }); toast('Reaberto.'); } catch (e) { toast('Erro: ' + e.message); }
      return;
    case 'edit': { const c = achar(id); if (c) abrirForm(c); return; }
    case 'del': return modalExcluir(id);
    case 'okdel': return excluir(id, el.dataset.m);
    case 'fechar': return fechar();
    case 'saldoini': return modalSaldo('ini');
    case 'encerrar': return modalSaldo('fim');
    case 'oksaldo': {
      const sp = r2(parseMoney($('#m_sp').value)), sf = r2(parseMoney($('#m_sf').value));
      const ini = el.dataset.m === 'ini';
      try {
        await base().collection('saldos').doc(S.mes).set(ini ? { inicioP: sp, inicioF: sf } : { fechP: sp, fechF: sf, fechadoEm: FV.serverTimestamp() }, { merge: true });
        fechar(); toast(ini ? 'Saldo inicial salvo.' : 'Mês encerrado. O saldo passa para o mês seguinte.');
      } catch (e) { toast('Erro: ' + e.message); }
      return;
    }
    case 'instalar': return instalarApp();
    case 'pdf': return gerarPDF();
    case 'csv': return exportarCSV();
    case 'delcat': {
      const lista = S.custom.filter((_, i) => i !== Number(el.dataset.i));
      try { await base().collection('config').doc('categorias').set({ lista }); } catch (e) { toast('Erro: ' + e.message); }
      return;
    }
  }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.classList.contains('money')) maskMoney(t);
  if (t.id === 'busca') { S.busca = t.value; renderLista(); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'f_cat') { const n = $('#f_catnova'); n.hidden = t.value !== '__nova__'; if (!n.hidden) n.focus(); }
  if (t.id === 'f_rep') $('#boxParc').hidden = t.value !== 'parcelada';
  if (t.id === 'mesInput' && t.value) { S.mes = t.value; ouvirMes(); renderTudo(); }
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') fechar(); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && !$('#auth').hidden && e.target.tagName === 'INPUT') fazerLogin(); });

/* ---------- instalar app (PWA) ---------- */
let promptInstalar = window.__pwa;
const instalado = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const ehIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
function atualizaBtnInstalar() { const b = $('#btnInstalar'); if (b) b.hidden = instalado(); }
window.__pwaPronto = () => { promptInstalar = window.__pwa; atualizaBtnInstalar(); };
window.addEventListener('appinstalled', () => { promptInstalar = null; atualizaBtnInstalar(); const c = $('#cardInst'); if (c) c.hidden = true; toast('App instalado!'); });
async function instalarApp() {
  if (!promptInstalar && !ehIOS()) {
    toast('Preparando a instalação…');
    for (let i = 0; i < 8 && !window.__pwa; i++) await new Promise(r => setTimeout(r, 250));
    promptInstalar = window.__pwa;
  }
  if (promptInstalar) {
    promptInstalar.prompt();
    await promptInstalar.userChoice.catch(() => {});
    promptInstalar = null; return;
  }
  modal(ehIOS()
    ? `<h3>Instalar no iPhone</h3><div style="line-height:1.7">1. Abra este site no <b>Safari</b>.<br>2. Toque no botão <b>Compartilhar</b> (quadrado com seta para cima).<br>3. Escolha <b>Adicionar à Tela de Início</b>.<br>4. Toque em <b>Adicionar</b>.</div><div class="mbtns"><button class="btn-p" data-act="fechar">Entendi</button></div>`
    : `<h3>Instalar no celular</h3><div style="line-height:1.7">1. Abra este site no <b>Chrome</b>.<br>2. Toque no menu <b>⋮</b> (canto superior direito).<br>3. Escolha <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.</div><div class="mbtns"><button class="btn-p" data-act="fechar">Entendi</button></div>`);
}
atualizaBtnInstalar();

/* ---------- início ---------- */
if (!CONFIGURADO) {
  $('#auth').hidden = false;
  $('#a_err').textContent = 'Configure o firebaseConfig no início do index.html.';
} else {
  auth.onAuthStateChanged(u => {
    S.user = u;
    if (u) { $('#auth').hidden = true; $('#app').hidden = false; encerrarSessao(); iniciarSessao(); }
    else { encerrarSessao(); $('#app').hidden = true; $('#auth').hidden = false; }
  });
}
</script>
</body>
</html>
