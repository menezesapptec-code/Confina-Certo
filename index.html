<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14301f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Confina Certo</title>
<style>
:root{--bg:#f3efe6;--card:#fffdf8;--ink:#1d2a22;--mut:#66756b;--green:#14301f;--green2:#1f6a42;--lime:#7fb069;--amber:#e0a526;--red:#c2452d;--line:#e3dccd}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
#app{min-height:100vh;display:flex;flex-direction:column}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:20;background:var(--green);color:#f4efe6;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px}
#top .logo{width:34px;height:34px;border-radius:9px;flex:none}
#top h1{font-size:17px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
#top small{display:block;font-size:12px;opacity:.7;font-weight:500}
#top .sp{flex:1}
.net{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.14);display:flex;align-items:center;gap:6px;white-space:nowrap}
.net i{width:8px;height:8px;border-radius:50%;background:var(--lime)}
.net.off i{background:var(--amber)}
#view{padding:16px 16px 96px;max-width:1100px;width:100%;margin:0 auto}
h2{font-size:20px;font-weight:800;letter-spacing:-.015em}
h3{font-size:15px;font-weight:800}
.mut{color:var(--mut)}
.pgh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.pgh p{font-size:13px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.card+.card,.stats+.card,.card+.stats{margin-top:12px}
.grid2>.card{margin-top:0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:2px}
.stat .v small{font-size:13px;font-weight:600;color:var(--mut);letter-spacing:0}
.stat .s{font-size:12px;color:var(--mut)}
.stat.good .v{color:#237a3f}.stat.badv .v{color:var(--red)}
.b{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.b.ok{background:#e1f0da;color:#2c6a2a}.b.warn{background:#fbecc4;color:#7a5600}.b.bad{background:#f8d9d1;color:#9a2c16}.b.mut{background:#ece7da;color:#5c6a60}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--green2);color:#fff;min-height:44px;text-align:center}
.btn.sec{background:#ece7da;color:var(--ink)}
.btn.line{background:transparent;border:1px solid #cfc7b5;color:var(--ink)}
.btn.sm{padding:7px 12px;min-height:34px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:active{transform:scale(.98)}
input,select{width:100%;padding:12px;border:1px solid #cfc7b5;border-radius:10px;font:inherit;background:#fff;color:var(--ink);min-height:44px}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 5px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row .g{flex:1;min-width:0}
.row .g b{display:block}
.row .g span{font-size:13px;color:var(--mut)}
.row .r{text-align:right;font-variant-numeric:tabular-nums}
.row .r b{display:block}
.bar{height:8px;background:#e8e2d3;border-radius:99px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--lime);border-radius:99px}
.bar.warn>i{background:var(--amber)}.bar.bad>i{background:var(--red)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid #cfc7b5;background:transparent;border-radius:99px;padding:7px 14px;font-weight:700;font-size:13px;color:var(--ink)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.linha{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);margin:18px 0 8px}
.linha:first-of-type{margin-top:4px}
.baias{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.baia{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--lime);border-radius:14px;padding:11px 12px;cursor:pointer}
.baia.warn{border-left-color:var(--amber)}.baia.bad{border-left-color:var(--red)}
.baia .bh{display:flex;justify-content:space-between;align-items:baseline}
.baia .bh b{font-size:19px;letter-spacing:-.02em}
.baia .bh span{font-size:12px;color:var(--mut)}
.baia .bn{font-size:13px;color:var(--mut);margin:2px 0 8px;font-variant-numeric:tabular-nums}
.baia .bc{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.dots{display:inline-flex;gap:3px}
.dot{width:12px;height:12px;border-radius:4px;background:#e1dac9}
.dot.on{background:var(--green2)}
.modal{position:fixed;inset:0;background:rgba(10,20,14,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal.hidden{display:none}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:93vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet .x{float:right;border:0;background:#e8e2d3;width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.kv div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.kv small{display:block;font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.kv b{font-size:16px;font-variant-numeric:tabular-nums}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.esc{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0 10px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.opt b{font-size:26px;line-height:1}
.opt span{font-weight:800}
.opt small{font-size:12px;color:var(--mut)}
.opt.sel{border-color:var(--green2);background:#e9f3e2}
.big{font-size:34px!important;font-weight:800;text-align:center;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.step{display:grid;grid-template-columns:64px 1fr 64px;gap:8px;align-items:center}
.chk{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:14px}
.chk input,input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--green2)}
.note{font-size:12.5px;color:var(--mut);margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);text-align:right;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
.scroll{overflow-x:auto}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
.ing{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.ing:last-child{border-bottom:0}
.cfgrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
#tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11px;font-weight:700;color:var(--mut)}
#tabs a.on{color:var(--green2)}
svg.ic{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#side{display:none}
#toast{position:fixed;left:50%;top:calc(68px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-16px);background:var(--green);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;color:var(--mut);padding:24px 8px}
.login{position:fixed;inset:0;z-index:100;background:var(--green);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.login.hidden{display:none}
.login .box{background:var(--bg);border-radius:20px;padding:24px 20px;width:100%;max-width:380px}
.login img{width:58px;height:58px;border-radius:14px;display:block;margin:0 auto 10px}
.login h1{text-align:center;font-size:22px;font-weight:800;letter-spacing:-.02em}
.login .sub{text-align:center;color:var(--mut);font-size:13px;margin:2px 0 6px}
.login .err{color:var(--red);font-size:13px;font-weight:600;min-height:18px;margin-top:10px}
@media(min-width:700px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .grid2{grid-template-columns:1fr 1fr}
  .modal{align-items:center}.sheet{border-radius:20px}
}
@media(min-width:900px){
  #app{flex-direction:row}
  #tabs{display:none}
  #side{display:flex;flex-direction:column;gap:2px;width:228px;flex:none;background:var(--green);color:#e9e4d6;padding:18px 12px;position:sticky;top:0;height:100vh}
  #side .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-weight:800;font-size:18px;letter-spacing:-.01em}
  #side .brand img{width:36px;height:36px;border-radius:9px}
  #side a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;font-weight:600;color:#cfd8cd}
  #side a:hover{background:rgba(255,255,255,.07)}
  #side a.on{background:rgba(255,255,255,.14);color:#fff}
  #top .logo{display:none}
  #view{padding:22px 28px 40px}
  .stats{grid-template-columns:repeat(3,1fr)}
  #toast{top:76px}
}
@media(min-width:1100px){.stats.s4{grid-template-columns:repeat(4,1fr)}}

textarea{width:100%;padding:12px;border:1px solid #cfc7b5;border-radius:10px;font:inherit;background:#fff;color:var(--ink);resize:vertical}
input.mini{width:92px;min-height:36px;padding:6px 8px;text-align:right}
tr.tot td{border-top:2px solid var(--line);font-weight:700}
.distrow{display:grid;grid-template-columns:1fr 96px auto 32px;gap:8px;align-items:center;margin-top:8px}
.distrow span{font-size:12px;min-width:70px;text-align:right}
.rm{border:0;background:#ece7da;width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1;color:var(--ink)}
.ingrow{display:grid;grid-template-columns:1fr 86px 32px;gap:8px;align-items:center;margin-top:8px}
.ingrow .ingi{grid-column:1/-1;font-size:12px;margin-top:-2px}
a.row{color:inherit}
.kv4{grid-template-columns:repeat(2,1fr)}
@media(min-width:700px){.kv4{grid-template-columns:repeat(4,1fr)}}
.s4{grid-template-columns:repeat(2,1fr)}
@media(min-width:900px){.stats.s4{grid-template-columns:repeat(4,1fr)}}
@media(max-width:420px){.distrow{grid-template-columns:1fr 80px 32px}.distrow span{display:none}}
#splash{position:fixed;inset:0;z-index:200;background:#02050d;display:flex;align-items:center;justify-content:center;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
#splash img{width:100%;height:100%;object-fit:contain;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 14%,#000 86%,transparent),linear-gradient(to right,transparent,#000 8%,#000 92%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to bottom,transparent,#000 14%,#000 86%,transparent),linear-gradient(to right,transparent,#000 8%,#000 92%,transparent);mask-composite:intersect}
</style>
</head>

const byId=(arr,id)=>arr.find(x=>x.id===id);
const area=id=>byId(S.areas,id),insumo=id=>byId(S.insumos,id),formula=id=>byId(S.formulas,id);
function loteCalc(l){
  const dias=num(l.dias),gmd=num(l.gmd),pi=num(l.pesoIn),c=num(l.cons)/100,q=num(l.qtd);
  const ganho=dias*gmd,pf=pi+ganho,pm=(pf+pi)/2;
  const ci=pi*c,cm=pm*c,cf=pf*c;
  const dec=l.inicio?clamp(diffDias(l.inicio,hoje()),0,dias):0;
  const ph=pi+gmd*dec,ch=ph*c;
  const fim=l.inicio?addDias(l.inicio,dias):'';
  const st=!l.inicio||l.inicio>hoje()?'futuro':(fim&&hoje()>fim?'encerrado':'ativo');
  return {ganho,pf,pm,ci,cm,cf,ciL:ci*q,cmL:cm*q,cfL:cf*q,perCab:cm*dias,perLote:cm*dias*q,fim,st,dec,pesoHoje:ph,consHoje:ch,consHojeL:ch*q,arrobas:q?(ganho*q*(num(l.rc)||.5))/15:0};
}
function compraCalc(id,st){
  st=st||S;
  const cs=st.compras.filter(c=>c.insumoId===id);
  const comprado=sum(cs,c=>c.qtd),valor=sum(cs,c=>num(c.qtd)*num(c.preco));
  let usado=0;
  st.batidas.forEach(b=>{(b.real||[]).forEach(r=>{if(r.id===id)usado+=num(r.kg)})});
  return {comprado,valor,valorKg:comprado?valor/comprado:0,usado,estoque:comprado-usado};
}
function formCalc(f,st){
  st=st||S;
  let soma=0,ms=0,custo=0,pb=0,ndt=0,na=0,iono=0,sd=0,semCompra=[];
  (f.ing||[]).forEach(g=>{
    const i=byId(st.insumos,g.id);if(!i)return;
    const p=num(g.pct)/100,cc=compraCalc(i.id,st),m=num(i.ms)/100;
    soma+=num(g.pct);ms+=p*num(i.ms);custo+=p*cc.valorKg;iono+=p*num(i.iono);
    sd+=p*m;pb+=p*m*num(i.pb);ndt+=p*m*num(i.ndt);na+=p*m*num(i.na);
    if(!cc.comprado)semCompra.push(i.nome);
  });
  return {soma,ms,custo,pb:sd?pb/sd:0,ndt:sd?ndt/sd:0,na:sd?na/sd:0,iono,semCompra};
}
const lotesDaArea=id=>S.lotes.filter(l=>l.areaId===id);
const fornHoje=areaId=>sum(S.forn.filter(h=>h.areaId===areaId&&h.data===hoje()),h=>h.kg);
const ultimoForn=areaId=>S.forn.filter(h=>h.areaId===areaId).map(h=>h.data).sort().pop()||'';
function idadeMeses(n){
  if(!n)return null;const a=new Date(n+'T12:00:00'),b=new Date();
  let m=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();if(b.getDate()<a.getDate())m--;return Math.max(0,m);
}
function usoMedio7(id){
  const lim=addDias(hoje(),-7);let u=0;
  S.batidas.forEach(b=>{if(b.data>lim)(b.real||[]).forEach(r=>{if(r.id===id)u+=num(r.kg)})});
  return u/7;
}

/* ===== Batida ===== */
function btInit(){
  if(BT&&(!BT.formulaId||formula(BT.formulaId)))return;
  if(!BT)BT={formulaId:'',qtd:'',data:hoje(),real:{},dist:[]};
  if(!formula(BT.formulaId))BT.formulaId=(S.formulas.find(f=>f.ativa!==false)||{}).id||'';
}
function btCalc(){
  const f=formula(BT.formulaId);if(!f)return null;
  const q=num(BT.qtd);
  const rows=(f.ing||[]).map(g=>{
    const i=insumo(g.id),pl=q*num(g.pct)/100,hasR=BT.real[g.id]!==undefined&&BT.real[g.id]!=='';
    const rl=hasR?num(BT.real[g.id]):0,cc=compraCalc(g.id);
    return {id:g.id,nome:i?i.nome:'(removido)',pct:num(g.pct),pl,rl,vkg:cc.valorKg,val:rl*cc.valorKg,dif:rl-pl,estoque:cc.estoque};
  });
  const tp=sum(rows,r=>r.pl),tr=sum(rows,r=>r.rl),tv=sum(rows,r=>r.val);
  const forn=sum(BT.dist,d=>num(d.kg));
  return {f,q,rows,tp,tr,tv,vkg:tr?tv/tr:0,forn,sobra:tr-forn};
}
VIEWS.batida=()=>{
  btInit();
  const ativas=S.formulas.filter(f=>f.ativa!==false).map(f=>[f.id,f.nome]);
  let h=head('Batida','Planejado × realizado, custo e distribuição nos pastos');
  h+='<div class="card"><div class="cfgrow">'+selF('bt-f','Fórmula',ativas,BT.formulaId,'Selecione…')+fld('bt-q','Quantidade a fabricar (kg)',BT.qtd)+'</div>'+fld('bt-d','Data',BT.data,{type:'date'})+'</div>';
  const c=btCalc();
  if(!c)return h+'<div class="card empty" style="margin-top:12px">'+(ativas.length?'Escolha uma fórmula para montar a batida.':'Crie uma formulação ativa em “Formulações”.')+'</div>';
  h+='<div class="card"><h3>Ingredientes</h3><div class="scroll"><table><tr><th>Ingrediente</th><th>kg plan.</th><th>kg realizado</th></tr>'
   +c.rows.map((r,k)=>'<tr><td><b>'+esc(r.nome)+'</b> <span class="mut">'+fmt(r.pct,1)+'%</span><br><span class="mut" style="font-size:12px" id="bt-m-'+k+'"></span></td><td id="bt-p-'+k+'">'+fmt(r.pl,1)+'</td><td><input class="mini" id="bt-r-'+k+'" inputmode="decimal" value="'+esc(BT.real[r.id]!==undefined?BT.real[r.id]:'')+'" placeholder="0"></td></tr>').join('')
   +'<tr class="tot"><td><b>Total</b><br><span class="mut" style="font-size:12px" id="bt-tm"></span></td><td id="bt-tp"></td><td id="bt-tr"></td></tr></table></div>'
   +'<div id="bt-warn"></div><button class="btn sec sm" style="margin-top:10px" data-act="btPlan">Usar planejado como realizado</button></div>';
  h+='<div class="card"><h3>Distribuição nos pastos</h3>'
   +BT.dist.map((d,k)=>'<div class="distrow"><select id="bt-da-'+k+'">'+opts(S.areas.map(a=>[a.id,a.nome]),d.areaId,'Pasto…')+'</select><input id="bt-dk-'+k+'" inputmode="decimal" value="'+esc(d.kg)+'" placeholder="kg"><span id="bt-dv-'+k+'" class="mut"></span><button class="rm" data-act="btRm" data-i="'+k+'" aria-label="Remover">×</button></div>').join('')
   +'<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn sec sm" data-act="btAdd">+ Pasto</button><button class="btn sec sm" data-act="btSug">Sugerir pelos lotes ativos</button></div>'
   +'<div class="kv kv4"><div><small>Produzido</small><b id="bt-s1"></b></div><div><small>Valor/kg</small><b id="bt-s2"></b></div><div><small>Fornecido</small><b id="bt-s3"></b></div><div><small>Sobra</small><b id="bt-s4"></b></div></div></div>';
  h+='<button class="btn block" style="margin-top:12px" data-act="btSave">Salvar batida e lançar fornecimento</button><p class="note">Ao salvar, o realizado baixa o estoque dos insumos e cada pasto entra no histórico de fornecimento com a fórmula daquele dia.</p>';
  setTimeout(updBatida,0);
  return h;
};
function btRead(){
  const f=formula(BT.formulaId);if(!f||!$('#bt-q'))return;
  BT.qtd=$('#bt-q').value;BT.data=$('#bt-d').value;
  (f.ing||[]).forEach((g,k)=>{const el=$('#bt-r-'+k);if(el)BT.real[g.id]=el.value});
  BT.dist=BT.dist.map((d,k)=>({areaId:$('#bt-da-'+k)?$('#bt-da-'+k).value:d.areaId,kg:$('#bt-dk-'+k)?$('#bt-dk-'+k).value:d.kg}));
}
function updBatida(){
  const c=btCalc();if(!c||!$('#bt-tp'))return;
  c.rows.forEach((r,k)=>{
    $('#bt-p-'+k).textContent=fmt(r.pl,1);
    const vazio=BT.real[r.id]===''||BT.real[r.id]===undefined;
    $('#bt-m-'+k).textContent=vazio?'valor R$ 0,00':brl(r.val)+' · dif '+(r.dif>0?'+':'')+fmt(r.dif,1)+' kg'+(c.tr?' · '+fmt(r.rl/c.tr*100,1)+'% do realizado':'');
  });
  $('#bt-tp').textContent=fmt(c.tp,1);$('#bt-tr').textContent=fmt(c.tr,1);$('#bt-tm').textContent=brl(c.tv)+' · dif '+(c.tr-c.tp>0?'+':'')+fmt(c.tr-c.tp,1)+' kg';
  const falta=c.rows.filter(r=>r.rl>0&&r.rl>r.estoque).map(r=>r.nome+' (estoque '+fmt(r.estoque)+' kg)');
  const sem=c.rows.filter(r=>!r.vkg).map(r=>r.nome);
  $('#bt-warn').innerHTML=(falta.length?'<p class="note" style="color:var(--red)">Estoque insuficiente: '+esc(falta.join(', '))+'.</p>':'')+(sem.length?'<p class="note" style="color:var(--amber)">Sem compra registrada (custo R$ 0): '+esc(sem.join(', '))+'.</p>':'');
  BT.dist.forEach((d,k)=>{const el=$('#bt-dv-'+k);if(el)el.textContent=brl(num(d.kg)*c.vkg)});
  $('#bt-s1').textContent=fmt(c.tr,1)+' kg';$('#bt-s2').textContent=brl(c.vkg);$('#bt-s3').textContent=fmt(c.forn,1)+' kg';
  const s=$('#bt-s4');s.textContent=fmt(c.sobra,1)+' kg';s.style.color=c.sobra<-0.05?'var(--red)':'';
}

function mForn(id){
  const h=byId(S.forn,id),a=area(h.areaId);
  sheet('<h2>'+esc(a?a.nome:'Fornecimento')+'</h2><div class="kv">'+kv('Data',fmtData(h.data))+kv('Quantidade',fmt(h.kg)+' kg')+kv('Valor',brl(h.valor))+'</div><p class="note" style="margin-top:0">Fórmula <b>'+esc(h.nome)+'</b> — receita gravada no dia do fornecimento:</p>'
   +'<div class="card" style="margin-top:8px">'+(h.snap||[]).map(g=>{const i=insumo(g.id);return '<div class="ing"><span>'+esc(i?i.nome:'(removido)')+'</span><b>'+fmt(g.pct,2)+'% · '+fmt(h.kg*g.pct/100,1)+' kg</b></div>'}).join('')+'</div>'
   +delBtn('forn',id)+(h.batidaId&&byId(S.batidas,h.batidaId)?(isAdmin()?'<button type="button" class="btn line block" style="margin-top:8px;color:var(--red)" data-act="del" data-k="batidas" data-id="'+h.batidaId+'">Excluir a batida inteira (devolve o estoque)</button>':''):''));
}

/* ===== formulários ===== */
const FORMS={};
FORMS.lote=()=>{
  const id=$('[data-form=lote]').dataset.id,o=readLote();
  if(!o.nome)return toast('Informe o nome do lote');
  if(!o.areaId)return toast('Escolha o pasto ou baia');
  if(!(o.qtd>0))return toast('Informe a quantidade de animais');
  if(!(o.pesoIn>0))return toast('Informe o peso médio de entrada');
  if(!(o.dias>0))return toast('Informe os dias');
  if(id)Object.assign(byId(S.lotes,id),o);else S.lotes.push(Object.assign({id:uid()},o));
  save();closeModal();render(false);toast('Lote salvo');
};
FORMS.animal=()=>{
  const id=$('[data-form=animal]').dataset.id,brinco=$('#an-b').value.trim();
  if(!brinco)return toast('Informe o brinco');
  if(S.animais.some(a=>a.brinco.toLowerCase()===brinco.toLowerCase()&&a.id!==id))return toast('Já existe um animal com esse brinco');
  const o={brinco,sexo:$('#an-s').value,nasc:$('#an-n').value,raca:$('#an-r').value,dono:$('#an-d').value.trim(),entrada:$('#an-e').value,pesoIn:num($('#an-p').value),valor:num($('#an-v').value),loteId:$('#an-l').value};
  if(o.nasc&&o.nasc>hoje())return toast('Nascimento não pode ser no futuro');
  if(id)Object.assign(byId(S.animais,id),o);else S.animais.push(Object.assign({id:uid()},o));
  save();closeModal();render(false);toast('Animal salvo');
};
FORMS.area=()=>{
  const id=$('[data-form=area]').dataset.id,nome=$('#ar-n').value.trim(),m2=num($('#ar-m').value);
  if(!nome)return toast('Informe o nome');
  if(S.areas.some(a=>a.nome.toLowerCase()===nome.toLowerCase()&&a.id!==id))return toast('Já existe uma área com esse nome');
  if(id)Object.assign(area(id),{nome,m2});else S.areas.push({id:uid(),nome,m2});
  save();closeModal();render(false);toast('Área salva');
};
FORMS.insumo=()=>{
  const id=$('[data-form=insumo]').dataset.id,nome=$('#in-n').value.trim();
  if(!nome)return toast('Informe o nome');
  if(S.insumos.some(i=>i.nome.toLowerCase()===nome.toLowerCase()&&i.id!==id))return toast('Já existe um insumo com esse nome');
  const o={nome,cat:$('#in-c').value,un:'kg',saco:num($('#in-s').value),ms:num($('#in-ms').value),pb:num($('#in-pb').value),ndt:num($('#in-ndt').value),na:num($('#in-na').value),iono:num($('#in-io').value)};
  if(o.ms<=0||o.ms>100)return toast('MS deve estar entre 0 e 100%');
  if(id)Object.assign(insumo(id),o);else S.insumos.push(Object.assign({id:uid()},o));
  save();closeModal();render(false);toast('Insumo salvo');
};
FORMS.compra=()=>{
  const id=$('[data-form=compra]').dataset.id;
  const o={insumoId:$('#cp-i').value,qtd:num($('#cp-q').value),preco:num($('#cp-p').value),forn:$('#cp-f').value.trim(),data:$('#cp-d').value};
  if(!o.insumoId)return toast('Escolha a matéria-prima');
  if(!(o.qtd>0))return toast('Informe a quantidade');
  if(!(o.preco>0))return toast('Informe o valor do kg');
  if(!o.data)return toast('Informe a data de chegada');
  if(id)Object.assign(byId(S.compras,id),o);else S.compras.push(Object.assign({id:uid()},o));
  save();closeModal();render(false);toast('Compra registrada · estoque atualizado');
};
FORMS.formula=()=>{
  readFD();
  const nome=FD.nome.trim();
  if(!nome)return toast('Informe o nome da formulação');
  const ing=FD.rows.filter(r=>r.id||num(r.pct)).map(r=>({id:r.id,pct:num(r.pct)}));
  if(ing.some(g=>!g.id))return toast('Escolha o ingrediente de cada linha');
  if(ing.some(g=>!(g.pct>0)))return toast('Informe a inclusão (%) de cada ingrediente');
  if(new Set(ing.map(g=>g.id)).size!==ing.length)return toast('Ingrediente repetido na fórmula');
  if(!ing.length)return toast('Adicione ao menos um ingrediente');
  const soma=sum(ing,g=>g.pct);
  if(Math.abs(soma-100)>.01)return toast('A soma das inclusões é '+fmt(soma,2)+'% — precisa ser 100%');
  if(S.formulas.some(f=>f.nome.toLowerCase()===nome.toLowerCase()&&f.id!==FD.id))return toast('Já existe uma formulação com esse nome');
  const o={nome,tipo:FD.tipo,ativa:FD.ativa,ing};
  if(FD.id)Object.assign(formula(FD.id),o);else S.formulas.push(Object.assign({id:uid()},o));
  save();closeModal();FD=null;render(false);toast('Formulação salva');
};
function btSave(){
  btRead();
  const c=btCalc();
  if(!c)return toast('Escolha a fórmula');
  if(!BT.data)return toast('Informe a data');
  if(!(c.q>0))return toast('Informe a quantidade a fabricar');
  if(Math.abs(sum(c.f.ing,g=>g.pct)-100)>.01)return toast('A fórmula não soma 100% — corrija em Formulações');
  if(!(c.tr>0)){c.rows.forEach(r=>{BT.real[r.id]=String(r2(r.pl))});updBatida();return toast('Realizado vazio: preenchi com o planejado. Confira e salve de novo.')}
  const dist=BT.dist.filter(d=>d.areaId||num(d.kg));
  if(dist.some(d=>!d.areaId||!(num(d.kg)>0)))return toast('Complete pasto e kg em cada linha da distribuição');
  if(!dist.length)return toast('Distribua a ração em ao menos um pasto');
  if(sum(dist,d=>num(d.kg))>c.tr*1.0001)return toast('Você distribuiu mais do que produziu ('+fmt(c.tr,1)+' kg)');
  const bid=uid(),snap=c.f.ing.map(g=>({id:g.id,pct:num(g.pct)}));
  S.batidas.push({id:bid,data:BT.data,formulaId:c.f.id,formulaNome:c.f.nome,qtd:c.q,snap,real:c.rows.map(r=>({id:r.id,kg:r2(r.rl)})),custoKg:r2(c.vkg*1000)/1000,total:r2(c.tv),dist:dist.map(d=>({areaId:d.areaId,kg:num(d.kg)}))});
  dist.forEach(d=>S.forn.push({id:uid(),batidaId:bid,areaId:d.areaId,data:BT.data,formulaId:c.f.id,nome:c.f.nome,kg:num(d.kg),valor:r2(num(d.kg)*c.vkg),snap}));
  const fid=c.f.id;BT={formulaId:fid,qtd:'',data:hoje(),real:{},dist:[]};
  save();toast('Batida salva · fornecimento lançado');location.hash='#hist';
}

/* ===== ações ===== */
const ACT={
  close:()=>closeModal(),
  go:d=>{location.hash='#'+d.v},
  novoLote:()=>mLote(),lote:d=>mLote(d.id),
  novoAnimal:()=>mAnimal(),animal:d=>mAnimal(d.id),
  novaArea:()=>mArea(),area:d=>mArea(d.id),
  novoInsumo:()=>mInsumo(),insumo:d=>mInsumo(d.id),
  novaCompra:()=>mCompra(),compra:d=>mCompra(d.id),
  novaFormula:()=>mFormula(),formula:d=>mFormula(d.id),
  forn:d=>mForn(d.id),
  fhist:d=>{fHist=d.f;render(false)},
  fmAdd:()=>{readFD();FD.rows.push({id:'',pct:''});renderFormula()},
  fmRm:d=>{readFD();FD.rows.splice(+d.i,1);if(!FD.rows.length)FD.rows.push({id:'',pct:''});renderFormula()},
  btAdd:()=>{btRead();BT.dist.push({areaId:'',kg:''});render(false)},
  btRm:d=>{btRead();BT.dist.splice(+d.i,1);render(false)},
  btPlan:()=>{btRead();const c=btCalc();c.rows.forEach(r=>{BT.real[r.id]=String(r2(r.pl))});render(false)},
  btSug:()=>{
    btRead();
    const m=new Map();
    S.lotes.filter(l=>loteCalc(l).st==='ativo'&&l.areaId).forEach(l=>m.set(l.areaId,(m.get(l.areaId)||0)+loteCalc(l).consHojeL));
    if(!m.size)return toast('Nenhum lote ativo hoje');
    BT.dist=[...m].map(([areaId,kg])=>({areaId,kg:String(Math.round(kg))}));
    if(!num(BT.qtd))BT.qtd=String(Math.round(sum(BT.dist,d=>d.kg)));
    render(false);toast('Distribuição sugerida pelo consumo previsto de hoje');
  },
  btSave:()=>btSave(),
  csv:()=>{
    const nome=h=>{const a=area(h.areaId);return a?a.nome:''};
    const L=[['Pasto','Data','Fórmula','kg fornecido','Valor (R$)','Ingredientes']].concat(S.forn.slice().sort((a,b)=>a.data<b.data?-1:1).map(h=>[nome(h),h.data,h.nome,String(h.kg).replace('.',','),String(h.valor).replace('.',','),(h.snap||[]).map(g=>{const i=insumo(g.id);return (i?i.nome:'?')+' '+fmt(g.pct,1)+'%'}).join(' | ')]));
    const csv='﻿'+L.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='fornecimento-'+hoje()+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
  },
  saveCfg:()=>{
    if(!isAdmin())return toast('Somente administradores');
    const n=$('#cf-nome').value.trim();if(n)S.cfg.fazenda=n;
    ['categorias','catAnimal','racas','tipos'].forEach(k=>{const v=$('#ls-'+k).value.split('\n').map(x=>x.trim()).filter(Boolean);if(v.length)S.cfg.listas[k]=v});
    save();render(false);toast('Ajustes salvos');
  },
  install:async()=>{if(deferredInstall){deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;render(false)}},
  logout:()=>{if(AUTH)AUTH.out()},
  loginCreate:()=>authDo('create'),
  del:(d,t)=>{
    if(!isAdmin())return toast('Somente administradores podem excluir');
    if(!t.dataset.arm){t.dataset.arm=1;t.textContent='Toque de novo para confirmar a exclusão';return}
    const k=d.k,id=d.id;
    if(k==='lotes'&&S.animais.some(a=>a.loteId===id))S.animais.forEach(a=>{if(a.loteId===id)a.loteId=''});
    if(k==='areas'&&(S.lotes.some(l=>l.areaId===id)||S.forn.some(h=>h.areaId===id)))return toast('Área em uso por lote ou histórico — não dá para excluir');
    if(k==='insumos'&&(S.compras.some(c=>c.insumoId===id)||S.formulas.some(f=>f.ing.some(g=>g.id===id))))return toast('Insumo tem compras ou está em formulação — não dá para excluir');
    if(k==='batidas')S.forn=S.forn.filter(h=>h.batidaId!==id);
    S[k]=S[k].filter(x=>x.id!==id);
    save();closeModal();render(false);toast('Excluído');
  }
};

/* ================= eventos ================= */
document.addEventListener('click',e=>{
  if(e.target.id==='modal'){closeModal();return}
  const t=e.target.closest('[data-act]');if(!t)return;
  if(ACT[t.dataset.act]){ACT[t.dataset.act](t.dataset,t,e)}
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  if(f.dataset.form==='login'){authDo('in');return}
  FORMS[f.dataset.form]();
});
document.addEventListener('input',e=>{
  const id=e.target.id||'';
  if(id.startsWith('bt-')){btRead();updBatida()}
  else if(id==='an-q'){const q=e.target.value.toLowerCase();document.querySelectorAll('tr[data-s]').forEach(r=>r.style.display=r.dataset.s.includes(q)?'':'none')}
  else if(['an-n','an-p','an-v'].includes(id)&&$('#an-calc'))$('#an-calc').innerHTML=animalPanel();
  else if(id.startsWith('lt-')&&$('#lt-calc'))$('#lt-calc').innerHTML=lotePanel(readLote());
  else if(id.startsWith('fp-'))updFormula();
  else if(id==='ar-m')$('#ar-ha').textContent=fmt(num(e.target.value)/10000,2)+' hectares';
  else if(id==='cp-q'||id==='cp-p')$('#cp-t').textContent=brl(num($('#cp-q').value)*num($('#cp-p').value));
});
document.addEventListener('change',e=>{
  const id=e.target.id||'';
  if(id==='bt-f'){BT.formulaId=e.target.value;BT.real={};btRead2();render(false)}
  else if(id.startsWith('bt-')){btRead();updBatida()}
  else if(id.startsWith('fi-')||id==='fm-t'||id==='fm-a')updFormula();
});
function btRead2(){BT.qtd=$('#bt-q')?$('#bt-q').value:BT.qtd;BT.data=$('#bt-d')?$('#bt-d').value:BT.data}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
window.addEventListener('online',()=>{chrome();toast('Conexão restabelecida')});
window.addEventListener('offline',()=>{chrome();toast('Sem internet — tudo continua funcionando')});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(view==='config')render(false)});
window.addEventListener('hashchange',()=>{closeModal();render(true)});

function render(top){
  if(!S)return;
  const h=(location.hash||'#painel').slice(1);
  const novo=VIEWS[h]?h:'painel';
  if(novo!==view)top=true;
  view=novo;
  const y=window.scrollY;
  $('#view').innerHTML=VIEWS[view]();
  chrome();
  window.scrollTo(0,top?0:y);
}

/* ================= Firebase: login + sincronização ================= */
const canon=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.fromEntries(Object.entries(v).sort(([a],[b])=>a<b?-1:a>b?1:0)):v);
const clean=o=>JSON.parse(JSON.stringify(o));
function docsOf(){
  const m=new Map();
  m.set('cfg/main',S.cfg);
  COLS.forEach(c=>S[c].forEach(o=>{if(!o.id)o.id=uid();m.set(c+'/'+o.id,o)}));
  return m;
}
function flush(){
  if(!FB.on||!FB.ready||!S||!DB)return;
  const want=docsOf();
  want.forEach((o,p)=>{
    const j=canon(o);
    if(SYNC.last.get(p)!==j){SYNC.last.set(p,j);FS.setDoc(FS.doc(DB,p),clean(o)).catch(e=>toast(msgFS(e)))}
  });
  [...SYNC.last.keys()].forEach(p=>{
    if(!want.has(p)){SYNC.last.delete(p);FS.deleteDoc(FS.doc(DB,p)).catch(e=>toast(msgFS(e)))}
  });
}
function rebuild(){
  const c=SYNC.remote.cfg.get('main'),e=emptyState(),vals=n=>[...SYNC.remote[n].values()];
  const cfg=c&&c.ver===3?c:e.cfg;
  cfg.listas=Object.assign({},LISTAS0,cfg.listas||{});
  S={v:3,cfg,areas:vals('areas').sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR',{numeric:true})),lotes:vals('lotes'),animais:vals('animais'),insumos:vals('insumos').sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR')),
     compras:vals('compras'),formulas:vals('formulas').sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR')),batidas:vals('batidas'),forn:vals('forn')};
}
function goReady(seeded){
  clearTimeout(SYNC.timer);FB.ready=true;
  if(seeded){SYNC.seeded=true;flush()}else rebuild();
  render(true);
}
const temV3=()=>{const c=SYNC.remote.cfg.get('main');return !!(c&&c.ver===3)};
const needSeed=()=>SYNC.serverCfg&&!SYNC.seeded&&!temV3()&&!SYNC.remote.areas.size&&!SYNC.remote.lotes.size;
function tryReady(){
  if(SYNC.got.size<COLS.length+1)return;
  if(temV3())return goReady(false);
  if(needSeed()){S=seed();goReady(true)}
}
function onSnap(name,snap){
  const m=SYNC.remote[name];m.clear();
  [...SYNC.last.keys()].forEach(k=>{if(k.startsWith(name+'/'))SYNC.last.delete(k)});
  snap.forEach(d=>{const o=d.data();m.set(d.id,o);SYNC.last.set(name+'/'+d.id,canon(o))});
  if(name==='cfg'&&!snap.metadata.fromCache)SYNC.serverCfg=true;
  SYNC.got.add(name);
  if(!FB.ready)tryReady();
  else if(needSeed()){S=seed();SYNC.seeded=true;flush();render(true)}
  else{rebuild();if(!$('#modal')||$('#modal').classList.contains('hidden'))render(false)}
}
function startSync(){
  stopSync();
  SYNC.remote={cfg:new Map()};COLS.forEach(c=>SYNC.remote[c]=new Map());
  SYNC.got=new Set();SYNC.serverCfg=false;SYNC.seeded=false;
  S=emptyState();
  $('#view').innerHTML='<div class="empty">Sincronizando…</div>';
  ['cfg'].concat(COLS).forEach(n=>{
    SYNC.unsubs.push(FS.onSnapshot(FS.collection(DB,n),snap=>onSnap(n,snap),e=>toast(msgFS(e))));
  });
  SYNC.timer=setTimeout(()=>{if(!FB.ready){rebuild();FB.ready=true;render(true);toast('Sem resposta do servidor — mostrando dados do aparelho')}},7000);
}
function stopSync(){
  SYNC.unsubs.forEach(u=>{try{u()}catch(e){}});SYNC.unsubs=[];clearTimeout(SYNC.timer);SYNC.last.clear();FB.ready=false;
}
function msgAuth(x){
  const c=(x&&x.code)||'';
  return ({'auth/invalid-credential':'E-mail ou senha incorretos.','auth/wrong-password':'E-mail ou senha incorretos.','auth/user-not-found':'E-mail ou senha incorretos. No primeiro acesso, use “criar conta”.',
   'auth/email-already-in-use':'Este e-mail já tem conta. Use “Entrar”.','auth/weak-password':'Use uma senha com pelo menos 6 caracteres.','auth/invalid-email':'E-mail inválido.',
   'auth/network-request-failed':'Sem conexão com a internet.','auth/operation-not-allowed':'Login por e-mail/senha não está ativado no Firebase.','auth/invalid-api-key':'Chave do Firebase inválida — confira o apiKey no código.',
   'auth/api-key-not-valid.-please-pass-a-valid-api-key.':'Chave do Firebase inválida — confira o apiKey no código.','auth/too-many-requests':'Muitas tentativas. Aguarde um pouco.'})[c]||('Não foi possível entrar ('+(c||'erro')+').');
}
function msgFS(x){
  const c=(x&&x.code)||'';
  if(c==='permission-denied')return 'Sem permissão no Firestore — confira as regras do banco.';
  if(c==='not-found')return 'Banco Firestore não encontrado — crie o banco no console.';
  if(c==='unavailable')return 'Servidor indisponível — salvo no aparelho, sincroniza depois.';
  return 'Firestore: '+(c||'erro');
}
async function authDo(kind){
  const e=$('#lg-e').value.trim(),pw=$('#lg-s').value,er=$('#lg-err');er.textContent='';
  if(!AUTH){er.textContent='O Firebase não carregou. Verifique a conexão.';return}
  try{if(kind==='in')await AUTH.signIn(e,pw);else await AUTH.create(e,pw)}catch(x){er.textContent=msgAuth(x)}
}
async function boot(){
  let mods=null;
  try{mods=await Promise.all(['app','auth','firestore'].map(n=>import('https://www.gstatic.com/firebasejs/'+FBV+'/firebase-'+n+'.js')))}catch(e){mods=null}
  if(!mods){FB.on=false;load();render(true);toast('Modo local: o Firebase não carregou');return}
  const [A,Au,F]=mods;
  const app=A.initializeApp(FIREBASE_CONFIG);
  const auth=Au.getAuth(app);
  try{DB=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}catch(e){DB=F.getFirestore(app)}
  FS=F;
  AUTH={signIn:(e,p)=>Au.signInWithEmailAndPassword(auth,e,p),create:(e,p)=>Au.createUserWithEmailAndPassword(auth,e,p),out:()=>Au.signOut(auth)};
  FB.on=true;
  Au.onAuthStateChanged(auth,user=>{
    FB.user=user;
    if(user){$('#login').classList.add('hidden');startSync()}
    else{
      stopSync();S=null;BT=null;FD=null;closeModal();
      $('#view').innerHTML='';$('#top').innerHTML='';$('#tabs').innerHTML='';$('#side').innerHTML='';
      $('#lg-s').value='';$('#lg-err').textContent='';$('#login').classList.remove('hidden');
    }
  });
}
boot();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
})();
